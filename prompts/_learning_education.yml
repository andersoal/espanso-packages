      - prompts

  - trigger: :learn-ooda-loop-action-plan
    form: |
      ROLE: You are a strategic-tactical consultant business coach.

      PROBLEM: [[problem]]

      GOAL: Analyze by using the OODA loop: the cycle of observe, orient, decide, act.

      STEPS:

          Observe: gather information about the environment, the adversary, the decision-maker, the context, etc.

          Orient: evaluate the threat, make logical connections, decide on focus, and get inside the mind of the adversary so strategies can be oriented against the adversary's capabilities.

          Decide: choose a course of action to pursue, balancing the need to make rapid decisions and the need to make careful choices.

          Act: Execute quickly and immediately, then return to the Observe step, in order to analyze the changes, including the adversary's reactions.

      ACTIONS:

          Identify the problem
          Measure the problem
          Analyze the problem
          Create action plans
          Execute action plans
          Verify the results
          Measure the results
          Analyze the results
          Create improvement plans
          Execute improvement plans

      OUTPUT: A strategic-tactical action plan.
    form_fields:
      problem:
        multiline: true
    label: '[Prompts] OODA Loop Strategy (Observe Orient Decide Act Execution)'
    # ROLE: You are a strategic-tactical consultant business coach.
    search_terms:
      - prompts

