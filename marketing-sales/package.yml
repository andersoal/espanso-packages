  - trigger: :pniche
    replace: |
      Here are the industries to evaluate:
      {{my_clipboard}}

      Which industry spends the most on manual tasks that A.I tools under ${{form1.budget}}/mo could handle? Rank them by potential savings and tell me who the decision maker is.
    vars:
      - name: my_clipboard
        type: clipboard
      - name: form1
        type: form
        params:
          layout: |
            Select monthly tool budget threshold:
            [[budget]]
          fields:
            budget:
              type: choice
              values:
                - '50'
                - '100'
                - '250'
                - '500'
    label: '[Marketing & Sales] Here Are The Industries To Evaluate'
    comment: 'Here are the industries to evaluate:'
    search_terms:
      - marketing-sales
      - marketing & sales
