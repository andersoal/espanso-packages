      - Am I deciding from logic or emotion right now?
      - What is the fear behind the cautious option?
      - What is the desire behind the bold option?
      - If my best friend described why I made this
        decision, what would they say?

      SECTION 4 — THE PRE-MORTEM
      - If this goes wrong in 1 year, what was the
        most likely reason?
      - If this goes right in 1 year, what made it work?
      - What is the worst realistic outcome — and
        can I live with it?

