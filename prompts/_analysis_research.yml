  - triggers:
      - :p-8-hardest-prompts
      - :p-hard-tasks-guide
      - :hard-prompts-guide
    replace: |
      # 8 Hardest Tasks for LLMs & The Prompts That Worked

      ### 1. Honest Work Feedback (Brutal Editor) — `:p-brutal-editor`
      "You are a brutally honest editor who has seen thousands of pieces of work and has no patience for anything mediocre. Do not soften your feedback. Do not start with what's working. Tell me the single biggest problem with this piece and exactly why it matters. Then tell me three more things wrong with it. Only after that, if something is genuinely strong, mention it. Here is the work: [paste]"

      ### 2. Real Decision (Recommendation > Pros & Cons) — `:p-make-decision`
      "I need to make a real decision, not read a pros and cons list. Here is my situation: [describe]. Here are the options I'm choosing between: [list]. Based on what I've told you, what would you actually do if you were me? Give me a direct recommendation first, then explain the reasoning. If you genuinely cannot recommend one option over another, tell me exactly what information I'm missing that would let you decide."

      ### 3. Personal Voice Calibration (3 Writing Samples) — `:p-my-voice`
      "Before you write anything, I'm going to give you three samples of my writing. Study them for: how long my sentences typically run, whether I use contractions, how formal or casual my vocabulary is, what I tend to leave out, and where I place emphasis. Then I'll give you the task. Do not write until you've confirmed you understand the pattern. Sample 1: [paste] Sample 2: [paste] Sample 3: [paste] Now write [task] in that style. If a draft sounds like a generic AI, scrap it and try again."

      ### 4. Blind Spot Detection (Unstated Assumptions) — `:p-blind-spot`
      "I'm going to describe a situation where I'm not getting the results I want. But I want you to assume I'm part of the problem — probably more than I think. Do not accept my framing of the situation. Look for what I'm not saying. Look for what my own description reveals about my blind spots. What am I probably doing wrong that I didn't mention? What assumption am I making that you'd challenge? Here's the situation: [describe]"

      ### 5. Non-Obvious Ideas (Skip First 10) — `:p-non-obvious-ideas`
      "Generate 20 ideas for [topic]. Rules: the first 10 don't count. I already know those. Start at number 11 — ideas that wouldn't appear in the first page of Google results on this topic, that most people in this space haven't tried, that feel slightly counterintuitive or uncomfortable. Prioritise strange over safe. I can filter later."

      ### 6. Emotional Sounding Board (Sequential Inquiry) — `:p-emotional-sounding-board`
      "I want to think through something that's bothering me. I do not want advice yet. I do not want a list of coping strategies. I want you to ask me questions — one at a time — that help me understand what I'm actually feeling and why. Stay curious. Don't jump to fixing anything. When you think I've arrived at something real, reflect it back to me and ask if that's right."

      ### 7. 3-Step Deep Learning (Analogy Breakdown & Test) — `:p-3step-learn`
      "Do not explain [concept] to me. Instead: give me a 3-step learning sequence. Step 1 — the simplest possible analogy that captures the core mechanic, not the full picture. Step 2 — the place where that analogy breaks down and why. Step 3 — one concrete exercise I can do in the next 10 minutes that would let me actually test whether I understand it. Don't move to the next step until I confirm I've got the previous one."

      ### 8. Calibrated Uncertainty (Fact Confidence Tags) — `:p-confidence-tags`
      "For every factual claim in your response, mark it with one of three tags: [CONFIDENT] — you're certain this is accurate, [PROBABLY] — you believe this but it should be verified, [UNSURE] — this might be wrong or outdated. If a claim is [UNSURE], say so explicitly before stating it. Do not omit the tags to keep the response clean. I would rather a messier response I can trust than a clean one I can't."
    label: '[Prompts] 8 Hardest LLM Tasks Guide (Curated Anti-Default Prompt Cheatsheet)'
    # Quick-reference overview of all 8 counter-default prompt techniques from the ChatGPT Prompt Genius collection.
    search_terms:
      - prompts
      - 8-hardest
      - guide
      - cheatsheet
      - counter-default
      - meta-prompt

