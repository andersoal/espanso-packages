      their_pricing:
        multiline: true
      their_marketing_approach:
        multiline: true
      my_advantages:
        multiline: true
      my_resources:
        multiline: true
    label: "[Prompts] Competitor Analysis Assassin (Exploitation & Positioning Plan)"
