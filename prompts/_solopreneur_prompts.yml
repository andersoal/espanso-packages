  - trigger: :solo-launch
    form: |
      You are four experts collaborating: a product launch specialist who's done 50+ successful launches, a growth marketer focused on launch mechanics, a community builder who creates pre-launch buzz, and a conversion optimizer who maximizes launch day revenue.

      Launch Success Metrics:
      - Pre-launch list growth: 500+ signups
      - Launch day revenue: $50K+ (or 2x your goal)
      - First week sustained engagement: 60%+
      - Media mentions/shares: 50+
      - Customer acquisition cost: 50% below normal
      - Word-of-mouth coefficient: 1.2+ (each customer brings 1.2 more)

      Launch Details:
      Product Launching: [[product_description]]
      Price Point: [[price_point]]
      Target Audience: [[target_audience]]
      Launch Timeline: [[launch_timeline]]
      Current Audience Size: [[current_audience_size]]
      Budget: [[budget]]
      Competition: [[competition]]
      Unique Selling Proposition: [[unique_selling_prop]]

      Pre-Launch to Launch Sequence:
      - 14 Days Out (Build Curiosity): Tease the problem your product solves without revealing solution. Share cryptic behind-the-scenes content. Start countdown. Launch waitlist/early access signup. Create scarcity angle (limited spots, pricing, or bonuses). Detail specific tactics, channels, and messaging.
      - 7 Days Out (Behind-the-Scenes Reveal): Pull back curtain on creation process. Share founder story or mission. Introduce team. Build emotional connection. Give waitlist first look/exclusive preview. Start generating social proof (beta tester testimonials). Detail specific tactics, channels, and messaging.
      - 3 Days Out (Social Proof Blast): Release case studies, testimonials, and early results. Create FOMO with "almost sold out" or "prices going up" messages. Activate affiliates and partners. Do podcast tour or press push. Build anticipation to fever pitch. Detail specific tactics, channels, and messaging.
      - Launch Day (Multiple Touchpoints): Email sequence (Morning announcement, midday social proof, evening last call). Social media blitz across all platforms. Host live event (webinar, Q&A, demo). Activate your community as megaphone. Offer launch-day-only bonuses. Create shared experience (launch party vibe). Detail hourly plan.
      - Days 2-3 (Urgency and FOMO): Countdown to bonus expiration or price increase. Share real-time sales numbers/customer wins. Address objections publicly. Create FOMO through "selling fast" updates. Stack value with surprise bonuses.
      - Days 4-7 (Last Chance): Final countdown. Last call messaging. "Cart closing" narrative. Share customer success stories from first buyers. Create genuine urgency (not artificial). Close strong with compelling reason to buy now.

      Launch Strategy Quality Assessment: Rate on tactical specificity (can you execute immediately?), channel optimization (right tactics for right channels?), timing logic (proper momentum build?), and revenue potential (will this hit your goals?). Revise anything below 8/10.
    form_fields:
      product_description:
        multiline: true
      price_point:
        default: ""
      target_audience:
        multiline: true
      launch_timeline:
        default: ""
      current_audience_size:
        default: ""
      budget:
        default: ""
      competition:
        multiline: true
      unique_selling_prop:
        multiline: true
    label: "[Prompts] Phased Launch Engine (14-Day Curiosity to Cart Close)"
    # Architect an end-to-end 14-day product launch campaign from pre-buzz teasers to cart closing urgency.
    search_terms:
      - prompts
      - solopreneur
      - launch
      - marketing
      - product launch
      - campaign

