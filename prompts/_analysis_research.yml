matches:
  - regex: :as\((?P<role>[^,]+),(?P<topic>.*)\)
    replace: Act as an expert {{role}}. Write a comprehensive breakdown detailing {{topic}}.
    label: '[Prompts] Expert Persona Breakdown (Role & Topic Detailed Analysis)'
    # Act as an expert {{role}}. Write a comprehensive breakdown detailing {{topic}}.
    search_terms:
      - prompts

  - trigger: :pca-custom
    form: |
      Create a clean, elegant personal color analysis infographic based on this portrait. Place the person's face on the left side in a soft rounded frame, keeping their natural features, skin tone, and lighting realistic without altering identity. Automatically analyze their undertone (cool, warm, or neutral), contrast level, and overall coloring, then assign a suitable seasonal type (such as Cool Winter, Warm Autumn, Soft Summer, or Clear Spring). Use this analysis to generate a short statement like “You glow in [undertone + color characteristic] colors,” along with a few concise bullet points describing undertone, contrast, best color intensity, jewelry preference, and ideal neutrals.

      On the right side, design a structured infographic layout with clear sections. Include a Makeup Color Palette featuring foundation tones, blush, eyeshadow, highlight, and lipstick shades that harmonize with the subject's coloring, plus a small “avoid” section for clashing tones. Add a Clothing Color Palette with organized color grids (neutrals from light to dark, main colors, accent colors, and avoid tones), as well as recommended metallics. Provide simple visual examples of outfits categorized into “Best,” “Good,” and “Avoid,” using faceless models or minimal fashion illustrations.

      Complete the infographic with a Glasses Guide showing suitable frame shapes based on face shape and recommended colors based on undertone, including a small diagram. Add a short Overall Look Vibe section describing the ideal style direction (e.g., fresh, bold, soft, high contrast).

      Maintain a [[aesthetic]] aesthetic with a [[background]] background, clean modern typography, balanced spacing, rounded elements, and subtle shadows. Ensure the final result is visually polished, cohesive, and high resolution, suitable for Pinterest or professional branding.
    form_fields:
      aesthetic:
        default: minimalist, high-end beauty magazine
      background:
        default: soft neutral (beige or light gray)
    label: '[Prompts] Color Analysis Infographic (Aesthetic & Seasonal Palette)'
    # Create a clean, elegant personal color analysis infographic based on this portrait. Place the person's face on the left
    search_terms:
      - prompts

  - trigger: :p-deeper
