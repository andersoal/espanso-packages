  - trigger: :sj.val
    replace: |
      ### 1. Crie uma Proposta de Valor Única
      * **Diferencie seu produto**
      * **Destaque os aspectos de resolução de problemas únicos**
      * **Comunique paixão pela sua oferta**

      > "Você tem que encontrar o que ama. E isso é tão verdade para o seu trabalho quanto para os seus amantes." — Steve Jobs
    label: '[Marketing & Sales] Solution-Problem Fit Validation Interview'
    comment: '### 1. Crie uma Proposta de Valor Única'
    search_terms:
      - marketing-sales
      - marketing & sales
  - trigger: :sj.ben
    replace: |
      ### 2. Foque nos Benefícios, Não nos Recursos
      * **Enfatize como o produto melhora vidas**
      * **Traduza as especificações em vantagens para o cliente**
      * **Venda a experiência, não apenas o produto**

      > "Você tem que começar com a experiência do cliente e, a partir dela, trabalhar em direção à tecnologia – e não o contrário." — Steve Jobs
    label: '[Marketing & Sales] Foque nos Benefícios, Não nos Recursos'
    comment: '### 2. Foque nos Benefícios, Não nos Recursos'
    search_terms:
      - marketing-sales
      - marketing & sales
  - trigger: :sj.sim
    replace: |
      ### 3. Mantenha sua Mensagem Simples
      * **Crie apresentações claras e concisas**
      * **Evite sobrecarregar com detalhes técnicos**
      * **Destile ideias complexas em mensagens simples**

      > "Esse tem sido um dos meus mantras — foco e simplicidade. O simples pode ser mais difícil que o complexo." — Steve Jobs
    label: '[Marketing & Sales] Mantenha sua Mensagem Simples'
    comment: '### 3. Mantenha sua Mensagem Simples'
    search_terms:
      - marketing-sales
      - marketing & sales
  - trigger: :sj.story
    replace: |
      ### 4. Conte uma História Envolvente
      * **Use narrativas para tornar os produtos relacionáveis**
      * **Conecte-se emocionalmente com seu público**
      * **Compartilhe histórias de sucesso impactantes**

