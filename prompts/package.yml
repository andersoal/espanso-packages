      Act as a seasoned business strategist, market researcher, and devil's advocate combined. I need you to ruthlessly but constructively analyze my idea/business concept in extreme detail. Here's my idea: [[YOUR_IDEA_BUSINESS_CONCEPT]] Please provide a comprehensive analysis covering these areas:

       FOUNDATIONAL ANALYSIS • Break down the core assumptions my idea relies on • Identify any logical fallacies or weak foundations • Assess whether the problem I'm solving actually exists and is significant • Evaluate if my proposed solution actually solves the stated problem • Point out any gaps between problem and solution

       MARKET VALIDATION • Who is my actual target market (be specific about demographics, psychographics, and behaviors)? • What's the realistic market size and addressable market? • Analyze existing competitors and how they're currently serving this market • Identify market trends that could help or hurt this idea • Assess market timing - am I too early, too late, or just right?

       BUSINESS MODEL SCRUTINY • How will this actually make money (be specific about revenue streams)? • What are the unit economics and scalability potential? • Identify all cost centers and potential hidden costs • Assess capital requirements and funding needs • Evaluate profit margins and path to profitability

       OPERATIONAL REALITIES • What resources, skills, and infrastructure do I actually need? • Identify potential operational bottlenecks or challenges • Assess supply chain risks and dependencies • Evaluate technology requirements and technical feasibility • Consider regulatory, legal, or compliance issues

       COMPETITIVE LANDSCAPE • Who are my direct and indirect competitors? • What's my actual competitive advantage (if any)? • How easily could competitors replicate or improve on my idea? • Identify potential threats from established players entering my space • Assess barriers to entry for both me and future competitors

       RISK ANALYSIS • List the top 10 things that could kill this business • Identify market risks, execution risks, and external risks • Assess financial risks and cash flow challenges • Consider reputation and brand risks • Evaluate team and human capital risks

       BEST CASE SCENARIO • What does wild success look like in 1, 3, and 5 years? • What conditions would need to align for this outcome? • Quantify the potential upside (revenue, market share, impact) • Identify the key success factors and milestones

       WORST CASE SCENARIO • What does complete failure look like? • What are the most likely failure modes? • How much could I lose (time, money, opportunity cost)? • What would be the warning signs of impending failure? • How could I minimize losses if things go wrong?

       VALIDATION ROADMAP • What specific tests/experiments should I run to validate key assumptions? • How can I validate market demand before fully committing? • What metrics should I track to measure early traction? • Suggest low-cost ways to test the concept • Recommend validation milestones before scaling

       EXECUTION REQUIREMENTS • What skills, team members, or advisors do I absolutely need? • Create a realistic timeline for key milestones • Identify the minimum viable product (MVP) requirements • Suggest the optimal launch strategy • Recommend resource allocation priorities

       NAMING AND POSITIONING • Suggest 5-10 potential names for this business/idea with rationale • How should I position this in the market? • What's the unique value proposition in one sentence? • How should I message this to different stakeholder groups? • Identify potential branding challenges or opportunities

       IMPROVEMENT RECOMMENDATIONS • How could I strengthen the foundational concept? • What pivots or modifications might improve viability? • Suggest additional revenue streams or business model variations • Recommend strategic partnerships or alliances • Identify opportunities to create stronger competitive moats

       GO/NO-GO DECISION FRAMEWORK • Based on this analysis, rate the idea's viability (1-10) and explain why • What would need to change for you to rate it higher? • Under what conditions would you recommend pursuing this? • Under what conditions would you recommend abandoning it? • Suggest alternative directions if this specific approach isn't viable Be brutally honest - I need to know the truth, not what I want to hear. Challenge my assumptions, poke holes in my logic, and help me see blind spots. If the idea has merit, tell me how to maximize its potential. If it's flawed, help me either fix it or recognize when to move on. Provide specific, actionable insights rather than generic advice. Use data and examples where relevant. End with a clear recommendation on next steps.
