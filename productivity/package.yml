  - trigger: :para-guide
    replace: |
      # 🧠 P.A.R.A. & C.O.D.E. Second Brain Reference

      > "The purpose of building a second brain is not just to store information, but to make it useful and accessible to improve the quality of your work and life." — Tiago Forte

      ---

      ## 🔄 The C.O.D.E. Method (Information Lifecycle)
      - **Capture**: Proactively collect high-resonance ideas, notes, quotes, and insights.
      - **Organize**: Store information where it will be actionable, not just where you found it.
      - **Distill**: Summarize, highlight, and extract the core essence into bite-sized takeaways.
      - **Express**: Transform gathered knowledge into creative output, decisions, and shipped work.

      ---

      ## 📁 The P.A.R.A. Method (Hierarchy of Actionability)
      1. **Projects** *(Highest Actionability)*:
         - Series of tasks linked to a specific goal with a strict deadline.
         - *Examples:* Launching a feature, preparing conference keynote, publishing RFC.
      2. **Areas** *(Ongoing Responsibility)*:
         - Spheres of activity with a standard to maintain over time, with no end date.
         - *Examples:* Health & Fitness, Personal Finances, Team Leadership, Product Architecture.
      3. **Resources** *(Topics of Ongoing Interest)*:
         - Collections of references, research, guides, and learning materials.
         - *Examples:* Espanso snippets, DataWeave patterns, UI design systems, book summaries.
      4. **Archive** *(Inactive / Completed)*:
         - Inactive items from the other three categories preserved for future lookup.
         - *Examples:* Completed client projects, retired systems docs, past year taxes.

      ---

      ## 🛠️ Tool Ecosystem
      - **Notes & Knowledge**: Obsidian, Notion, Roam Research, Logseq
      - **Project Management**: Linear, Todoist, Trello, Asana
      - **Storage & Cloud**: Local Markdown Vault, Google Drive, GitHub

      ## 💡 Practical Rules
      1. Dedicate 20 minutes weekly to review and organize your digital second brain.
      2. Be flexible: folders evolve as priorities shift.
      3. Don't hoard data—always optimize for rapid retrieval and expression.
    label: "[Productivity] P.A.R.A. & C.O.D.E. Second Brain Architecture Guide"
    # Comprehensive cheat sheet and workflow reference for Tiago Forte's P.A.R.A. and C.O.D.E. methodology.
    search_terms:
      - productivity
      - para
      - code
      - second-brain
      - obsidian
      - notion

