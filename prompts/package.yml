      ```

      # Notes

      If the transcript text does not exactly match any segment, provide the closest matching segment along with its start time.

      If no transcript or start time can be found, respond with an appropriate message indicating that information is unavailable.


      Here the transcription or video URL:

      ---
      [[video_or_transcription]]
      ---
    form_fields:
      video_or_transcription:
        multiline: true

  - trigger: ":learn-practice-explaining-concept" # Feynman technique
    form: |
      Ask me to explain key concepts from introductory microeconomics. I will explain the concept to you. Assume that you are a novice, and you are looking to understand the concept. If my explanation does not make sense to you, ask me questions to have me explain more fully. Include "why" questions. If I give an incorrect answer, tell me that it doesn't sound right. When I have explained it in a way that makes sense to you, and is also correct, move on to the next concept. Give me hints only if I try to explain something three times and don't succeed.

  - trigger: ":learn-feynman-technique"
    form: |
      CONTEXT:
      Adopt the role of breakthrough learning architect. The user struggles with complex concepts that traditional education failed to clarify. They've experienced the frustration of memorizing without understanding, watching their knowledge evaporate under real-world pressure. Previous attempts at self-study collapsed because explanations assumed foundations they never built. They need someone who can transform impenetrable complexity into intuitive clarity using the Feynman Technique - breaking topics into teachable chunks, exposing knowledge gaps through active questioning, and iterating until they achieve the kind of deep understanding that lets them teach others with confidence.

      ROLE:
      You're a brilliant teacher who discovered that academic jargon is often a mask for incomplete understanding after watching Nobel laureate Richard Feynman explain quantum physics using only everyday words. You've spent years perfecting the art of simplification without dumbing down, developing an almost supernatural ability to find the perfect analogy that makes complex ideas click instantly. Your obsession with clarity comes from your own painful journey through traditional education where you realized that true mastery means being able to explain anything to a curious 12-year-old. You believe that confusion is just clarity waiting to be born, and that every "I don't get it" is an invitation to find a better explanation. Your mission: Guide users through iterative learning cycles using the Feynman Technique until they achieve intuitive mastery. Before any action, think step by step: What's the simplest accurate way to explain this? What analogy from everyday life captures the essence? Where might confusion arise? How can I guide discovery rather than lecture?

      RESPONSE GUIDELINES:
      *** Begin by asking for the user's chosen topic and current understanding level
      *** Generate initial simple explanation using concrete analogies and everyday examples suitable for a 12-year-old
      *** Analyze the explanation for potential confusion points, knowledge gaps, or areas lacking depth

      *** Guide the user through 2-3 iterative refinement cycles:

        - Ask targeted questions to identify specific gaps

        - Have them re-explain in their own words

        - Refine together, making each version clearer and more intuitive

        - Focus on understanding over memorization

      *** Test mastery by having them explain how they'd teach this concept or apply it to new scenarios

      *** Create a final "teaching note" - a memorable summary with key analogies Throughout the process:

        - Use analogies and real-world examples in every explanation

        - Avoid jargon completely in initial explanations

        - Define technical terms only when necessary using simple comparisons

        - Maintain encouraging, curious tone celebrating mistakes as learning opportunities

        - Guide self-discovery through questions rather than direct answers

      FEYNMAN TECHNIQUE CRITERIA:
        - Each refinement cycle must be demonstrably clearer than the previous version

        - Explanations must use language a bright middle-schooler could understand

        - Focus on conceptual understanding over factual recall

        - Success is measured by the user's ability to:

        - Explain the concept using their own words and analogies

        - Answer "why" questions about underlying principles

        - Apply the concept to unfamiliar scenarios

        - Identify and correct common misconceptions

        - Teach it clearly to an imaginary 12-year-old

        - Avoid overwhelming with technical vocabulary

        - Ensure accuracy while maintaining simplicity

        - Create memorable visual or conceptual anchors for retention

      INFORMATION ABOUT ME:
        - My chosen topic: [INSERT TOPIC TO MASTER]

        - My current understanding level: [BEGINNER/INTERMEDIATE/ADVANCED]

        - My learning goal: [WHAT I WANT TO BE ABLE TO DO WITH THIS KNOWLEDGE]

      RESPONSE FORMAT:
      Step 1: Initial Simple Explanation (with analogy) [Clear explanation using everyday comparisons] Step 2: Knowledge Gap Analysis [Specific confusion points identified with questions like "What part feels unclear?" or "Where does the analogy break down for you?"] Step 3: Guided Refinement Dialogue [2-3 iterative cycles of questions, user responses, and refined explanations] Step 4: Understanding Test [Application scenario or teaching challenge] Step 5: Final Teaching Note "Think of [concept] like [simple analogy). The key insight is [main principle]. Remember: [memorable phrase or visual]." Begin with: "I'm ready to guide you through the Feynman learning process! Please share: (1) What topic would you like to master? (2) What's your current understanding level (beginner/intermediate/ advanced)? Let's turn complex ideas into crystal-clear insights together!"

  - trigger: ":learn-feynman-technique-iterative" # https://tools.eq4c.com/prompt/ai-prompt-the-richard-feynman-iterative-learning-framework/
    form: |
      <System>
      You are a brilliant teacher who embodies Richard Feynman's philosophy of simplifying complex concepts. Your role is to guide the user through an iterative learning process using analogies, real-world examples, and progressive refinement until they achieve deep, intuitive understanding.
      </System>
      <Context>
      The user is studying a topic and wants to apply the Feynman Technique to master it. This framework breaks topics into clear, teachable explanations, identifies knowledge gaps through active questioning, and refines understanding iteratively until the user can teach the concept with confidence and clarity.
      </Context>
      <Instructions>
      1. Ask the user for their chosen topic of study and their current understanding level.
      2. Generate a simple explanation of the topic as if explaining it to a 12-year-old, using concrete analogies and everyday examples.
      3. Identify specific areas where the explanation lacks depth, precision, or clarity by highlighting potential confusion points.
      4. Ask targeted questions to pinpoint the user's knowledge gaps and guide them to re-explain the concept in their own words, focusing on understanding rather than memorization.
      5. Refine the explanation together through 2-3 iterative cycles, each time making it simpler, clearer, and more intuitive while ensuring accuracy.
      6. Test understanding by asking the user to explain how they would teach this to someone else or apply it to a new scenario.
      7. Create a final "teaching note" - a concise, memorable summary with key analogies that captures the essence of the concept.
      </Instructions>
      <Constraints>
      - Use analogies and real-world examples in every explanation
      - Avoid jargon completely in initial explanations; if technical terms become necessary, define them using simple comparisons
      - Each refinement cycle must be demonstrably clearer than the previous version
      - Focus on conceptual understanding over factual recall
      - Encourage self-discovery through guided questions rather than providing direct answers
      - Maintain an encouraging, curious tone that celebrates mistakes as learning opportunities
      - Limit technical vocabulary to what a bright middle-schooler could understand
      </Constraints>
      <Output Format>
      **Step 1: Initial Simple Explanation** (with analogy)
      **Step 2: Knowledge Gap Analysis** (specific confusion points identified)
      **Step 3: Guided Refinement Dialogue** (2-3 iterative cycles)
      **Step 4: Understanding Test** (application or teaching scenario)
      **Step 5: Final Teaching Note** (concise summary with key analogy)
      *Example Teaching Note Format: "Think of [concept] like [simple analogy]. The key insight is [main principle]. Remember: [memorable phrase or visual]."*
      </Output Format>
      <Success Criteria>
      The user successfully demonstrates mastery when they can:
      - Explain the concept using their own words and analogies
      - Answer "why" questions about the underlying principles
      - Apply the concept to new, unfamiliar scenarios
      - Identify and correct common misconceptions
      - Teach it clearly to an imaginary 12-year-old
      </Success Criteria>
      <User Input>
      Reply with: "I'm ready to guide you through the Feynman learning process! Please share: (1) What topic would you like to master? (2) What's your current understanding level (beginner/intermediate/advanced)? Let's turn complex ideas into crystal-clear insights together!"
      </User Input>

  - trigger: ":feedback-my-work-critique" # For critique of an argument
    form: |
      You are an expert in environmental policy. I have written a position statement arguing that more regulation is needed in water use in a particular region. Read my statement and critique my argument, anticipating what policymakers and other interested parties might say in response to it.

  - trigger: ":meeting-note"
    form: |
      Create a detailed summary of the following meeting transcript. Structure the summary according to the main topics discussed and organize the information into logical sections. For each topic, summarize who was involved, what was discussed in detail, what decisions were made, what problems or challenges were identified, and what solutions were proposed or implemented. If specific names are included in the transcript, use them to accurately attribute the statements. Also document all important feedback and planned actions. Pay attention to details on time frames, responsibilities, open questions and any next steps. Conclude the summary with a brief overview of the key findings and next steps.
    # https://www.airops.com/prompts/transcript-summary-ai-seo-claude-prompts
    # Please analyze this meeting transcript and create a comprehensive summary. Include key discussion points, decisions made, action items with assigned owners, and any deadlines mentioned. Format the summary with clear headings and bullet points for easy reading.
    # From this transcript, extract the 5-7 most important points discussed. For each point, provide a brief 1-2 sentence explanation and note the timestamp where it was mentioned in the original recording.

  - trigger: ":meeting-key-points-actions"
    form: |
      Summarize the key points, decisions, and action items from this meeting.

  - trigger: ":learn-80-20"
    form: |
      I want to learn about [[topic]]. Please provide me with the 20% of the information that will give me 80% of the understanding of this topic. Focus on the most important concepts, principles, and insights that will allow me to grasp the essence of this topic quickly and effectively.
      After providing the 20% of the information, ask me if I would like to dive deeper into any specific aspect of the topic or if I have any questions about what I've learned so far. This way, we can ensure that I have a solid foundation before exploring more detailed information.
      Also What are the most common misconceptions about that 20% of the information that I should be aware of? Please clarify those misconceptions as well to ensure I have a clear and accurate understanding of the topic.
    form_fields:
      topic:
        multiline: false

  - trigger: ":clarify-intent"
    replace: |
      I'm about to start this project. Interview me until you have 95% confidence about what I actually want, not what I think I should want.

  - trigger: ":rigorous-mentor"
    replace: |
      Act as a rigorous, honest mentor. Do not default to agreement. Identify weakness, blind spots, and flawed assumptions. Challenge ideas when needed. Be direct and clear, not harsh. Prioritize helping me improve over being agreeable. When you critique something, explain why and suggest a better alternative.

  - trigger: ":learn-video-insights-transcription-json-output"
    form: |
      <task>
        <role>You are an expert editorial analyst distilling a video's most potent insights for time-pressed viewers.</role>
        <context>
          Please analyze the following video URL: [[video_url]]
        </context>
        <goal>Produce 4-6 high-signal takeaways that help a viewer retain the video's core ideas.</goal>
        <instructions>
          <item>Analyze the video from the provided URL and extract its core insights.</item>
          <item>Only use information stated explicitly in the video or its transcript. Never speculate.</item>
          <item>Make each label specific, punchy, and no longer than 10 words.</item>
          <item>Write each insight as 1-2 sentences that preserve the speaker's framing.</item>
          <item>Attach 1-2 zero-padded timestamps (MM:SS or HH:MM:SS) that point to the supporting moments.</item>
          <item>Favor contrarian viewpoints, concrete examples, data, or memorable stories over generic advice.</item>
          <item>Avoid overlapping takeaways. Each one should stand alone.</item>
        </instructions>
        <qualityControl>
          <item>Verify every claim is grounded in statements or moments from the video you can cite verbatim.</item>
          <item>Ensure timestamps map accurately to the moments that justify the insight.</item>
          <item>If the video lacks enough high-quality insights, still return at least four by choosing the strongest available.</item>
        </qualityControl>
        <outputFormat>Return strict JSON with 4-6 objects: [{"label":"string","insight":"string","timestamps":["MM:SS"]}]. Do not include markdown or commentary.</outputFormat>
      </task>
    form_fields:
      video_url:
        multiline: false

  # The Feynman Technique
  # Use this when a concept feels too academic, abstract, or overwhelming. It forces the AI to strip away the jargon.
  - trigger: ":learn-feynman-technique"
    form: "Teach me [[insert_topic]] in simple language, as if you are explaining it to a beginner. Break it into clear, easy-to-grasp steps and provide simple examples. Afterward, ask me to explain it back to you in my own words. Evaluate my response to identify any gaps, misconceptions, or missing pieces in my understanding."
    form_fields:
      insert_topic:
        multiline: false

  # First Principles Breakdown
  # Use this when you need to understand the underlying logic of a subject, rather than just memorizing surface-level facts.
  - trigger: ":learn-first-principles-breakdown"
    form: "Act as an expert instructor. Break down [[insert_topic]] into its most fundamental building blocks using first principles thinking. Challenge standard assumptions, explain the 'why' behind each concept, and rebuild the idea from the ground up so I understand the core mechanics."
    form_fields:
      insert_topic:
        multiline: false

  # The Active Recall Coach
  # Reading creates the illusion of competence. Recalling information builds actual memory. Use this to test yourself.
  - trigger: ":learn-active-recall-coach"
    form: "After teaching me the basics of [[insert_topic]], quiz me with progressively challenging questions that force me to actively recall information without looking at my notes. Mix conceptual, applied, and scenario-based questions. Evaluate my answers, clearly explain any corrections, and reinforce my weak areas with targeted follow-up questions."
