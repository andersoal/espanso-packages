  - trigger: :outwork-everyone-system
    replace: |
      <role>Act as a competitive advantage strategist who reads every signal a business owner sends through their work habits, their industry awareness, and their output relative to competitors - and builds a complete map of the specific daily system that makes their effort level so far above the competition that the gap becomes impossible to close.</role>

      <task>Step into my competitive landscape and show me exactly what outworking my competition actually looks like in my specific business - so I stop assuming I am ahead and start building a daily system that makes the gap real and measurable.</task>

      <steps>
      1. Ask for my industry, my top 3 competitors, and my current daily work output before starting
      2. Map exactly what my top competitors are doing daily - their content output, their outreach volume, their product development, their customer service
      3. Identify the gap between my current daily output and the output required to be objectively ahead of my competition in 12 months
      4. Name the 3 specific daily behaviors that would make my effort level impossible for my competition to match
      5. Predict the one area where my competition is currently outworking me that I have been ignoring or rationalizing
      6. Deliver the complete competitive output map, the 3 daily behaviors, the one ignored area, and the 90-day system that makes my work ethic my most defensible competitive advantage
      </steps>

      <rules>
      - Competitor output must be mapped in specific measurable terms - not vague "they work harder" observations
      - Daily behaviors must be specific enough to track on a spreadsheet - not aspirational habits
      - The one ignored area must be named without rationalization - most business owners already know where they are behind
      - The 90-day system must be aggressive enough to close the gap and realistic enough to sustain
      - Test: if my top competitor saw my daily output for 30 days would they feel threatened
      </rules>

      <output>Competitor Output Map → Current vs Required Output Gap → 3 Daily Outwork Behaviors → One Ignored Area → 90-Day Competitive Advantage System</output>
    label: "[Thinking Prompts] Goggins Resilience: Competitive Advantage System"
    comment: Evaluates mental grit, pain thresholds, and relentless execution discipline.
    search_terms:
      - thinking-prompts
      - thinking prompts

  - trigger: :effort-ceiling-audit
    replace: |
      <role>Act as a performance diagnostician who reads every signal a business owner sends through their current work output, their daily schedule, and their results - and builds a complete map of the gap between the effort level they think is maximum and the effort level that actually separates average businesses from unstoppable ones.</role>

      <task>Step into my current work output and show me exactly where I am coasting without knowing it - so I can stop confusing busyness with maximum effort and start operating at the level my goals actually require.</task>

      <steps>
      1. Ask for my current daily schedule, my biggest business goal, and the last time I genuinely surprised myself with what I accomplished before starting
      2. Map every hour of my current workday and the real output each hour produces
      3. Identify the gap between the effort level I think is hard and the effort level my goal actually requires
      4. Name the 3 specific areas where I am operating below my real capacity without realizing it
      5. Predict the one comfort zone I keep returning to that is costing me the most progress every single week
      6. Deliver the complete effort audit, the 3 underperforming areas, the one comfort zone to break, and the daily non-negotiables that raise my floor permanently
      </steps>

      <rules>
      - Effort gaps must be named in specific behaviors - not described as "work harder"
      - Every underperforming area must connect to a specific missed result - vague diagnoses change nothing
      - The one comfort zone must be named honestly - most business owners already know what it is
      - Daily non-negotiables must be specific enough to track on a calendar
      - Test: if I ran these non-negotiables for 30 days straight would the people around me notice a difference
      </rules>

      <output>Current Output Map → Real vs Required Effort Gap → 3 Underperforming Areas → One Comfort Zone to Break → Daily Non-Negotiables</output>
    label: "[Thinking Prompts] Goggins Resilience: Effort Ceiling Audit"
    comment: Diagnoses self-imposed limitations and pushes past comfort zones in business and fitness.
    search_terms:
      - thinking-prompts
      - thinking prompts

