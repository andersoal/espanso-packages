# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: :w_lens
    form: |
      Analyze how an elite macro-scale investor or software scale-builder thinks about capital and infrastructure in this exact situation: [[situation]]
      -> Pinpoint where my operational thinking is constrained by linear limits.
      -> Where am I failing to decouple time from revenue?
      -> What programmatic or systemic leverage am I ignoring?
      Think in scalable systems and enterprise value, not billable hours. Be uncomfortably direct.
    label: '[Finance] Macro Wealth Lens'
    comment: Analyzes business or technical systems through an elite macro-scale investor perspective.
    search_terms:
      - finance
  - trigger: :w_filter
    form: |
      Evaluate the technical and financial architecture of this opportunity: [[idea]]
      -> Can this scale to $1M+/month using zero-marginal-cost replication mechanics?
      -> Is it driven by scalable leverage engines (automated systems, product assets, API/distribution networks)?
      -> Does it accumulate compounding equity, or is it transient transactional cash flow?
      Apply high friction to your analysis. Explicitly reject anything small or reliant on manual services.
    label: '[Finance] Asymmetric Wealth Filter'
    comment: Evaluates the asymmetric upside and risk-to-reward ratio of an opportunity.
    search_terms:
      - finance
  - trigger: :w_blueprint
    form: |
      Design an architectural roadmap to scale a business model from $100K to $1M/month.
      Core Focus Area: [[focus]]
      Provide a rigorous execution strategy addressing:
      -> The business engine (software, product ecosystems, or automated platforms over services)
      -> Scalable distribution channels and high-margin recurring revenue models
      -> Systems architecture, decoupling mechanisms, and operational scaling bottlenecks
      -> Velocity vectors: Where can speed be weaponized over perfection?
    label: '[Finance] Scalable Business Architecture Blueprint'
    comment: Designs an architectural roadmap to scale a business model with compounding returns.
    search_terms:
      - finance
  - trigger: :w_decoder
    replace: |
      Conduct a root-cause breakdown of operational risk psychology and decision bottlenecks.
      Analyze the following execution dynamics:
      -> Hidden friction points and psychological overhead when moving to high-risk/high-leverage systems.
      -> Scarcity vs abundance engineering: Behavioral patterns that prioritize immediate micro-wins over long-term platform value.
      -> Emotional triggers around systemic risk, loss-aversion, and delegation.
      Isolate what specific mental framework or operational habit is artificially capping current income potential.
    label: '[Finance] Operational Risk & Fragility Decoder'
    comment: Root-cause breakdown of operational risk, cognitive biases, and systemic weaknesses.
    search_terms:
      - finance
  - trigger: :w_game
    form: |
      Deconstruct the value-capture network and supply-chain hierarchy in this space: [[industry]]
      -> Who controls primary distribution, platforms, and aggregators?
      -> Where exactly are the highest margin profits and asymmetric value concentrated?
      -> Who takes the highest risk vs. who captures the ultimate economic equity?
      Map out the hidden transactional engine and structural gatekeepers of this market.
    label: '[Finance] Value-Capture Network Deconstruction'
    comment: Deconstructs value capture, supply-chain hierarchy, and defensible moats.
    search_terms:
      - finance
  - trigger: :w_framework
    replace: |
      Contrast asymmetric wealth execution vs linear operational thinking.
      Break down the structural differences across these parameters:
      -> Decision loop velocity: How elite systems thinkers handle incomplete information compared to perfection-paralyzed operators.
      -> Risk profiling: Managing systemic risk via portfolio allocation vs avoiding risk altogether.
      -> Pattern recognition: Discovering scalable platform opportunities vs trading hours for a single-point-of-failure paycheck.
    label: '[Finance] Asymmetric Wealth vs Linear Effort Framework'
    comment: Contrasts asymmetric equity-based execution against linear operational toil.
    search_terms:
      - finance
  - trigger: :w_leverage
    form: |
      Build an asymmetric leverage playbook for the following business infrastructure: [[business]]
      Provide deep operational tactics to exploit each lever:
      -> Capital: Arbitrage, asymmetric risk, and scaling mechanisms.
      -> Labor: Delegation, system-bound operations, and automation of routine tasks.
      -> Technology: Code engines, APIs, software platforms, and cloud orchestration layers.
      -> Media: Scale-independent content engines, asset libraries, and digital real estate.
      Identify where to place the fulcrum to multiply throughput with zero additional manual labor.
    label: '[Finance] 4 Forms of Leverage Assessment'
    comment: Audits labor, capital, code, and content leverage in a venture.
    search_terms:
      - finance
  - trigger: :w_advantage
    form: |
      Construct an unassailable strategic moat within this space: [[industry]]
      Provide explicit engineering protocols for:
      -> Compounding Skills: Intersecting deep technical architecture with commercial leverage.
      -> Proprietary Distribution: Building structural channels that competitors cannot easily buy or replicate.
      -> Network Effects: Designing systems where each new node inherently adds systemic value to the platform.
      -> Positioning & Defensibility: Becoming the structural standard so competing becomes economically irrational.
    label: '[Finance] Construct An Unassailable Strategic Moat Within This Space'
    comment: 'Construct an unassailable strategic moat within this space:'
    search_terms:
      - finance
  - trigger: :w_projection
    replace: |
      Execute an aggressive 3-year forensic financial audit on current operational trajectories.
      Hypothesis: If the current operational baseline, system architecture, and lifestyle models remain exactly static:
      -> Where will the portfolio realistically sit in 36 months?
      -> Which structural mistakes, overhead costs, or single points of failure will inflict the largest financial toll?
      -> What operational inefficiencies or lack of scaling engines must be corrected immediately?
      Do not pad the response. Give a direct, clinical, and data-driven critique.
    label: '[Finance] W Projection'
    comment: Execute an aggressive 3-year forensic financial audit on current operational trajectories.
    search_terms:
      - finance
  - trigger: :w_decision
    form: |
      Deconstruct high-velocity, high-stakes decision logic and apply it to this scenario: [[situation]]
      Isolate the exact operational frameworks used by world-class systems-builders to determine:
      -> Asymmetric Speed: When to deploy aggressive, messy execution to secure a market position.
      -> Absolute Defusal: When to ruthlessly reject opportunities that distract from the core engine.
      -> Risk Mitigation: How to construct systemic safety nets to shield the core business when executing high-risk experiments.
    label: '[Finance] W Decision'
    comment: 'Deconstruct high-velocity, high-stakes decision logic and apply it to this scenario:'
    search_terms:
      - finance
  - trigger: :financial-prompts-value
    replace: |
      Each of these prompts replaces work that costs:
      - Junior Analyst: $100K/year
      - Associate: $150K/year
      - VP: $250K/year

      Wall Street models in 10 minutes instead of 10 hours.
      Copy any prompt. Replace the brackets. Get Goldman-quality financial analysis.
      No finance degree needed.
    label: '[Finance] Financial Modeling Prompt Suite Overview'
    comment: Overview of investment banking and equity analysis prompt templates.
    search_terms:
      - finance
  - trigger: :ib-prompts-intro
    replace: |
      BREAKING: AI CAN NOW BUILD FINANCIAL MODELS LIKE GOLDMAN SACHS ANALYSTS (FOR FREE). HERE ARE 12 CLAUDE PROMPTS THAT REPLACE $150K/YEAR INVESTMENT BANKING WORK (SAVE FOR LATER):
    label: '[Finance] Investment Banking Financial Modeler Intro'
    comment: Goldman Sachs-style financial modeling framework for valuation and analysis.
    search_terms:
      - finance
  - trigger: :stock-home-instructions
    replace: |
      ROLE
      You are a long-term equity analyst covering [STOCK NAME] ([TICKER]).

      CRITICAL RULES — FOLLOW THESE IN EVERY RESPONSE

      1. SOURCE DISCIPLINE
      - Use ONLY the documents uploaded to this project as your evidence base.
      - For every factual claim, financial metric, or KPI you cite, you MUST first
        provide the exact quote from the source document, including the document
        name and page/section where it appears.
      - Format: [Document Name, Page/Section]: "exact quote" -> then your claim.
      - If you cannot find a supporting quote in the uploaded documents,
        do NOT make the claim. State: "Not found in uploaded documents."
      - Never use general knowledge, training data, or assumptions to fill gaps.

      2. DATA RECENCY
      - Always use the most recent data available in the uploaded documents.
      - If multiple periods are available, prioritize the latest reported period.
      - If you use older data, flag it explicitly: "(Note: using [year/quarter]
        data — more recent figures not found in uploaded documents.)"

      3. TRANSPARENCY
      - If a question cannot be fully answered from the documents, say so clearly.
      - Mark any inference or interpretation as: (inferred from [source]).
      - Never present inferences as facts.

      4. STRUCTURE
      - Use clear section headers.
      - Keep paragraphs short.
      - Use plain English — no jargon without explanation.
    label: '[Finance] Equity Research: Long-Term Analyst Core Prompt'
    comment: Long-term value investor persona for analyzing competitive moats and balance sheets.
    search_terms:
      - finance
  - trigger: :stock-industry-fundamentals
    replace: |
      ROLE
      You are an industry analyst writing for long-term equity investors.
      Industry to analyze: [Insert Industry Name]

      PURPOSE
      Produce a concise, factual industry overview that explains how the industry
      works, where growth comes from, and what structurally limits it — without
      speculation or narrative fluff.

      The goal is to understand:
      - Why this industry exists
      - How value is created and captured
      - What realistically drives or constrains growth over time

      EVIDENCE & DISCIPLINE
      Base the analysis on:
      - Reputable independent industry reports
      - Official company filings of major industry players (annual reports, MD&A)
      - Regulator or industry body publications

      If a point is not clearly supported, mark it as (inferred) or (unknown).
      Avoid forecasts without mechanisms. No opinions, no hype.

      OUTPUT STRUCTURE (6 SECTIONS ONLY)
      Target length: 1,200-1,800 words

      1. Industry Purpose & Core Economics
      2. Industry Structure & Competitive Shape
      3. Demand & Growth Drivers
      4. Supply Side, Cost Structure & Constraints
      5. Technology, Regulation & Structural Change
      6. Medium-Term Outlook (5-10 Years)

      END WITH: Investor Synthesis (5 bullets)
      - Core economic engine of the industry
      - Primary growth lever
      - Structural constraint investors underestimate
      - Key risk that could change trajectory
      - What kind of companies tend to win
    label: '[Finance] Equity Research: Industry Economics & Unit Economics'
    comment: Evaluates TAM, pricing power, regulatory risks, and competitive rivalry in an industry.
    search_terms:
      - finance
  - trigger: :stock-company-history
    replace: |
      For [Stock Name] ([Ticker]):
      Find official PDF links for all Form 10-K annual reports from 2019 to 2025.
      Use only official sources: SEC EDGAR (sec.gov) or the company's
      Investor Relations page.
      For each year, provide:
      - The direct PDF link (must end with .pdf)
      - If not available, write "Not Available"
      Do not use third-party sources.
    label: '[Finance] Equity Research: Capital Allocation & History'
    comment: Tracks management track record, share repurchases, ROIC, and M&A history.
    search_terms:
      - finance
  - trigger: :stock-lynch-pitch
    replace: |
      TASK
      Write a short investment pitch explaining why [COMPANY NAME] could be
      a good stock to own, using simple, common-sense reasoning.

      For every factual claim or metric, provide the exact quote from the
      source document first, then your interpretation.

      The pitch must answer these questions (in this order):

      1. In one sentence, what does the company do?
      2. What is the simple reason this stock could work?
         State ONE main idea. No stories. One reason.
      3. How does the company actually make money?
      4. What does the balance sheet look like today?
         (debt, cash, cash flow, downside survival — state which period)
      5. What kind of company is this?
         Classify as: slow grower, stalwart, fast grower, cyclical,
         turnaround, or asset play.
      6. What could go wrong?
      7. Why might the market be missing this?
      8. Bottom line — 3-4 sentences: why it's interesting, what must
         go right, and what would make you wrong.

      WRITING STYLE
      - Plain English, short sentences
      - No buzzwords, no macro speculation, no valuation models
    label: '[Finance] Peter Lynch 2-Minute Investment Elevator Pitch'
    comment: Crafts a simple, jargon-free pitch explaining why an investment will compound.
    search_terms:
      - finance
  - trigger: :stock-munger-invert
    replace: |
      Using ONLY the documents uploaded to this project, and following the
      quote-first sourcing rules in the project instructions:

      TASK
      Write a short investment memo that assumes [COMPANY NAME] is a bad
      long-term investment. Your goal is to invalidate the idea.

      For every factual claim or metric, provide the exact quote from the
      source document first, then your interpretation.

      The memo must answer these questions (in this order):

      1. What is the most likely way an investor could lose money here?
      2. Where is the business structurally weak?
      3. What assumptions need to go right — and might not?
      4. What could permanently impair earnings or cash flow?
      5. Is the balance sheet a hidden risk?
      6. Where could management hurt shareholders?
      7. Why might investors be fooling themselves?
      8. What evidence would prove this bear case right?

      WRITING STYLE
      - Plain English, short sentences
      - Direct, skeptical tone
      - No buzzwords, no macro, no valuation models
    label: '[Finance] Charlie Munger Inversion Analysis (Stock Thesis)'
    comment: 'Inverts the thesis: lists everything that could permanently destroy equity value.'
    search_terms:
      - finance
  - trigger: :stock-quarterly-update
    replace: |
      Using ONLY the documents uploaded to this project, and following the
      quote-first sourcing rules in the project instructions:

      ROLE
      You are a long-term equity analyst covering [COMPANY NAME].
      TASK
      Analyze the [Q_ 20__] earnings report I just uploaded, comparing it
      to prior guidance and historical results already in this project.
      For every factual claim or metric, provide the exact quote from the
      source document first (with document name), then your interpretation.
      Answer three core questions:
      SECTION 1 — GUIDANCE VS REALITY

      - What management previously guided or promised
        -> exact quote from prior document
      - What actually happened
        -> exact quote from new report
      - Beat / Met / Missed — quantify differences
      - Management's explanation -> exact quote
      - Has this explanation been used before? When?
      - Is the explanation supported by data or vague?

      End with: short judgment on management credibility this quarter.

      SECTION 2 — KPI ANALYSIS (Year-over-Year)
      For each key KPI:
      - Current quarter value (quote source)
      - Same quarter last year (quote source)
      - Absolute and percentage change
      - What the trend signals economically
      - Whether it supports or contradicts management's narrative

      SECTION 3 — WHAT ACTUALLY CHANGED?
      - What materially improved vs last year?
      - What materially deteriorated?
      - What is new (strategy, pricing, cost structure, capital allocation)?
      - What did NOT change despite management emphasis?

      FINAL SUMMARY
      - Execution vs expectations: Improving / Stable / Deteriorating
      - Management credibility: Strong / Mixed / Weak
      - Business momentum vs last year: Better / Same / Worse
    label: '[Finance] Equity Research: Quarterly Earnings Teardown'
    comment: Analyzes 10-Q earnings releases for revenue quality, margin compression, and guidance changes.
    search_terms:
      - finance
