      For each format, write a structural template I can fill in 20 minutes without staring at a blank page

      Map a 4-week posting calendar that rotates the formats so the audience starts recognizing the rhythm by week three

      Identify the single content trap I am most likely to fall into when tired and pre-commit a rule that prevents it

      Define what success looks like at week 4, 8, and 12 actual lead or subscriber outcomes not in vanity metrics, in

      Inputs: My niche and target reader. My genuinely-held opinions in this space. My realistic posting capacity per week. My biggest content weakness when I'm short on time.

      Output: Three Core Formats → Three Structural Templates → 4-Week Calendar →

      The Pre-Committed Trap Block → 12-Week Outcome Targets
    label: '[Prompts] LinkedIn Content Engine (High-Authority Engagement Strategy)'
