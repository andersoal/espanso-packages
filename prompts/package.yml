  # The problem prioritization engine
  - trigger: ":market-research-problem-prioritization-engine"
    form: |
      List the top 10 problems in [YOUR INDUSTRY].

      For each problem, score it on three dimensions:

      · Urgency (1-10): how painful/time-sensitive it is right
      now
      . Willingness to pay (1-10): how likely buyers are to
      spend money to solve it today
      . Growth trajectory: "rising fast," "stable," or "declining"

      Also add a Complaint signal column: yes/no for
      whether this problem surfaces frequently in reviews,
      forums, or sales calls.

      Output as a table with these exact columns:
      | # | Problem | Urgency | WTP | Trend | Complaint signal | Why it ranks here |

      Sort by combined Urgency + WTP score, highest first."

  # The offer creation framework
  - trigger: ":market-research-offer-creation-framework"
    form: |
      Create a high-converting offer for: [YOUR SPECIFIC
      PROBLEM].

      Structure the output exactly like a landing page,
      with these labeled sections in order:

      1. Headline: one bold, benefit-driven statement
      2. ICP: who this is for (age, role, situation, pain level)
      3. Value proposition: the core transformation in one
      sentence
      4. Offer components: what's included (deliverables,
      bonuses, format)
      5. Pricing tiers: name, price, and what changes at
      each tier (low / mid / premium)
      6. Guarantee: specific risk-reversal language the
      customer sees
      7. Competitive edge: 3 reasons this beats the
      obvious alternatives

      Keep each section tight. No filler. Write it as if it will go directly onto a real landing page.



  # The distribution domination plan
  - trigger: ":market-research-distribution-domination-plan"
    form: |
      Act as a senior growth strategist. Build a realistic 30-day distribution plan for: [YOUR IDEA], including the target audience, product type, and rough budget.

      Deliverables:
      1. Top 5 acquisition channels: ranked by cost-efficiency for this specific audience
      2. Content format per channel: one specific format that works on each (short-form video, cold email sequence, SEO article)
      3. Weekly execution calendar: what happens in weeks 1, 2, 3, and 4 (not day-by-day)
      4. Organic vs paid split: recommended % allocation and rationale
      5. Leverage plays: 2-3 tactics that multiply reach without proportionally more effort (partnerships, repurposing, virality hooks)

      Be specific and realistic. Skip tactics that require a large team or $50k+ budget unless the budget context supports it. Output as a numbered system with clear section headers."

  # Viral content engine
  - trigger: ":market-research-viral-content-engine"
    form: |
      Create a viral content strategy for: [YOUR NICHE].

      Deliver four components:

      1. Hook bank: 10 high-converting hooks (not 20, prioritize quality). For each, label which emotional trigger it uses: fear of missing out, social status, curiosity, or controversy.
      2. Content format matrix: a table with these columns: Format | Platform | Ideal length | Why it spreads | Example title. Include 6-8 formats across at least 3 platforms.
      3. Shareability audit: for each format, answer "What makes someone forward/repost this?" in one sentence.
      4. Repeatable content system: a simple weekly template showing how many posts, which formats, and what rotation keeps the audience engaged without burnout.

      Output with bold section headers. Write the hooks in the voice of the niche, not generic marketing language.'

  # The competitor weakness map
  - trigger: ":market-research-competitor-weakness-map"
    form: |
      Analyze the top 5 competitors in [YOUR NICHE].

      For each competitor, provide a structured row covering:
      . Name + one-line description of their core offer
      . What they do best (their defensible strength)
      . Where they are weak (product gaps, poor reviews, underserved use cases)
      . Which audience they ignore or underserve

      Then, based on the patterns across all 5:
      . Gap analysis: the 2-3 clearest white spaces no competitor is owning
      . Positioning recommendation: one sharp positioning statement that would differentiate a new entrant
      . Go-to-market angle: which ignored audience + which channel combination represents the fastest path to traction

      Output the competitor breakdown as a table, then the gap analysis and recommendations as prose."

