# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: :rtf
    form: |
      Act according to the following framework:
      - **Role**: [[role]]
      - **Task**: [[task]]
      - **Format**: [[format]]
    form_fields:
      role:
        default: Expert Assistant
      task:
        multiline: true
      format:
        default: Clean markdown tables or bullet points
    label: '[Prompts] RTF Framework (Role Task Format Structure)'
    # Act according to the following framework:
    search_terms:
      - prompts

  - trigger: :solve
    form: |
      Please follow this prompt structure:
      - **Situation**: [[situation]]
      - **Objective**: [[objective]]
      - **Limitations**: [[limitations]]
      - **Vision**: [[vision]]
      - **Execution**: [[execution]]
    form_fields:
      situation:
        multiline: true
      objective:
        multiline: true
      limitations:
        multiline: true
        default: None specified
      execution:
        multiline: true
    label: '[Prompts] SOLVE Framework (Situation Objective Limitations Vision Execution)'
    # Please follow this prompt structure:
    search_terms:
      - prompts

  - trigger: :p-tag
    form: |
      Execute the following:
      - **Task**: [[task]]
      - **Action**: [[action]]
      - **Goal**: [[goal]]
    form_fields:
      task:
        multiline: true
      action:
        multiline: true
    label: '[Prompts] TAG Framework (Task Action Goal Formulation)'
    # Execute the following:
    search_terms:
      - prompts

