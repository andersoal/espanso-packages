    form: |
      # Skill: Accelerated Learning Framework via LLMs

      ## Overview
      This framework leverages large language models to compress the learning curve of any complex topic by breaking down information into foundational concepts, mental models, and practical application vectors.

      ## Core Premise
      * **Source Material:** Derived from the concepts presented in `0d06ff9b927c315d0c79ca5f37e80f59.jpg`.
      * **Objective:** Achieve hyper-accelerated comprehension ("100x faster") of any subject matter using strategic prompting sequences.

      ---

      ## The 6-Prompt Accelerated Learning Stack

      ### 1. The Feynman Simplification Prompt
      * **Purpose:** Break down complex jargon into fundamental, easy-to-understand analogies.
      * **Prompt:**
        > "Explain [Topic/Concept] to me as if I am a 10-year-old. Avoid industry jargon, use a vivid analogy, and focus entirely on the core foundational principle."

      ### 2. The 80/20 Pareto Optimization Prompt
      * **Purpose:** Identify the high-leverage 20% of information that yields 80% of the practical results.
      * **Prompt:**
        > "I want to learn [Topic/Skill]. Identify the 20% of concepts, rules, or mechanics in this domain that account for 80% of the mastery and practical application. Create a structured 4-week learning roadmap based on this."

      ### 3. The Mental Model Integration Prompt
      * **Purpose:** Connect the new topic to existing multi-disciplinary frameworks to deepen memory retention.
      * **Prompt:**
        > "What are the core mental models, governing laws, or first principles that rule [Topic/Field]? Explain how these models dictate success or failure in this domain."

      ### 4. The Blind-Spot & Deconstruction Prompt
      * **Purpose:** Uncover non-obvious nuances, common pitfalls, and cognitive biases related to the topic.
      * **Prompt:**
        > "What are the most common misconceptions, beginner mistakes, or counter-intuitive truths about [Topic]? Act as a rigorous mentor and point out the blind spots that most people miss when trying to master this."

      ### 5. The Interactive Socratic Testing Prompt
      * **Purpose:** Test your actual understanding through active recall instead of passive reading.
      * **Prompt:**
        > "I want you to test my knowledge on [Topic]. Ask me a series of challenging, situational questions one by one. After each answer I provide, critique my reasoning, identify flaws in my logic, and give me a score out of 10 before moving to the next question."

      ### 6. The Contextual Application / Case Study Prompt
      * **Purpose:** Translate theoretical knowledge into immediate, actionable execution.
      * **Prompt:**
        > "Give me 3 real-world scenarios or case studies where [Topic/Concept] is applied to solve a high-stakes problem. Walk through the step-by-step execution strategy for each scenario."
