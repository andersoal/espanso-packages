      key_motifs:
        default: "High contrast, evocative typography, symbolic lighting"
    label: "[Prompts] Conversational Movie Poster (Cinematic Profile Synthesis)"
    # Synthesize a striking movie poster inspired by the conversations we've had
    search_terms:
