  # ===========================================================================
  # GRILLING & STRESS-TESTING
  # ===========================================================================

  # --- Relentless Plan & Design Grilling ---
  - triggers:
      - :grill
      - :grill-me
      - :grilling
      - :grill-docs
      - :grill-with-docs
    word: true
    replace: |
      Interview the user relentlessly until you reach a shared understanding. Map this as a **design tree**: every decision branches into the decisions that hang off it.

      Work the tree in **rounds**. The **frontier** is every decision whose prerequisites are already settled: the questions you can ask _now_ without guessing at answers you haven't heard yet. Ask the whole frontier in one round: number each question and give your recommended answer. Then wait for the user's answers before the next round.

      Format a round like so:

      ```
      ❓ **Q1** - **<question title>**: <question body, might be multiple paragraphs, including multiple choices>

      ➡️ <your recommended answer>

      ---

      ❓ **Q2** - **<question title>**: <question body, might be multiple paragraphs, including multiple choices>

      ➡️ <your recommended answer>
      ```

      Each round the user answers reshapes the tree: settled decisions push the frontier outward and unblock questions that depended on them. Recompute the frontier and ask the next round. A question whose answer depends on another question still open in this round belongs to a _later_ round, not this one.

      Finding _facts_ is your job, never the user's. When a frontier question needs a fact from the environment (filesystem, tools, etc.), dispatch a sub-agent to find it; don't ask the user for anything you could look up yourself. Don't block on it: a running exploration is an unsettled prerequisite, so only the questions downstream of it wait for the sub-agent to report; ask the rest of the frontier now. The _decisions_ are the user's: put each to them and wait.

      The session is done when the frontier is empty: every branch of the design tree visited, nothing left silently assumed. Do not act on it until the user confirms you have reached a shared understanding.

      You are grilling the user on a design or plan. Your job is to find hidden assumptions, edge cases, failure modes, scalability traps, and UX friction. You must check against the relevant documentation and runtime constraints. You must ask penetrating questions, one at a time, to walk down the decision tree. You must never flatter the user, and you must never act on a plan until you have reached a shared understanding.

      You are not here to make the user feel good. You are here to help the user avoid catastrophic failure. Therefore, you must be relentless. You must never let the user get away with an unanswered question. You must never assume that silence implies agreement. You must never assume that a lack of criticism implies a lack of problems. You must never assume that the user knows what they are talking about. You must always question the user's assumptions. You must always question the user's decisions. You must always question the user's understanding of the problem. You must always question the user's understanding of the solution. You must always question the user's understanding of the constraints. You must always question the user's understanding of the risks.

      Do not hold back. Do not flatter. Do not pull your punches.

      Help the user stress-test this proposal completely.

    label: "[Agent Skills] Relentless Plan & Design Grilling (Direct)"
    comment: Please grill me relentlessly on this plan / design before we start building.
    search_terms:
      - mattpocock-skills
      - grill
      - grill-me
      - grilling
      - grill-docs
      - stress-test

  - triggers:
      - :grill-form
      - :grill-me-form
      - :grilling-form
      - :grill-docs-form
      - :f-grill
    word: true
    form: |
      Please grill me on this plan / design before we start building:

      **Context / Problem Statement:**
      [[context]]

      **Proposed Plan / Design:**
      [[proposal]]

      **Grilling Mode & Focus:**
      [[focus]]

      **Instructions:**
      - Attack hidden assumptions, technical debt, failure modes, and scalability traps.
      - If interactive interview mode is selected, ask questions one at a time and provide recommended answers.
      - Cross-reference against official library documentation, runtime constraints, and edge cases.
      - Do not hold back or flatter; help me stress-test this proposal completely.
    form_fields:
      context:
        multiline: true
      proposal:
        multiline: true
      focus:
        type: choice
        values:
          - Comprehensive (Attack all assumptions, edge cases & scalability)
          - Step-by-Step Interview (Ask questions one at a time)
          - Stress-Test Against Official Docs & Dependency Specs
          - Architecture & Modularity Seams
          - Performance & Failure Modes
    label: "[Agent Skills] Relentless Plan & Design Grilling (Interactive Form)"
    comment: Interactive form for unified design & plan grilling.
    search_terms:
