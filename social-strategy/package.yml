# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
matches:
  # ---------------------------------------------------------------------------
  # 1. NICHE INTELLIGENCE & AUDIENCE MAPPING (Image: e73c3bbac6ede7f0e2600ca6ef63986e.png)
  # Optimization: Fast inline regex capture. Usage: :niche(your-target-niche)
  # ---------------------------------------------------------------------------
  - regex: ":niche\\((?P<target_niche>.*)\\)"
    replace: |
      Act as a senior social media strategist with over 10 years of experience managing brands in multiple industries. Analyze the niche "{{target_niche}}" and identify the most profitable audience segments, their biggest frustrations, emotional triggers, content consumption habits, and what type of posts make them follow, engage, and buy. Present this in a clear, actionable profile I can build content around.

  # ---------------------------------------------------------------------------
  # 2. MARKET POSITIONING & BRAND STRATEGY (Image: e73c3bbac6ede7f0e2600ca6ef63986e.png)
  # Optimization: Fast inline regex capture. Usage: :position(your-target-niche)
  # ---------------------------------------------------------------------------
  - regex: ":position\\((?P<target_niche>.*)\\)"
    replace: |
      Act as a brand positioning expert and help me design a powerful social media identity in the niche "{{target_niche}}". Define what my brand stands for, the unique angle that separates me from competitors, my brand voice and tone, visual aesthetic guidelines, and the core message that will resonate deeply with my target audience.

  # ---------------------------------------------------------------------------
  # 3. CONTENT PILLAR ARCHITECTURE (Image: c51e5017d619e6942c1bc183b8860eb6.png)
  # Optimization: Multi-field form with smart defaults for targeted systems-thinking design.
  # ---------------------------------------------------------------------------
  - trigger: ":pillars"
    form: |
      You're a content strategist who has scaled multiple accounts to 100K+ followers. Based on my niche [[niche]] and target audience [[audience]], create 5 content pillars that will drive maximum engagement. For each pillar, explain: why it works, the psychology behind it, 10 post ideas, and how to balance educational/entertaining/promotional content.
    form_fields:
      niche:
        type: text
        default: "B2B Software Engineering"
      audience:
        type: text
        default: "Technical Architects and Enterprise Builders"

  # ---------------------------------------------------------------------------
  # 4. 30-DAY CONTENT CALENDAR GENERATOR (Image: c51e5017d619e6942c1bc183b8860eb6.png)
  # Optimization: Choice dropdown to enforce correct platform schemas seamlessly.
  # ---------------------------------------------------------------------------
  - trigger: ":calendar"
    form: |
      Act as my content calendar manager. Create a complete 30-day posting schedule for [[platform]]. Include: daily post concepts, optimal posting times based on audience behavior, content format variety (carousels/reels/stories), hooks for each post, and strategic CTAs. Make it copy-paste ready.
    form_fields:
      platform:
        type: choice
        values:
          - "LinkedIn"
          - "X (Twitter)"
          - "YouTube Shorts"
          - "Instagram"

  # ---------------------------------------------------------------------------
  # 5. VIRAL HOOK FORMULA CREATOR (Image: eb09a32628a6d7a86708fc3c6a3db5f3.png)
  # Optimization: Fast inline regex capture. Usage: :hooks(your-niche)
  # ---------------------------------------------------------------------------
  - regex: ":hooks\\((?P<target_niche>.*)\\)"
    replace: |
      You're a copywriter who has written hooks for posts that got millions of views. Analyze viral content in {{target_niche}} and create 50 hook templates I can customize. Categorize them by: curiosity-driven, controversy, storytelling, listicles, bold statements. Make each one scroll-stopping.

  # ---------------------------------------------------------------------------
  # 6. ENGAGEMENT & COMMUNITY BUILDER (Image: eb09a32628a6d7a86708fc3c6a3db5f3.png)
  # Optimization: Static plain text. No variables required in original prompt text.
  # ---------------------------------------------------------------------------
  - trigger: ":engage"
    replace: |
      Act as a community management expert. Design my engagement strategy: how to respond to comments authentically, DM conversation starters that build relationships, collaboration outreach templates, how to turn followers into loyal fans, and a daily engagement routine that takes under 30 minutes.

  # ---------------------------------------------------------------------------
  # 7. ANALYTICS INTERPRETER & OPTIMIZER (Image: eb09a32628a6d7a86708fc3c6a3db5f3.png)
  # Optimization: Automatically pulls raw metrics data directly from your clipboard.
  # ---------------------------------------------------------------------------
  - trigger: ":analytics"
    replace: |
      You're a data analyst for social media. Based on these metrics:

      {{raw_metrics}}

      Identify: what's working and why, what's underperforming and how to fix it, content gaps I should fill, optimal posting frequency, and a 90-day growth roadmap with specific KPIs to hit.
    vars:
      - name: raw_metrics
        type: clipboard

  # 1. The Ryan Deiss Before-and-After Grid
  - trigger: ":beforeafter"
    replace: |
      ### The Before-and-After Grid
      | Experiential Register | The "Before" State (Point A) | The "After" State (Point B) |
      | --- | --- | --- |
      | **Have** | | |
      | **Feel** | | |
      | **Average Day** | | |
      | **Status** | | |
      | **Good vs. Evil** | | |

  # 2. The 8-Step Epiphany Bridge Narrative Blueprint
  - trigger: ":epiphany"
    replace: |
      ### Epiphany Bridge Narrative Outline
      1. **Backstory:** [Establish the professional starting point to create immediate empathy]
      2. **Desire:** [Articulate the external goals and deeper internal motivations driving the change]
      3. **The Wall:** [Identify the insurmountable obstacle hit within the legacy framework]
      4. **The Epiphany:** [The sudden discovery of the New Opportunity vehicle]
      5. **The Plan:** [The strategic blueprint created to test and validate this discovery]
      6. **The Conflict:** [The intense friction, challenges, and skepticism overcome during execution]
      7. **Achievement:** [Attaining the target end result and proving the validity of the plan]
      8. **Transformation:** [The profound operational and identity shift realized from the journey]

  # 3. The 9-Minute Triage Call Diagnostic Logger
  - trigger: ":triage"
    replace: |
      ---
      type: interaction
      activity: triage-call
      date: "{{current_date}}"
      status: completed
      ---
      # Triage Call Diagnostic: [Prospect Name]

      ### 1. The Problem
      > What is broken or missing in their current framework, and how long has this friction persisted?
      -

      ### 2. The Impact
      > What are the quantifiable financial, operational, or personal costs of continuing with state-level inaction?
      -

      ### 3. Fit & Urgency
      > Confirm baseline parameters: Do they possess the resources, alignment, and immediate intent to solve it?
      -

      ### 4. Pipeline Disposition
      - [ ] **Advance:** Qualified candidate. Book 45-Minute Strategy Session.
      - [ ] **Redirect:** Unqualified/Poor fit. Disengage or route to low-barrier asynchronous asset.
    vars:
      - name: current_date
        type: date
        params:
          format: "%Y-%m-%d"

  # 4. The Taki Moore Signature System Core Formula
  - trigger: ":sigsys"
    replace: |
      ### Proprietary Signature System Design
      * Formula: $Signature System = Problem + Promise + Process$

      - **The Problem Core:** [State the primary high-friction marketplace inefficiency being resolved]
      - **The Promise Core:** [State the ultimate outcome achieved at Point Z]
      - **The Process Milestones:**
        1. **Phase 1 (Quick Win / A → B):** [Low-friction intervention to establish trust and momentum]
        2. **Phase 2 (Core Pivot):** [Implementation of the proprietary engine to resolve root obstacles]
        3. **Phase 3 (Scale / Final Integration):** [Systemization to ensure long-term, repeatable outcomes]

  # 1. Channel Strategy Architect
  # Source: 9fc569671c9f920bab072663b68f1b97.png
  - trigger: ":yt-strategy"
    form: |
      Act like a YouTube growth strategist. Analyze my niche, target audience, and content goals.

      Niche: [[niche]]
      Target Audience: [[audience]]
      Content Goals: [[goals]]

      Design a complete channel strategy including positioning, content pillars, upload frequency, and the fastest path to 1,000 subscribers and monetization.
    form_fields:
      niche:
        type: text
        default: "Software Engineering & Architecture"
      audience:
        type: text
        default: "Mid-to-Senior Developers"
      goals:
        type: text
        default: "Build a scalable brand and drive organic engine inbound leads"

  # 2. Viral Video Idea Generator (Optimized via Inline Regex Capture)
  # Source: b8872e3a972b0fd3cc7cf08d096994cb.jpg
  - regex: ":yt-ideas\\((?P<niche>.*)\\)"
    replace: |
      Act like a YouTube content researcher. Generate 20 high-potential video ideas for {{niche}} based on viral trends, competitor analysis, and audience interest patterns. Normally I can help with things like this, but I don't seem to have access to that content. You can try again or ask me for something else.

  # 1. Dynamic Outreach & Pitching Form
  - trigger: ":aipitch"
    form: |
      Hi [[client_name]],

      I've been reviewing how workflows are structured at [[company_name]] and wanted to reach out regarding our **[[studio_division]]** offerings.

      Specifically, we’ve been helping teams implement **[[core_service]]** frameworks to optimize efficiency and drive measurable ROI.

      We typically kick things off with a structured kickoff to map out your current bottlenecks. Are you open to a quick 15-minute discovery call this week to see if this aligns with your current goals?

      Best regards,
      [[your_name]]
    form_fields:
      studio_division:
        type: choice
        values:
          - "AI Systems Agency"
          - "AI Strategy Consulting"
          - "AI Intelligence Services"
          - "AI Skill Academy"
          - "AI Writing Studio"
          - "AI Creative Studio"
          - "AI Mini Product Studio"
      core_service:
        type: text
        default: "Automated Workflow Integration"
      your_name:
        type: text
        default: "Founder"

  # 2. Comprehensive Service Menu (Quick Reference)
  - trigger: ":aimenu"
    replace: |
      Our AI Studio Offerings:
      ---------------------------------------------------------
      1. AI Systems Agency (Automated business architecture)
      2. AI Strategy Consulting (Readiness & roadmapping)
      3. AI Intelligence Services (Data to decisions)
      4. AI Skill Academy (Workforce & team training)
      5. AI Writing Studio (High-speed narrative delivery)
      6. AI Creative Studio (Visual & audio brand assets)
      7. AI Mini Product Studio (Lean, micro-SaaS tools)

  # 3. Fast Scope-of-Work Generator
  - trigger: ":aisow"
    form: |
      ### Statement of Work: [[project_focus]]
      **Service Line:** [[studio]]
      **Pricing Model:** [[investment_tier]]

      **Key Deliverables:**
      * Phase 1: AI Readiness Assessment & System Scoping
      * Phase 2: Sandbox Deployment of [[project_focus]]
      * Phase 3: Staff Capability Building & Integration Playbook

      **Estimated Timeline:** 4 - 6 weeks from agreement.
    form_fields:
      studio:
        type: choice
        values:
          - "AI Systems Agency (Target: ₹1.5L - ₹8L)"
          - "AI Strategy Consulting (Target: ₹5K - ₹25K / session)"
          - "AI Intelligence Services (Custom Dashboarding)"
          - "AI Skill Academy (Corporate Training)"
          - "AI Mini Product Studio (Target: ₹2.5K - ₹8K / month)"
      investment_tier:
        type: choice
        values:
          - "Fixed Project Milestone Basis"
          - "Monthly Recurring Retainer Contract"
          - "Per-Session / Hourly Advisory Rate"

  # 1. AI STRATEGY CONSULTING (Inline Regex Capture)
  # Typing ":consult(Aria)" immediately outputs a tailored advisory message.
  - regex: ":consult\\((?P<client>.*)\\)"
    replace: |
      Hi {{client}}, I was looking over your current operational stack. Let's get an AI Readiness Assessment or a Tool Selection Advisory session booked for next week to map out where you're leaking margins.

  # 2. AI SKILL ACADEMY (Interactive Dropdown Form)
  # Typing ":academy" brings up a targeted enrollment or follow-up pitch.
  - trigger: ":academy"
    form: |
      Hi [[student_name]],

      Thanks for asking about our training tracks. Based on your goals, I highly recommend our **[[course_selection]]** curriculum. This module is specifically built to help teams master these exact systems in their day-to-day workflows.

      Let me know if you want me to drop the syllabus link over!
    form_fields:
      course_selection:
        type: choice
        values:
          - "Prompt Writing Masterclass"
          - "Workflow Automation Bootcamp"
          - "AI Starter Workshop For Non-Tech Professionals"
          - "Classroom AI For Educators"
          - "AI Tools For Property Agents"
      student_name:
        type: text
        default: "there"

  # 3. AI SYSTEMS AGENCY (High-Ticket System Closer)
  # Typing ":systems" builds a structural milestone outline matching your premium price tiers.
  - trigger: ":systems"
    form: |
      ### Proposed Integration: [[system_architecture]]
      *   **Target Scope:** Production deployment of [[system_architecture]] architecture.
      *   **Core Objective:** Zero-Touch operational execution to reduce manual overhead.
      *   **Implementation Track:** Discovery Mapping → Sandbox Testing → Staff Capability Building.
      *   **Project Fee:** [[investment_tier]] (50% upfront milestone initialization).
    form_fields:
      system_architecture:
        type: choice
        values:
          - "Smart Inbox Management"
          - "Automated Billing Workflows"
          - "Sales Lead Qualification"
          - "Zero Touch Data Entry"
          - "Candidate Screening Flows"
      investment_tier:
        type: choice
        values:
          - "₹1,500,000 (Base Tier Integration)"
          - "₹4,500,000 (Mid-Market Scale)"
          - "₹8,000,000 (Enterprise Custom Architecture)"

  # 4. AI WRITING & CREATIVE STUDIO (Deliverable Wrapper)
  # Typing ":studio" allows you to quickly pitch high-speed content delivery outcomes.
  - trigger: ":studio"
    form: |
      We can lock down your request for [[deliverable_type]] under our asset production umbrella. We deliver these assets at a fraction of standard traditional agency overhead because we build them utilizing optimized AI generation frameworks.

      When would be a good time to review your brand design guidelines?
    form_fields:
      deliverable_type:
        type: choice
        values:
          - "Executive Ghostwriting & Long Form Blogs"
          - "Video Script Production & Audio Show Notes"
          - "AI Product Photography & Short Form Video Ads"
          - "Brand Identity Design & Visual Brand Systems"
