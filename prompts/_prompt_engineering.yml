  - trigger: :p-1of2-init
    replace: |
      Most people retype the same long instructions every time. Set these up once and you trigger each one with a single word.

      /HUMAN = rewrite so it sounds like a real person wrote it, no AI tells, no filler
      /EL10 = explain it like I'm ten, using plain words and a simple analogy
      /DEEPER = think it through step by step before answering, don't give me your first instinct
      /NOYES = stop agreeing by default, tell me where I'm wrong and what the strongest counterargument is
      /GIVE3 = give me three genuinely different versions, not three rewordings of the same one
      /TABLE = take whatever messy information is here and lay it out as a clean comparison table
      /TIGHTEN = rewrite your own last answer sharper and shorter without losing anything that mattered
      /FLOOD = don't give me one safe idea, give me twenty, including the weird ones
      /STEPS = turn this into a numbered checklist I can actually follow starting now
      /REDPEN = catch every grammar, clarity, and awkward-phrasing issue and fix them in one pass

      Confirm you've got them, then wait for my first message.
    label: '[Prompts] Slash Command Setup Guide (Reusable Command Triggers)'
    # Most people retype the same long instructions every time. Set these up once and you trigger each one with a single word.
    search_terms:
      - prompts

