# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: :p-destroyer
    form: |
      "You are a teacher who only has 4 hours with me and will never see me again. Your only objective is to make me functional in [[skill]] before the time runs out. Do not give me theory without practical use. Do not give me a list. Tell me: what to learn first, what to completely ignore, and what exercise, if I do it once, will already put me ahead of 70% of people who have been studying this for months."
    form_fields:
      skill:
        type: text
    label: "[Learn] 4-Hour High-Speed Learning Squeeze"
    comment: Fast-tracks learning as if you only have 4 hours to learn the entire topic.
    search_terms:
      - learn

  - trigger: :p-architect
    form: |
      "My real goal is [[goal]]. It is not to learn [[skill]] in general. It is to achieve [[specific_result]] within [[deadline]]. I already know [[what_you_master]]. Based on that, build me a 7-day learning path. Each day must include one single task that fits within 45 minutes, a clear criterion so I know whether I did it correctly, and what not to do that day so I do not waste time. If the entire path does not lead me to the goal, rebuild it until it does."
    form_fields:
      goal:
        type: text
      skill:
        type: text
      specific_result:
        type: text
      deadline:
        type: text
      what_you_master:
        type: text
    label: "[Learn] Mission-Specific Curriculum Architect"
    comment: Builds a curriculum specifically tailored to your exact goal rather than generic theory.
    search_terms:
      - learn

  - trigger: :p-translator
    form: |
      "This content below is confusing to me. Before explaining it, tell me: what is the one sentence that, if I understand it, will make the rest make sense on its own? Explain only that sentence first. Use an everyday analogy, with no technical terms. Then ask me 3 questions that only someone who truly understood it would be able to answer. Do not continue until I pass all three. {{clip}}"
    vars:
      - name: clip
        type: clipboard
    label: "[Learn] Jargon to Plain Language Translator"
    comment: Translates confusing technical jargon into intuitive concepts.
    search_terms:
      - learn

  - trigger: :rstep1
    form: |
      ROLE
      You are a research assistant covering [[topic]].

      CRITICAL RULES - FOLLOW THESE IN EVERY RESPONSE

      1. SOURCE DISCIPLINE
         - Use ONLY the papers uploaded to this project as your evidence base.
         - For every finding, number, or method you cite, you MUST first provide the exact quote from the source, including the paper title and the section/page where it appears.
         - Format: [Paper Title, Section/Page]: "exact quote" -> then your claim.
         - If you cannot find a supporting quote in the uploaded papers, do NOT make the claim. State: "Not found in uploaded papers."
         - Never use general knowledge or assumptions to fill gaps.

      2. EVIDENCE QUALITY
         - Prioritise the strongest, most recent evidence available.
         - When findings conflict, surface the disagreement - don't pick one.
         - Flag status explicitly: "(preprint - not yet peer reviewed)".

      3. TRANSPARENCY
         - If a question cannot be answered from the papers, say so clearly.
         - Mark any inference or interpretation as: (inferred from [source]).
         - Never present inferences as established findings.

      4. STRUCTURE
         - Use clear section headers.
         - Keep paragraphs short.
         - Define jargon on first use - plain English.
    form_fields:
      topic:
        type: text
        default: Machine Learning / AI Sourcing
    label: "[Learn] Research Step 1: Broad Landscape Map"
    comment: Maps the overarching domain landscape, key figures, and core controversies.
    search_terms:
      - learn

  - trigger: :rstep2
    form: |
      ROLE
      You are a field analyst writing for serious researchers entering [[topic]].

      PURPOSE
      Produce a concise, factual map of the field: what it studies, where the hard problems are, and which methods actually move it forward - without hype or narrative fluff.

      The goal is to understand:
      - Why this field exists and what problem it solves
      - How knowledge is built and validated here
      - What realistically drives or blocks progress

      EVIDENCE & DISCIPLINE
      Base the analysis on:
      - Highly cited foundational papers and recent reviews
      - Reputable surveys and benchmark results
      - Standards bodies or community consensus documents
      If a point is not clearly supported, mark it (inferred) or (unknown).
      No opinions, no hype.

      OUTPUT STRUCTURE (6 SECTIONS ONLY)  Target length: 1,200-1,800 words
      1. Field Purpose & Core Questions
      2. Key Subfields & How They Connect
      3. Foundational Works & Why They Matter
      4. Methods, Data & How Claims Are Validated
      5. Open Problems & Active Frontiers
      6. Where the Field Is Heading (3-5 Years)

      END WITH: Researcher Synthesis (5 bullets)
      - The question that defines the field
      - The method that unlocked the most progress
      - The assumption most people stop questioning
      - The open problem that would change everything
      - What kind of work tends to get cited
    form_fields:
      topic:
        type: text
        default: ""
    label: "[Learn] Research Step 2: Primary Source Deep Dive"
    comment: Extracts empirical data and key findings from high-trust primary sources.
    search_terms:
      - learn

  - trigger: :rstep3
    form: |
      For [[topic]]:
      Find official PDF links for the most-cited foundational papers and the most recent state-of-the-art papers (last 2 years).
      Use only official sources: arXiv, the publisher / journal page, the conference proceedings, or the authors' own pages.
      For each paper, provide:
      - Title, authors, year, venue
      - The direct PDF link (must end with .pdf)
      - If not available, write "Not Available"
      Do not use blogs, summaries, or third-party mirrors.
    form_fields:
      topic:
        type: text
        default: ""
    label: "[Learn] Research Step 3: Synthesis & Actionable Takeaways"
    comment: Synthesizes gathered research into a crisp, actionable briefing document.
    search_terms:
      - learn

  - trigger: :rsteel
    form: |
      TASK
      Write a short synthesis explaining why [[target]] is important and likely correct, using clear, plain-language reasoning.
      For every factual claim, provide the exact quote from the source first, then your interpretation. Answer in this order:
      1. In one sentence, what does this work claim?
      2. Single strongest reason to believe it? One idea.
      3. What problem does it solve that older work could not?
      4. What evidence backs it? (data, experiments, effect sizes - quote it)
      5. What kind of result is this? (incremental / replication / new method / paradigm shift)
      6. Who builds on it, and how?
      7. Why might the field be underrating it?
      8. Bottom line (3-4 sentences): why it matters, what must hold, what would make you wrong.

      WRITING STYLE - Plain English, short sentences. No buzzwords, no hype.
    form_fields:
      target:
        type: text
        default: this paper
    label: "[Learn] Rsteel"
    comment: TASK
    search_terms:
      - learn

  - trigger: :rskept
    form: |
      Using ONLY the documents in this project, and following the quote-first sourcing rules in the project instructions:
      TASK
      Write a short memo that assumes [[target]] is wrong or oversold. Your goal is to invalidate it. Quote the source first, then interpret. Answer in order:
      1. Most likely way this result fails to replicate?
      2. Where is the method or data structurally weak?
      3. What assumptions must hold - and might not?
      4. What confounds or alternative explanations exist?
      5. Is the evidence strong, or just suggestive?
      6. Where might the authors be overclaiming?
      7. Why might the field be fooling itself here?
      8. What evidence would prove this teardown right?

      WRITING STYLE - Plain English, short, direct, skeptical. No hand-waving.
    form_fields:
      target:
        type: text
        default: this paper
    label: "[Learn] Rskept"
    comment: "Using ONLY the documents in this project, and following the quote-first sourcing rules in the project instructions:"
    search_terms:
      - learn

  - trigger: :rupdate
    form: |
      Using ONLY the documents in this project, and following the quote-first sourcing rules in the project instructions:

      ROLE - You are a research assistant covering [[topic]].
      TASK - Analyse the new paper I just uploaded, comparing it to the canon and prior findings already in this project. Quote the source first (with paper title), then interpret. Answer three core questions:

      SECTION 1 - CLAIM VS EVIDENCE
      - What does the paper claim to contribute? -> exact quote
      - What did the authors actually show? -> exact quote from results
      - Strong / Mixed / Weak - quantify where possible
      - Is the contribution new, or a relabel of prior work?
      - Is the claim supported by data, or mostly framing?
      End with: short judgment on how much to trust this result.

      SECTION 2 - RESULT VS THE CANON (for each key result)
      - This paper's finding (quote source)
      - The prior consensus in the project (quote source)
      - Agreement, extension, or contradiction
      - What it signals for the field
      - Whether it survives the project's skeptic memo

      SECTION 3 - WHAT ACTUALLY CHANGED?
      - What does this genuinely add?
      - What does it overturn?
      - What is newly possible (method, data, benchmark)?
      - What did NOT change despite the paper's framing?

      FINAL SUMMARY
      - Evidence quality: Strong / Mixed / Weak
      - Novelty: High / Incremental / Recycled
      - Field impact vs the hype: Bigger / Same / Smaller
    form_fields:
      topic:
        type: text
        default: ""
    label: "[Learn] Rupdate"
    comment: "Using ONLY the documents in this project, and following the quote-first sourcing rules in the project instructions:"
    search_terms:
      - learn

  - trigger: :gskills-1of2
    form: |
      I'm a [[role]] who wants to learn [[goal]]. Google Skills has ~3,000 courses and labs. Build me a focused [[weeks]]-week plan: one track only, the 3-4 specific labs and badges worth doing in order, about [[hours]] hours a week, skip anything that is pure theory. Tell me which badge to earn first and why it matters to an employer.
    form_fields:
      role:
        type: text
        default: developer
      goal:
        type: text
        default: Deploy ML models on Vertex AI
      weeks:
        type: text
        default: "4"
      hours:
        type: text
        default: "3"
    label: "[Learn] I'M A  Who Wants To Learn"
    comment: "I'm a  who wants to learn . Google Skills has ~3,000 courses and labs. Build me a focused -week plan: one track only, th"
    search_terms:
      - learn

  - trigger: :gskills-2of2
    form: |
      I am ready to start the "[[lab_name]]" lab from the plan you gave me. Before I click start, give me a 3-bullet prep sheet:
      1. What core concept must I understand so I don't just blindly copy-paste the code?
      2. What is the most common mistake people make in this specific lab?
      3. How does this specific skill translate to a real-world [[role]] task?
    form_fields:
      lab_name:
        type: text
        default: ""
      role:
        type: text
        default: developer
    label: '[Learn] I Am Ready To Start The "" Lab From The Plan You Gave Me'
    comment: 'I am ready to start the "" lab from the plan you gave me. Before I click start, give me a 3-bullet prep sheet:'
    search_terms:
      - learn

  - trigger: :lp1of5
    form: |
      I want to learn [[topic]]. Before teaching me anything, calibrate to me.

      Ask me:
      1. What I already know about it, so you can skip that.
      2. Why I want to learn it and how I will use it.
      3. How deep I need to go - rough overview, or a working understanding.

      Ask these as a short numbered list and then wait. Do not start teaching yet.
    label: "[Learn] I Want To Learn"
    comment: I want to learn . Before teaching me anything, calibrate to me.
    search_terms:
      - learn

  - trigger: :lp2of5
    replace: |
      Based on my answers, teach me {{copied_topic}} at exactly the level I need - no more, no less.

      Rules:
      - Build on what I already said I know. Do not re-explain that.
      - One concept at a time, in a logical order, each with a concrete example.
      - Define every new term the first time you use it.
      - Stop after the core concepts that get me to my stated goal. Do not dump the whole field.

      Teach it now.
    vars:
      - name: copied_topic
        type: clipboard
    label: "[Learn] Lp2Of5"
    comment: Based on my answers, teach me {{copied_topic}} at exactly the level I need - no more, no less.
    search_terms:
      - learn

  - trigger: :lp3of5
    replace: |
      Now test whether it actually stuck. Do NOT re-explain anything first.

      Ask me 6 questions about what you just taught, ONE at a time, waiting for my answer each time:
      - Mix straight recall, "explain why," and one applied scenario.
      - After each answer, tell me right or wrong with a one-line correction.

      At the end, list the specific concepts I clearly have not grasped.
    label: "[Learn] Now Test Whether It Actually Stuck"
    comment: Now test whether it actually stuck. Do NOT re-explain anything first.
    search_terms:
      - learn

  - trigger: :lp4of5
    replace: |
      Re-teach ONLY the concepts I got wrong or was shaky on. Ignore everything I already understood.

      For each one:
      - Explain it a different way than you did the first time - a new angle or analogy.
      - Give me one fresh example.
      - Ask me a single follow-up question to confirm I have it now.
    label: "[Learn] Re-Teach Only The Concepts I Got Wrong Or Was Shaky On"
    comment: Re-teach ONLY the concepts I got wrong or was shaky on. Ignore everything I already understood.
    search_terms:
      - learn

  - trigger: :lp5of5
    replace: |
      Now compress everything into a one-page reference I can save and review later.

      Include:
      - The core concepts as short, plain-language bullets.
      - The key examples, briefly.
      - The mistakes I made during the test, written as "remember: ..." reminders.
      - 3 questions I can use to re-test myself in a week.

      Keep it tight enough to fit on one screen.
    label: "[Learn] Lp5Of5"
    comment: Now compress everything into a one-page reference I can save and review later.
    search_terms:
      - learn

  - trigger: :lpsocratic
    form: |
      [ROLE]
      Act as an aggressively gated, high-signal Socratic Compiler. Your objective is to map, isolate, and verify comprehension of a target topic using a compressed, non-linear progression loop.

      [VARIABLES]
      - Topic = "[[topic]]"
      - Baseline = "[[baseline]]"

      [COMPRESSION & PARSING PROTOCOLS]
      1. ZERO FLUFF: Eliminate all meta-commentary, introductory pleasantries, and motivational framing.
      2. ISOLATION: Break the target topic down into an atomic, dependency-mapped hierarchy.
      3. STRICT GATEKEEPING: You are hard-locked from advancing to a subsequent concept until the user passes an active evaluation phase.

      [EXECUTION PIPELINE - LINEAR STATE MACHINE]
      - STATE 01 (Mapping): Deliver a high-density, conceptual overview of the absolute core foundational pillar of [Topic], tailored to [Baseline]. Under 150 words. Append exactly 3 core architectural keywords. Stop.
      - STATE 02 (Verification): Prompt the user for a structural breakdown or real-world application of those keywords. Evaluate the user's input for semantic accuracy.
      - STATE 03 (Branching):
        - If accuracy >= 85%: Auto-advance to the next dependency in the hierarchy (State 01 increment).
        - If accuracy < 85%: Execute an immediate course-correction layer, reframing the breakdown using an alternate conceptual model. Do not advance.

      [INITIALIZATION]
      Acknowledge receipt of parameters by executing STATE 01 for [Topic] immediately. Do not dump the entire field.
    form_fields:
      baseline:
        type: text
        default: Systems thinker, practical architecture focus
    label: "[Learn] Aggressively Gated"
    comment: "[ROLE]"
    search_terms:
      - learn

