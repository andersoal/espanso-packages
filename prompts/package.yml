  # 1. The Profile-As-Landing-Page Rewriter
  - trigger: ":profile-as-lp"
    form: |

      Act as a LinkedIn profile strategist trained on Justin Welsh's principle that your profile is not a resume - it is the highest-converting landing page you will ever own. Job-seekers optimize for keywords. Operators optimize for one specific reader who, if they understood what you do in 12 seconds, would either book a call, subscribe, or remember you for later.

      Rebuild my profile as a landing page:

      Rewrite my headline so it answers three questions in under 220 characters: who I help, what I help them do, and how they know I'm credible

      Rewrite my About section as a one-screen pitch - first sentence earns the read, middle three sentences prove the claim, final sentence tells them exactly what to do next

      Audit my Featured section and replace anything that doesn't generate leads, subscribers, or recognition with assets that do

      Rewrite each Experience entry as a contribution statement what I shipped, who it served, what changed - never a job description

      Stress-test the rebuilt profile against the question "would my ideal client know what to do within 12 seconds of landing here"

      Inputs: My current headline, About section, and top three Experience entries. The single person I want to convert (specific, not a demographic). My one offer or asset I want them to engage with.

      Output: Rewritten Headline → One-Screen About Section → Featured Section Audit

      Rewritten Experience Entries → 12-Second Conversion Verdict

  # 2. The Authority Compounding Content Engine
  - trigger: ":content-engine"
    form: |
      Act as a LinkedIn content strategist applying Welsh's principle that authority on LinkedIn compounds when you publish a small number of repeating content formats with religious consistency, not when you chase variety. The operators who win on LinkedIn are not the most prolific - they are the most pattern-recognizable.

      Build my content engine:

      Identify the three core formats I will use as my LinkedIn rhythm for example: a contrarian take, a tactical breakdown, a personal lesson pick three I can credibly produce weekly

      For each format, write a structural template I can fill in 20 minutes without staring at a blank page

      Map a 4-week posting calendar that rotates the formats so the audience starts recognizing the rhythm by week three

      Identify the single content trap I am most likely to fall into when tired and pre-commit a rule that prevents it

      Define what success looks like at week 4, 8, and 12 actual lead or subscriber outcomes not in vanity metrics, in

      Inputs: My niche and target reader. My genuinely-held opinions in this space. My realistic posting capacity per week. My biggest content weakness when I'm short on time.

      Output: Three Core Formats → Three Structural Templates → 4-Week Calendar →

      The Pre-Committed Trap Block → 12-Week Outcome Targets

  # 3. The Post That Earns The Click
  - trigger: ":post-earn-click"
    form: |
      Act as a LinkedIn copywriter applying Welsh's standard: a LinkedIn post earns the read in the first two lines, earns the engagement in the middle, and earns the click on the final line. Most posts fail at line one because writers treat LinkedIn like a blog. Operators treat the first two lines as a billboard and the rest as the road behind it.

      Write a complete post engineered for compounding engagement:

      Open with a two-line hook that creates intellectual tension or specific promise never a question, never a statistic without context

      Deliver the core value in 100-200 words using one named framework, one

      concrete example, and one counterintuitive turn

      Format for the LinkedIn feed - short paragraphs, no walls of text, scannable in 8 seconds

      Close with a single line that earns the next click either to my profile, to a comment thread I'll engage in, or to an asset in my Featured section

      Run the post against the test: would I screenshot this if I weren't the one who wrote it

      Inputs: My post topic. The reader I'm writing to as one specific person. The framework or insight I want associated with my name. The single action I want the reader to take after reading.

      Output: Two-Line Hook → 100-200 Word Core → LinkedIn Feed Formatting Click-

      Earning Close → Screenshot Test Verdict

