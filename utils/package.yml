# yaml-language-server: =https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - triggers:
      - :-->
      - :rarrow
    replace: →
    label: "[Utils] Right Arrow (→)"
    comment: →
    search_terms:
      - utils
  - triggers:
      - :<--
      - :larrow
    replace: ←
    label: "[Utils] Left Arrow (←)"
    comment: ←
    search_terms:
      - utils
  - triggers:
      - :uarrow
    replace: ↑
    label: "[Utils] Up Arrow (↑)"
    comment: ↑
    search_terms:
      - utils
  - triggers:
      - :darrow
    replace: ↓
    label: "[Utils] Down Arrow (↓)"
    comment: ↓
    search_terms:
      - utils
  - triggers:
      - :lrarrow
    replace: ↔
    label: "[Utils] Left-Right Arrow (↔)"
    comment: ↔
    search_terms:
      - utils
  - trigger: :eur
    replace: €
    label: "[Utils] Euro Currency Symbol (€)"
    comment: €
    search_terms:
      - utils
  - trigger: :gbp
    replace: £
    label: "[Utils] Gbp"
    comment: £
    search_terms:
      - utils
  - trigger: :usd
    replace: $
    label: "[Utils] Dollar Currency Symbol ($)"
    comment: $
    search_terms:
      - utils
  - trigger: :jpy
    replace: ¥
    label: "[Utils] Jpy"
    comment: ¥
    search_terms:
      - utils
  - trigger: :inr
    replace: ₹
    label: "[Utils] Inr"
    comment: ₹
    search_terms:
      - utils
  - trigger: :btc
    replace: ฿
    label: "[Utils] Bitcoin Currency Symbol (฿)"
    comment: ฿
    search_terms:
      - utils
  - trigger: :eth
    replace: Ξ
    label: "[Utils] Ethereum Currency Symbol (Ξ)"
    comment: Ξ
    search_terms:
      - utils
  - triggers:
      - :(c)

      - ":copyright:"
    replace: ©
    label: "[Utils] Copyright Symbol (©)"
    comment: ©
    search_terms:
      - utils
  - trigger: :ip
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: curl 'https://api.ipify.org'
    label: "[Utils] Public IP Address (API lookup)"
    comment: "{{output}}"
    search_terms:
      - utils
  - trigger: :weather
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: curl 'http://wttr.in/?format=3'
    label: "[Utils] Live Weather Report (curl wttr.in)"
    comment: "{{output}}"
    search_terms:
      - utils
  - trigger: :(
    replace: ($|$)
    word: true
    label: "[Utils] Parenthesis Pair ()"
    comment: ($|$)
    search_terms:
      - utils
  - trigger: :[
    replace: "[$|$]"
    word: true
    label: "[Utils] Square Bracket Pair []"
    comment: "[$|$]"
    search_terms:
      - utils
  - trigger: :{
    replace: "{$|$}"
    word: true
    label: "[Utils] Curly Brace Pair {}"
    comment: "{$|$}"
    search_terms:
      - utils
  - trigger: :<
    replace: <$|$>
    word: true
    label: "[Utils] Angle Bracket Pair <>"
    comment: <$|$>
    search_terms:
      - utils
  - trigger: :`
    replace: "`$|$`"
    word: true
    label: "[Utils] Backtick Code Pair ``"
    comment: "`$|$`"
    search_terms:
      - utils
  - trigger: :'
    replace: "'$|$'"
    word: true
    label: "[Utils] Single Quote Pair ''"
    comment: $|$
    search_terms:
      - utils
  - trigger: :"
    replace: '"$|$"'
    word: true
    label: '[Utils] Double Quote Pair ""'
    comment: $|$
    search_terms:
      - utils
  - trigger: :_
    replace: _$|$_
    word: true
    label: "[Utils] Underscore Pair __"
    comment: _$|$_
    search_terms:
      - utils
  - trigger: :*
    replace: "*$|$*"
    word: true
    label: "[Utils] Asterisk Pair **"
    comment: "*$|$*"
    search_terms:
      - utils
  - trigger: :-
    replace: -$|$-
    word: true
    label: "[Utils] "
    comment: -$|$-
    search_terms:
      - utils
  - trigger: :hr
    replace: <hr />
    label: "[Utils] HTML Horizontal Rule"
    comment: <hr />
    search_terms:
      - utils
  - trigger: :br
    replace: <br />
    word: true
    label: "[Utils] Br"
    comment: <br />
    search_terms:
      - utils
  - trigger: :div
    replace: <div>$|$</div>
    label: "[Utils] <Div>$|$</Div>"
    comment: <div>$|$</div>
    search_terms:
      - utils
  - trigger: :span
    replace: <span>$|$</span>
    label: "[Utils] <Span>$|$</Span>"
    comment: <span>$|$</span>
    search_terms:
      - utils
  - trigger: :h1
    replace: <h1>$|$</h1>
    label: "[Utils] <H1>$|$</H1>"
    comment: <h1>$|$</h1>
    search_terms:
      - utils
  - trigger: :h2
    replace: <h2>$|$</h2>
    label: "[Utils] <H2>$|$</H2>"
    comment: <h2>$|$</h2>
    search_terms:
      - utils
  - trigger: :h3
    replace: <h3>$|$</h3>
    label: "[Utils] <H3>$|$</H3>"
    comment: <h3>$|$</h3>
    search_terms:
      - utils
  - trigger: :para
    replace: <p>$|$</p>
    word: true
    label: "[Utils] Para"
    comment: <p>$|$</p>
    search_terms:
      - utils
  - trigger: :tag
    word: true
    replace: <{{html.element}}>$|$</{{html.element}}>
    vars:
      - name: html
        type: form
        params:
          layout: "XML / HTML Element Inserter

            Tag Name: [[element]]

            "
    label: "[Utils] Tag"
    comment: <{{html.element}}>$|$</{{html.element}}>
    search_terms:
      - utils
  - trigger: :date
    word: true
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%d/%m/%y"
    comment: "{{date}}"
    label: "[Utils] Current Date (YYYY-MM-DD)"
    search_terms:
      - utils
  - trigger: :time
    replace: "{{time}}"
    vars:
      - name: time
        type: date
        params:
          format: "%H:%M"
    label: "[Utils] Current Time (HH:MM)"
    comment: "{{time}}"
    search_terms:
      - utils
  - trigger: :month
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%B %Y"
    label: "[Utils] Month {{date}} format %B %Y"
    comment: "{{date}}"
    search_terms:
      - utils
  - trigger: :lenny
    replace: "{{smileys}}"
    vars:
      - name: smileys
        type: choice
        params:
          values:
            - ¯\\_(ツ)_/¯
            - (╯°□°）╯︵ ┻━┻
            - ( ͡ಠ ʖ̯ ͡ಠ)
            - ☉ ‿ ⚆
            - ʕ•ᴥ•ʔ
            - ⋆｡˚ ☁︎ ˚｡⋆｡˚☽˚｡⋆
            - ◤◢◣◥◤◢◣◥
            - (づᵔ◡ᵔ)づ
            - "|ᵔ‿ᵔ|"
            - ⤜(*﹏*)⤏
            - ツ
    label: "[Utils] Smileys"
    comment: "{{smileys}}"
    search_terms:
      - utils
  - trigger: :mit-short
    replace: "Licensed under MIT X11, © {{name}} {{year}}: {{url}}"
    vars:
      - name: year
        type: date
        params:
          format: "%Y"

      - name: name
        type: choice
        params:
          values:
            - Alicia Sykes
            - James Carter
            - You

      - name: url
        type: random
        params:
          choices:
            - https://aliciasykes.com
            - https://jamescarter.dev
            - https://you.com
    label: "[Utils] Licensed Under Mit X11, ©"
    comment: "Licensed under MIT X11, © {{name}} {{year}}: {{url}}"
    search_terms:
      - utils
  - trigger: :mit-long
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          shell: cmd
          cmd: curl.exe 'https://gist.githubusercontent.com/Lissy93/143d2ee01ccc5c052a17/raw/a8ac96cd15847a231931b561d95d2de47066fd33/LICENSE.MD'
    label: "[Utils] Mit Long"
    comment: "{{output}}"
    search_terms:
      - utils
  - trigger: :kr
    replace: "Kind Regards,

      {name}

      "
    vars:
      - name: name
        type: choice
        params:
          values:
            - Alicia Sykes
            - Dan Smith
            - Jordan O'Hare
            - Tom Wilson
            - James Carter
            - Me
    label: "[Utils] Kind Regards,"
    comment: Kind Regards,
    search_terms:
      - utils
  - trigger: :commit
    replace: git commit -m "$|$"
    label: '[Utils] Git Commit -M "$|$'
    comment: git commit -m "$|$
    search_terms:
      - utils
  - trigger: :wtc
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          shell: cmd
          cmd: curl.exe -s whatthecommit.com/index.txt
    label: "[Utils] What the commit"
    comment: "{{output}}"
    search_terms:
      - utils
  - trigger: :pass
    replace: "{{lesspass}}"
    vars:
      - name: params
        type: form
        params:
          layout: "Less Pass Generator

            Website: [[site]]

            Login: [[login]]

            Master Password: [[pass]]

            "

      - name: lesspass
        type: shell
        params:
          cmd: lesspass $ESPANSO_PARAMS_SITE $ESPANSO_PARAMS_LOGIN $ESPANSO_PARAMS_PASS
    label: "[Utils] Pass"
    comment: "{{lesspass}}"
    search_terms:
      - utils
  - triggers:
      - :s-ddg

      - :search-duckduckgo
    replace: https://duckduckgo.com/?q=
    label: "[Utils] Search DuckDuckGo"
    comment: Quick search query URL prefix for DuckDuckGo
    search_terms:
      - utils
  - triggers:
      - :s-wiki

      - :search-wikipedia
    replace: https://en.wikipedia.org/w/?search=
    label: "[Utils] Search Wikipedia"
    comment: Quick search query URL prefix for Wikipedia
    search_terms:
      - utils
  - triggers:
      - :s-gh

      - :search-github
    replace: https://github.com/search?q=
    label: "[Utils] Search GitHub"
    comment: Quick search query URL prefix for GitHub
    search_terms:
      - utils
  - triggers:
      - :s-so

      - :search-stackoverflow
    replace: https://stackoverflow.com/search?q=
