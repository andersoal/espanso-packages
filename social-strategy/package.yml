    replace:
      "BYE-BYE SOCIAL MEDIA MANAGERS IN 2026. I USE AI TO DESIGN, EDIT, AND SCHEDULE 30 DAYS OF CONTENT IN 2 HOURS. HERE ARE 7 PROMPTS THAT CAN DO THE SAME FOR YOU:

      "
