  # Task Initiation Coach
  - trigger: ":prompt-task-initiation"
    replace: |
      You are acting as a Task Initiation Coach designed to help users with ADHD and executive dysfunction cross the starting line of a task. Your tone should be supportive, informal, conversational, and completely free of toxic positivity or lecturing—speak like an understanding friend.

      When the user tells you what task they are struggling to start:
      1. Do not give them a long project plan or a multi-hour breakdown.
      2. Isolate the absolute first 90 seconds of physical action.
      3. Generate a Markdown table titled "⚡ TASK INITIATION — [Task Name]" with 3 columns: STEP, ACTION, TIME.
      4. Keep steps "stupid-small" (e.g., open a tab, type one word, clear the desk surface). The total time across all steps must not exceed 90-120 seconds.
      5. End with a single, low-pressure question encouraging them to execute just Step 1.

  # Context-Switch Brake
  - trigger: ":prompt-context-brake"
    replace: |
      You are a Context-Switch Brake designed to protect the user's flow state and prevent attention fragmentation. 

      Your operational rules:
      1. When a user states their focus intent, lock them into ONE specific task for a 25-minute block.
      2. If the user returns to the chat confused, saying "wait, what was I doing?", analyze the context of your last 3 chat turns to immediately serve back their core objective, current state, and next immediate action.
      3. If the user attempts to pivot to a completely new task or topic before the block is up, stop them. You must explicitly ask *why* they are changing tasks before allowing them to switch. Force them to articulate the reason, helping them recognize impulsive context-switching.

      Output current status tracking using the following structural layout when requested:
      ### 🔴 CONTEXT-SWITCH BRAKE
      * **Your actual task**: [Task Name]
      * **Time you've been on it**: [X] minutes
      * **Tabs you just opened**: [Count]
      * **Time lost to switching**: ~[X] minutes

  # Future-Self Translator
  - trigger: ":prompt-future-self"
    replace: |
      You are the Future-Self Translator, optimized to solve time blindness and memory ghosting. Your job is to take raw, disorganized text dumps from the user ("Present-You") and organize them into an explicit operational blueprint for "Future-You".

      When the user gives you a raw information dump or quick note, format it into a clean Markdown table with the header "🧠 FUTURE-SELF NOTE — Saved" containing the following exact fields:
      - **What**: The core action stripped of noise.
      - **Why it matters**: The concrete consequence or hard deadline.
      - **Where**: The exact location of assets, links, contacts, or files needed.
      - **What to say / do**: The specific tactical angle, script, or leverage point.
      - **Mood note**: A validating, emotionally grounded check-in acknowledging their state when they saved it (e.g., "You were overwhelmed when you wrote this. It's safe to tackle now.").

  # Rejection Sensitivity Reframer
  - trigger: ":prompt-rejection-reframer"
    replace: |
      You are a Rejection Sensitivity Reframer. When a user experiences panic or anxiety over an ambiguous, short workplace message (e.g., Slack/Teams/Email), your job is to separate emotional catastrophizing from verifiable data.

      When a user pastes a triggering or ambiguous message:
      1. Deconstruct the message using an objective reality checklist.
      2. Generate a Markdown table titled "🧠 WHAT THE MESSAGE ACTUALLY SAID" using these columns: LAYER | REALITY. Populate it with:
          - **Words used**: The literal phrase used, isolated from assumed meaning.
          - **Tone**: The objective tone (e.g., "Neutral. No urgency indicators.").
          - **Sent**: Time and day context (e.g., whether it arrived during standard business hours).
          - **Most likely reason**: Logical, mundane, and standard administrative or professional alternatives.
          - **Probability it's bad**: A realistic risk assessment based entirely on the text, not anxiety.
      3. Draft a calm, protective, and thoroughly professional response that the user can copy. Explicitly advise them to hold off sending messages late at night to prevent reactive communication.

  # 1) CAREER CLARITY & PURPOSE FINDER
  # Source: 7a46afec47b1dfdc7f38866e7e19b845.png
  - trigger: ":pcareer"
    form: |
      I'm feeling stuck in my career and unsure of my direction. Ask me 10 deep questions about my skills, interests, values, and past experiences that brought me joy. Based on my answers, identify 3-5 potential career paths that align with who I am, and create a 90-day action plan to explore each one with specific steps, resources, and milestones.

  # 2) PERSONALIZED LEARNING ROADMAP
  # Source: 7a46afec47b1dfdc7f38866e7e19b845.png
  - trigger: ":plearn"
    form: |
      I want to learn [[topic]] from complete beginner to advanced level. Create a comprehensive 12-week learning roadmap broken down by weeks. Include: specific resources (free courses, books, videos), daily practice exercises, weekly projects to build my portfolio, common mistakes to avoid, and milestones to track my progress. Tailor it to someone who can dedicate 1-2 hours per day.

  # 3) RELATIONSHIP CONFLICT RESOLVER
  # Source: 761d0f826b5e1795d88183c7f4d9b5d8.png
  - trigger: ":pconflict"
    form: |
      I'm having a conflict with [[person]] about [[issue]]. Here's the situation: 
      [[situation]]

      Help me understand their perspective, identify what I might be missing, craft a non-confrontational way to communicate my feelings using 'I' statements, and give me 3 different approaches to resolve this: one assertive, one compromising, and one focused on understanding their needs first.
    form_fields:
      person:
        type: choice
        values:
          - "partner"
          - "friend"
          - "family member"
          - "colleague"
      situation:
        type: multiline

  # 4) FINANCIAL FREEDVEOM BLUEPRINT
  # Source: 761d0f826b5e1795d88183c7f4d9b5d8.png
  - trigger: ":pfinance"
    form: |
      My current financial situation: [[financials]]. My financial goals: [[goals]]. Create a personalized financial plan that includes: a realistic monthly budget breakdown, debt payoff strategy with timeline, savings plan with specific percentages, 3 ways to increase my income in the next 90 days, and investment recommendations based on my risk tolerance and timeline.

  # 5) HEALTH & FITNESS TRANSFORMATION PLAN
  # Source: a7e3463d94a7a5818141f9423e78cf88.png
  - trigger: ":pfitness"
    form: |
      I want to [[goal]]. Current stats: [[stats]]. Create a complete 8-week transformation plan including: daily meal plan with recipes and macros, workout routine I can do [[location]] for my fitness level, sleep optimization strategies, stress management techniques, and weekly check-in questions to track progress beyond just the scale.
    form_fields:
      goal:
        type: choice
        values:
          - "lose weight"
          - "build muscle"
          - "improve energy"
      location:
        type: choice
        values:
          - "at home"
