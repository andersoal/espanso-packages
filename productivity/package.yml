  - trigger: :4hour-workday
    replace: |
      # ⚡ How to Get 8 Hours of Work Finished in 4 Hours (Colby Kultgen)

      > "Work expands so as to fill the time available for its completion." — Parkinson's Law

      ---

      ## 🧱 1. Block Out Your Day
      - Focus on one task at a time during dedicated focus blocks.
      - Group similar activities together to eliminate context-switching penalties.
      - Stick to the schedule strictly to build momentum and efficiency.

      ## ⏱️ 2. Set Artificial Deadlines (Parkinson's Law)
      - Break tasks into smaller bite-sized steps.
      - Assign tight artificial deadlines to each step (e.g., 25-45 min max).
      - Shorter timeframes force ruthless focus and prevent perfectionist procrastination.

      ## 🎯 3. Match Your Ideal Work Style
      - **Planner**: Plan hour-by-hour -> Deep work for 2 hours -> Stretching break -> Lighter admin tasks.
      - **Prioritizer**: Write to-do list -> Organize calendar -> Hardest tasks first -> Deep work for 2 hours.
      - **Arranger**: Plan daily blocks -> Deep work for 2 hours -> Structured break -> Lighter wrap-up.
      - **Visualizer**: Decide priority for the day -> Write in journal -> Pomodoro sprints -> End with light tasks.

      ## 🛡️ 4. Distraction Lockdown Protocol
      - *Important Note:* None of this matters if you are constantly distracted.
      - Turn off all phone & desktop notifications.
      - Clear your physical & digital workspace.
      - Set healthy boundaries with colleagues and family during focus blocks.
    label: "[Productivity] 8 Hours in 4 Hours: Workday Compression Framework"
    # Cheat sheet summarizing Colby Kultgen's 4-step framework for finishing 8 hours of work in 4 hours.
    search_terms:
      - productivity
      - 4-hour
      - parkinson
      - focus
      - workstyle

