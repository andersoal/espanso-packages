      now
      . Willingness to pay (1-10): how likely buyers are to
      spend money to solve it today
      . Growth trajectory: "rising fast," "stable," or "declining"

      Also add a Complaint signal column: yes/no for
      whether this problem surfaces frequently in reviews,
      forums, or sales calls.

      Output as a table with these exact columns:
      | # | Problem | Urgency | WTP | Trend | Complaint signal | Why it ranks here |

      Sort by combined Urgency + WTP score, highest first."

  # The offer creation framework
  - trigger: ":biz-offer-creation-framework"
    form: |
      Create a high-converting offer for: [YOUR SPECIFIC
      PROBLEM].

      Structure the output exactly like a landing page,
      with these labeled sections in order:

      1. Headline: one bold, benefit-driven statement
      2. ICP: who this is for (age, role, situation, pain level)
      3. Value proposition: the core transformation in one
      sentence
      4. Offer components: what's included (deliverables,
      bonuses, format)
      5. Pricing tiers: name, price, and what changes at
      each tier (low / mid / premium)
      6. Guarantee: specific risk-reversal language the
      customer sees
      7. Competitive edge: 3 reasons this beats the
      obvious alternatives

      Keep each section tight. No filler. Write it as if it will go directly onto a real landing page.

  # The distribution domination plan
  - trigger: ":biz-distribution-domination-plan"
    form: |
      Act as a senior growth strategist. Build a realistic 30-day distribution plan for: [YOUR IDEA], including the target audience, product type, and rough budget.

      Deliverables:
      1. Top 5 acquisition channels: ranked by cost-efficiency for this specific audience
      2. Content format per channel: one specific format that works on each (short-form video, cold email sequence, SEO article)
      3. Weekly execution calendar: what happens in weeks 1, 2, 3, and 4 (not day-by-day)
      4. Organic vs paid split: recommended % allocation and rationale
      5. Leverage plays: 2-3 tactics that multiply reach without proportionally more effort (partnerships, repurposing, virality hooks)

      Be specific and realistic. Skip tactics that require a large team or $50k+ budget unless the budget context supports it. Output as a numbered system with clear section headers."

