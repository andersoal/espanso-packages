      We've built foundation, explored perspectives, identified gaps, and done deep research. Now synthesize everything[[extra_context]]:

      1. What are the [[insight_count]] most important insights from our entire conversation?
      2. How do all the pieces connect? Draw the big picture.
      3. What would I be confident saying is true vs. what's still uncertain?
      4. If I had to explain this to someone in 2 minutes, what would I say?
      5. What's my action plan based on everything we've learned?

      Create a clear, actionable summary of our entire chain.
    form_fields:
      insight_count:
        default: '3'
      extra_context:
        default: ''
    label: '[Prompts] Synthesis & Action Chain (Synthesize Gaps Into Action Steps)'
    # We''ve built foundation, explored perspectives, identified gaps, and done deep research. Now synthesize everything:
    search_terms:
      - prompts

