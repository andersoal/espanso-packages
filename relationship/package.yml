  #    1. Memories: Go to Settings > Personalization > Manage Memories to view/clear explicit facts.
  #    2. Tracking: Go to Settings > Personalization > Turn off "Reference Chat History".
  #    3. Training: Go to Data Controls > Turn off "Improve the model for everyone".

  
