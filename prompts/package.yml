  - trigger: ":8-hours-work-in-4"
    form: |
      # Framework: How to Get 8 Hours of Work Finished in 4 Hours
      **Creator:** Colby Kultgen

      ## Core Principle
      None of this matters if you are constantly distracted. To maximize output, you must first eliminate external friction:
      * Turn off notifications.
      * Clear your workspace.
      * Set healthy boundaries.

      ---

      ## Pillars of the Framework

      ### 1. Block Out Your Day
      Focus on one task at a time during a dedicated block. Group similar activities to streamline your day and minimize context switching. Stick to your schedule to build momentum and efficiency.

      ### 2. Set Artificial Deadlines
      Leverage **Parkinson's Law** (Work expands to fill the time allotted for its completion).
      * Break tasks into smaller steps.
      * Assign tight deadlines to each step.
      * **Mechanism:** Shorter timeframes force intense focus, prevent procrastination, and make it easier to stay on track to accomplish more in less time.

      ### 3. Find Your Ideal Work Style
      Experiment with different approaches to discover what keeps you motivated and productive. Tailor your routine to your strengths to maximize your output.

      #### Work Style Matrix
      | Working Style | Step 1 | Step 2 | Step 3 | Step 4 |
      | :--- | :--- | :--- | :--- | :--- |
      | **Planner** | Plan your day hour by hour | Deep work for 2 hours | Take a stretching break | Work on lighter tasks |
      | **Prioritizer** | Write a to-do list | Organize your calendar | Start with the hardest tasks first | Deep work for 2 hours |
      | **Arranger** | Plan your day hour by hour | Deep work for 2 hours | Take a stretching break | Work on lighter tasks |
      | **Visualizer** | Decide on a priority for the day | Write in your journal | Use the Pomodoro technique | End the day with light tasks |

