matches:
  - trigger: ":fixlight"
    replace: |
      Precise correction of deficient lighting while preserving the face and original scene essence.
      Correct harsh shadows on the eyes, nose, and chin caused by mobile phone flash.
      Neutralize ambient color casts for accurate, lifelike skin tones. Brighten underexposed areas.
      Final image: realistic and intact skin texture with invisible, natural editing.

  - trigger: ":fixform"
    form: |
      Precise correction of deficient lighting. Preserve facial features and the core essence of the scene.
      Correct harsh shadows on eyes/nose/chin caused by [[light_source]].
      Neutralize any [[cast_color]] color casts for accurate, natural skin tones.
      Brighten underexposed areas while protecting highlights.
      Final image: realistic and intact skin texture, seamless invisible editing.
    form_fields:
      light_source:
        type: choice
        values:
          - "mobile phone flash"
          - "harsh overhead lighting"
          - "low-light environment noise"
      cast_color:
        type: choice
        values:
          - "orange/warm"
          - "green/fluorescent"
          - "blue/cold"
          - "unwanted ambient"

  # 1. Content Calendar Prompt
  - trigger: ":ccal"
    form: |
      Create a 30-day social media content calendar for [[niche]], mixing videos, carousels, and captions.
    form_fields:
      niche:
        type: text
        default: "software engineering"

  # 2. Viral Hooks Prompt
  - trigger: ":vhooks"
    form: |
      Write 20 scroll-stopping and engaging hooks for TikTok/Instagram posts for [[topic]].
    form_fields:
      topic:
        type: text
        default: "architecture"

  # 1. Content Creator Mode Activation
  - trigger: ":ccactivate"
    form: |
      Act as a professional content creator who has experience producing high-performing content across multiple platforms. From now on, whenever I give you a topic, create content that is engaging, valuable, and easy to understand. Focus on clarity, creativity, and usefulness so every piece of content feels intentional and audience-focused. My niche is: [[niche]].
    form_fields:
      niche:
        type: text
        default: "Digital Marketing & AI Productivity"

  # 2. Infinite Content Idea Generator
  - trigger: ":ccideas"
    form: |
      Act as a creative content strategist known for generating endless ideas. Based on my niche [[niche]], generate 50 highly relevant content ideas that solve problems, answer common questions, or provide valuable insights that my audience cares about.
    form_fields:
      niche:
        type: text
        default: "Solopreneurship"

  # 3. Audience Understanding
  - trigger: ":ccaudience"
    form: |
      Analyze my target audience [[audience_desc]] and identify their biggest problems, interests, fears, desires. Use this information to guide future content ideas so every piece of content directly addresses their needs.
    form_fields:
      audience_desc:
        type: multiline

  # 4. Scroll-Stopping Hook Creator
  - trigger: ":cchooks"
    form: |
      Generate powerful Hooks for content related to my topic [[topic]]. Ensure the hooks are attention-grabbing and designed to make viewers or readers stop scrolling and pay attention immediately.
    form_fields:
      topic:
        type: text

  # 5. Structured Content Builder
  - trigger: ":ccbuild"
    form: |
      Create structured content for the topic [[topic]] that includes a clear beginning, main points, and conclusion. Ensure the content flows logically and delivers value step-by-step so the audience understands the message easily.
    form_fields:
      topic:
        type: text

  # 6. Smart Content Repurposing (Automatic Clipboard Injection)
  - trigger: ":ccrepurpose"
    replace: |
      Take this existing content:

      """
      {{copied_text}}
      """

      And transform it into multiple new content pieces without repeating the same wording so I can maximize the value of one idea.
    vars:
      - name: copied_text
        type: clipboard

  # Restore this photo with period-accurate techniques, addressing any age-related issues it may have, such as blurring, damage, fading, scratches, tears, folds, worn-out areas, or being in black and white. First, analyze the image to identify the approximate era and original photographic process to ensure a historically accurate restoration. Make it look fresh and clear by gently sharpening soft edges and facial features without overdoing it, smoothing out grainy spots or noise if present, and reconstructing missing parts with realistic textures that match the original. If colors are faded or absent, bring them back naturally and vibrantly but true to the era's photographic technology without looking artificial; balance colors to match natural lighting, adjust brightness and contrast so everything pops nicely, and maintain original tonality. Add subtle details to faces, objects, or backgrounds that might have been lost, like fine lines in clothing, lifelike skin textures, or small elements in the scenery, while keeping the overall feel authentic, preserving natural grain patterns, and not changing the composition. Ensure the whole image is balanced, with no harsh shadows or washed-out areas, remove technical defects while respecting the nostalgic charm and exposure qualities of the time. Finally, upscale it to a higher resolution like Full HD 32k for better clarity, outputting in a photo-realistic style that looks like a professionally restored or recent high-quality photo.
  # Interactive prompt generator for photo restoration workflows
  # ** The Technical Misnomer ("Full HD 32k"): The prompt instructs the model to upscale to "Full HD 32k". This is a severe hallucination/contradiction in terms. Full HD specifically denotes a resolution of $1920 \times 1080$ (roughly $2\text{K}$). $32\text{K}$ refers to an extreme resolution of $30720 \times 17280$. Feeding an LLM or diffusion model conflicting spatial constraints causes unpredictable downsampling or generation errors.
  # ** Monolithic Inflexibility: Not every photo needs scratch removal, colorization, and background reconstruction. Hardcoding a wall of text as a static snippet forcing all parameters at once guarantees suboptimal AI generations for photos that only require minor adjustments.
  #
  - trigger: ":photorest"
    form: |
      Restore this photo with period-accurate techniques, addressing any age-related issues it may have, such as [[damage]]. First, analyze the image to identify the approximate era ([[era]]) and original photographic process to ensure a historically accurate restoration. Make it look fresh and clear by gently sharpening soft edges and facial features without overdoing it, smoothing out grainy spots or noise if present, and reconstructing missing parts with realistic textures that match the original. If colors are faded or absent, bring them back naturally and vibrantly but true to the era's photographic technology without looking artificial; balance colors to match natural lighting, adjust brightness and contrast so everything pops nicely, and maintain original tonality. Add subtle details to faces, objects, or backgrounds that might have been lost, like fine lines in clothing, lifelike skin textures, or small elements in the scenery, while keeping the overall feel authentic, preserving natural grain patterns, and not changing the composition. Ensure the whole image is balanced, with no harsh shadows or washed-out areas, remove technical defects while respecting the nostalgic charm and exposure qualities of the time. Finally, upscale it to [[resolution]] for better clarity, outputting in a photo-realistic style that looks like a professionally restored or recent high-quality photo.
    form_fields:
      damage:
        type: text
        default: "blurring, damage, fading, scratches, tears, folds, worn-out areas"

      era:
        type: text
        default: "automatic detection"
      resolution:
        type: choice
        values:
          - "Ultra HD 4K"
          - "Ultra HD 8K"
          - "Full HD (1080p)"

  # Exact literal extraction from photo restoration card
  - trigger: ":prmonolith"
    replace: |
      Restore this photo with period-accurate techniques, addressing any age-related issues it may have, such as blurring, damage, fading, scratches, tears, folds, worn-out areas, or being in black and white. First, analyze the image to identify the approximate era and original photographic process to ensure a historically accurate restoration. Make it look fresh and clear by gently sharpening soft edges and facial features without overdoing it, smoothing out grainy spots or noise if present, and reconstructing missing parts with realistic textures that match the original. If colors are faded or absent, bring them back naturally and vibrantly but true to the era's photographic technology without looking artificial; balance colors to match natural lighting, adjust brightness and contrast so everything pops nicely, and maintain original tonality. Add subtle details to faces, objects, or backgrounds that might have been lost, like fine lines in clothing, lifelike skin textures, or small elements in the scenery, while keeping the overall feel authentic, preserving natural grain patterns, and not changing the composition. Ensure the whole image is balanced, with no harsh shadows or washed-out areas, remove technical defects while respecting the nostalgic charm and exposure qualities of the time. Finally, upscale it to a higher resolution like Full HD 32k for better clarity, outputting in a photo-realistic style that looks like a professionally restored or recent high-quality photo.

  # Professional skin retouching with premium sharpness, advanced imperfection correction; eliminates pimples, acne, blackheads, temporary spots, and irregular texture of the facial skin. Intelligent smoothing while preserving natural pores; soft and healthy skin with realistic texture, without a "plastic skin" effect. Fully preserve the original skin tone and undertone; avoid excessive brightness or darkening. Keep facial details precise: eyes, eyebrows, eyelashes, beard, and hair intact. High-end beauty editorial finish, balanced lighting, refined contrast, subtle facial definition, realistic skin retouching, studio-quality result, ultra-detailed, natural skin texture, ultra-sharp 3x upscale, HD, photorealistic, clean cinematic finish.
  # ** Buzzword Inflation: Tokens like ultra-detailed, HD, and photorealistic are artifacts of older generation models. Modern engines (like Flux or Midjourney v6) often interpret these as instructions to generate a cheap, over-processed digital art style rather than an actual photograph.
  # ** Hardcoded Assumptions: The phrase beard, and hair intact is brittle. If you apply this trigger to a prompt for a clean-shaven subject or a bald subject, the model will experience token confusion, leading to phantom hair artifacts or ignored instructions.
  # ** Structural Redundancy: The phrase realistic skin retouching and variants of natural skin texture are repeated multiple times, wasting context window weight.
  - trigger: ":srps"
    replace: "Professional skin retouching, advanced imperfection correction, eliminating temporary spots and irregular facial texture. Intelligent smoothing while preserving natural pores and realistic texture without a plastic skin effect. Preserved original skin tone and undertone, balanced lighting, refined contrast, high-end beauty editorial finish, clean cinematic execution."

  - trigger: ":srf"
    replace: "Professional skin retouching for a {{form.subject}}, advanced imperfection correction, eliminating acne and irregular skin texture. Intelligent smoothing while preserving natural pores, maintaining a realistic skin texture without a plastic effect. Fully preserve original skin tone and undertone. Keep facial details precise: {{form.details}} intact. High-end beauty editorial finish, balanced lighting, refined contrast, studio-quality photographic execution."
    vars:
      - name: form
        type: form
        params:
          layout: |
            Subject type: [[subject]]
            Details to preserve: [[details]]
          fields:
            subject:
              type: list
              values:
                - "man"
                - "woman"
                - "person"
            details:
              type: list
              values:
                - "eyes, eyebrows, eyelashes, beard, and hair"
                - "eyes, eyebrows, eyelashes, and hair"
                - "eyes, eyebrows, and facial features"

  # Ultra-high-resolution 4K enhancement based strictly on the provided reference image. Absolute fidelity to original facial anatomy, proportions, and identity. Preserve expression, gaze, pose, camera angle, framing, and perspective with zero deviation. Clothing, hair, skin, and background elements must remain unchanged in structure, placement, and design. Recover fine-grain detail with natural realism. Enhance pores, fine lines, hair strands, eyelashes, fabric weave, seams, and material edges without introducing stylization. Maintain original color science, white balance, and tonal relationships exactly as captured. Lighting direction, intensity, contrast, and shadow behavior must match the source image precisely, with only improved clarity and expanded dynamic range. No relighting, no reshaping. Remove any grain. Apply controlled sharpening and high-frequency detail reconstruction, remove compression artifacts and noise while retaining authentic texture. No smoothing, no plastic skin, no artificial gloss. Facial features must remain consistent across the entire image with coherent anatomy and clean, stable edges. Negative constraints: no warping, no facial drift, no added or missing anatomy, no altered hands, no distortions, no perspective shift, no text or graphics, no hallucinated detail, no stylized rendering. Output must read as a true-to-life, photorealistic upscale that matches the reference exactly, only clearer, sharper, and higher resolution.
  # *** The Flaw (Token Dilution): Phrases like "absolute fidelity," "zero deviation," "remain unchanged in structure," "no warping," and "no perspective shift" all command the exact same mathematical constraint. In modern diffusion or rendering models, this text bloat consumes finite context windows and dilutes the weights of the actionable instructions (like enhancing pores and fabric weaves).
  # *** The Fix: Group your instructions into crisp, distinct vectors: Core Objective, High-Frequency Details, Conservation Rules, and Negative Constraints. This creates a logical hierarchy that models can parse efficiently.
  - trigger: ":up4k"
    replace: |
      4K photorealistic upscale and high-frequency detail reconstruction.
      Core: Maintain absolute fidelity to original facial anatomy, proportions, expression, and camera perspective with zero structural deviation. Clothing, hair, and background placement must remain identical to source.
      Details: Recover natural skin pores, fine lines, individual hair strands, eyelashes, and precise fabric weave textures. Clean, stable edges with sharp, realistic rendering.
      Lighting & Color: Retain original color science, white balance, lighting direction, intensity, and shadow behavior with expanded dynamic range.
      Negative Constraints: Remove compression artifacts, noise, and grain. Avoid smoothing, plastic skin, artificial gloss, warping, facial drift, or hallucinated details.

