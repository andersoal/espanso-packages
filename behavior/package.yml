# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: :pshatter
    form: |
      I am staring at "[[task]]" and can't start. Break this down into 'Ridiculously Small' steps that take less than 1 minute each. Give me the first step and tell me exactly where to put my hands to begin.
    label: '[Behavior] Task Shatter (Overcome ADHD Inertia)'
    comment: Breaks an intimidating task into tiny micro-steps to overcome starting paralysis.
    search_terms:
      - behavior
  - trigger: :pmenu
    replace: |
      I am feeling under-stimulated. Create a 'Dopamine Menu' for me with 5-minute 'Appetizers' (quick movement), 20-minute 'Entrees' (deep work), and 10-minute 'Sides' (creative play) to keep my brain engaged.
    label: '[Behavior] Dopamine Menu (ADHD Stimulation)'
    comment: Creates a categorized menu of quick, low-friction dopamine boosters to regain focus.
    search_terms:
      - behavior
  - trigger: :pdouble
    form: |
      Act as my virtual body double for the next 30 minutes. I am currently working on: [[current_focus]]. Check in every 10 minutes to ask for a status update and keep my focus anchored.
    label: '[Behavior] Virtual Body Doubling (30m Focus)'
    comment: Acts as a virtual body double for an accountable 30-minute focus block.
    search_terms:
      - behavior
  - trigger: :pswitch
    form: |
      I just finished "[[task_a]]" and need to start "[[task_b]]", but my brain is stuck. Design a 3-minute 'Mental Palace Cleanser' routine to help me transition between these two different types of energy.
    label: '[Behavior] Task Switch & Context Reset'
    comment: Helps the brain transition cleanly between different cognitive contexts.
    search_terms:
      - behavior
  - trigger: :pgamify
    form: |
      I have a boring administrative task: [[task]]. Help me gamify this by connecting it to my current hyper-fixation: [[interest]]. Create a 'Quest' structure where finishing the task unlocks a reward.
    label: '[Behavior] Gamify Boring Admin Tasks'
    comment: Transforms repetitive administrative tasks into an engaging point/reward game.
    search_terms:
      - behavior
  - trigger: :paudit
    form: |
      I think "[[project]]" will take [[estimated_time]], but it usually takes [[historical_reality]]. Help me 'Time-Map' this by identifying the 3 hidden sub-tasks I always forget to account for so I can set a realistic deadline.
    form_fields:
      estimated_time:
        type: text
        default: 20 minutes
      historical_reality:
        type: text
        default: 2 hours
    label: '[Behavior] ADHD Time-Blindness Reality Audit'
    comment: Audits estimated vs actual task durations to combat time blindness.
    search_terms:
      - behavior
  - trigger: :ploops
    form: |
      My brain is full of 'Open Loops.' I will dump everything I'm worried about below. Categorize these into 'Now,' 'Later,' and 'Trash,' and then write a 1-sentence 'Actionable Next Step' for only the 'Now' items.

      ---
      [[raw_dump]]
    form_fields:
      raw_dump:
        type: multiline
    label: '[Behavior] My Brain Is Full Of ''Open Loops'
    comment: 'My brain is full of ''Open Loops.'' I will dump everything I''m worried about below. Categorize these into ''Now,'' ''Later,'' '
    search_terms:
      - behavior
  - trigger: :chapter-7-rules
    replace: |
      CHAPTER - 7

      25. Stay unpredictable in your reactions.
      Predictability is how manipulators control outcomes. Confuse their script by changing the rhythm.

      26. When people overshare early, be cautious.
      It's a trick to make you overshare too giving them leverage.

      27. Don't argue with emotional people
      Match logic with calm presence.

      28. When someone blames you unfairly, ask:
      "What makes you think that?"
      It shifts the burden of proof back to them.
    label: '[Behavior] Psychology Rules: Strategic Unpredictability'
    comment: Maintaining tactical advantage through unpredictable timing and flexibility.
    search_terms:
      - behavior
  - trigger: :chapter-6-rules
    replace: |
      CHAPTER - 6

      21. Watch how people treat you when you say "no."
      That's the purest form of truth you'll ever see.

      22. Practice emotional labeling.
      Instead of reacting, think: I'm feeling angry.
      Naming it instantly lowers its control over you.

      23. Keep your goals private until they're visible.
      People can't attack what they don't know exists.

      24. Don't let praise blind you.
      Flattery is often a leash disguised as affection.
    label: '[Behavior] Psychology Rules: Behavior Over Words'
    comment: Reading behavioral actions rather than stated intentions to assess character.
    search_terms:
      - behavior
  - trigger: :chapter-3-rules
    replace: |
      CHAPTER - 3

      9. Repeat their exact words back.
      It forces accountability. They realize you heard them and can't twist it later.

      10. Notice tone changes, not just words.
      What people hide is usually revealed by how they say it.

      11. When someone lies, stay quiet and look directly at them.
      Silence makes liars uncomfortable. They expose themselves trying to fill the space.

      12. If someone tries to guilt-trip you, ask: "What do you need me to do?"
      It forces them to admit the manipulation out loud.
    label: '[Behavior] Psychology Rules: Verbal Mirroring'
    comment: Using exact word repetition to build trust and disarm resistance.
    search_terms:
      - behavior
  - trigger: :chapter-8-rules
    replace: |
      CHAPTER - 8

      29. Learn to walk away mid-conflict.
      Power is knowing when silence says more than shouting ever will.

      30. Use people's names when disagreeing.
      It grounds the conversation and lowers aggression instantly.

      31. Don't justify success to insecure people.
      The more you explain your growth, the more they'll resent you.

      32. Notice how people react when you win.
      Joy reveals allies; discomfort reveals hidden envy.
    label: '[Behavior] Psychology Rules: The Power of Walking Away'
    comment: Establishing negotiation leverage by holding a credible willingness to walk away.
    search_terms:
      - behavior
  - trigger: :chapter-1-rules
    replace: |
      CHAPTER - 1

      1. Stay calm when someone tries to provoke you.
      Nothing disarms a manipulator faster than emotional control. Anger feeds them; silence starves them.

      2. Never explain too much.
      Over-explaining sounds like guilt. Say what's true once then stop talking.

      3. Learn to say "no" without explaining why.
      You don't owe anyone a justification for your boundaries.

      4. Delay your reactions.
      Pausing for even 5 seconds before replying breaks emotional traps instantly.
    label: '[Behavior] Psychology Rules: Emotional Composure & Control'
    comment: Rules for maintaining emotional detachment and authority under social pressure.
    search_terms:
      - behavior
  - trigger: :chapter-2-rules
    replace: |
      CHAPTER - 2

      5. Ask questions instead of defending yourself.
      Manipulators hate questions because it shifts power back to you.

      6. Observe patterns, not promises.
      Words are cheap. Repetition reveals truth.

      7. Master neutral body language.
      No fidgeting, no overreacting. Calm posture makes others feel you're in control, even when silent.

      8. Never argue with someone playing victim.
      They don't want truth, they want sympathy and power. Walk away.
    label: '[Behavior] Psychology Rules: Strategic Questioning'
    comment: Techniques for controlling conversations by asking targeted questions.
    search_terms:
      - behavior
  - trigger: :34-psychology-tricks
    replace: |
      NO ONE CAN EVER CONTROL YOU IF YOU LEARN THESE 34 PSYCHOLOGY TRICKS
    label: '[Behavior] 34 Power Psychology & Persuasion Tricks'
    comment: Comprehensive behavioral psychology principles for influence, negotiation, and composure.
    search_terms:
      - behavior
  - trigger: :chapter-4-rules
    replace: |
      CHAPTER - 4

      13. Compliment manipulative people strategically.
      A quick "You're good at that" satisfies their ego and defuses tension - without giving real power.

      14. Never share too much about your emotions.
      Manipulators study feelings to learn how to control you. Keep your cards close.

      15. Watch for sudden kindness after conflict.
      It's often emotional bait, not genuine care.

      16. Don't defend your boundaries just enforce them.
      Explaining boundaries invites debate. Quiet consistency commands respect.
    label: '[Behavior] Psychology Rules: Managing Difficult Personalities'
    comment: Strategic framing and boundary setting when dealing with manipulative actors.
    search_terms:
      - behavior
  - trigger: :chapter-9-rules
    replace: |
      CHAPTER - 9

      33. Trust actions over emotions.
      What people do repeatedly will always expose what they feel secretly.

      34. Learn to enjoy solitude.
      Once you stop needing constant company, no one can ever manipulate your loneliness again.
    label: '[Behavior] Psychology Rules: Emotional Independence'
    comment: Cultivating internal validation and making decisions free from social pressure.
    search_terms:
      - behavior
  - trigger: :success-rules-ch5
    replace: |
      CHAPTER - 5

      17. Mirror calm energy.
      If they raise their voice, lower yours. It subconsciously forces them to match your tone.

      18. Replace "I'm sorry" with "Thank you."
      It rewires guilt-based conditioning. "Thank you for waiting" sounds confident. "Sorry I'm late" sounds submissive.

      19. Never compete for validation.
      The person who needs approval loses power first.

      20. Use silence as a weapon of peace.
      Responding less often doesn't make you cold it makes you unpredictable.
    label: '[Behavior] Psychology Rules: Mirroring Calm Energy'
    comment: Techniques for de-escalating tension by projecting grounded composure.
    search_terms:
      - behavior
