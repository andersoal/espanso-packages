  # Subtly correct the unflattering camera angle in this uploaded photo, keeping the subject's face, features, identity, and the entire scene completely unaltered. If the photo was taken from a low angle creating an exaggerated chin or jawline, subtly adjust the perspective to simulate a slightly higher and more flattering camera position. Reduce any double chin or excess shadow under the chin created by the unflattering angle, not by removing the anatomy, but by simulating better lighting and a more aesthețic angle. Slightly define and clean up the jawline so it looks more sculpted and the subject actually looks in person from a normal eye-level angle. If the nostrils are prominently visible from a low angle, subtly reduce their prominence toward a natural frontal view. Subtly adjust the neck length and posture if the angle compressed them unnaturally. All corrections must be extremely subtle and natural; the subject must still look exactly like themselves, just photographed from a more flattering angle. Do not change any facial features, do not slim the face, and do not alter the bone structure. Only correct the distortion caused by the bad camera angle. The final result should look exactly like the same photo taken from a slightly more flattering eye-level position.
  - trigger: ":correctchin"
    form: |
      [[intensity]] correct the unflattering camera angle in this uploaded photo, keeping the subject's face, features, identity, and the entire scene completely unaltered. If the photo was taken from a low angle creating an exaggerated chin or jawline, subtly adjust the perspective to simulate a slightly higher and more flattering camera position. Reduce any double chin or excess shadow under the chin created by the unflattering angle, not by removing the anatomy, but by simulating better lighting and a more aesthetic angle. Slightly define and clean up the jawline so it looks more sculpted and the subject actually looks in person from a normal eye-level angle. If the nostrils are prominently visible from a low angle, subtly reduce their prominence toward a natural frontal view. Subtly adjust the neck length and posture if the angle compressed them unnaturally. [[custom_focus]] All corrections must be extremely [[lowercase_intensity]] and natural; the subject must still look exactly like themselves, just photographed from a more flattering angle. Do not change any facial features, do not slim the face, and do not alter the bone structure. Only correct the distortion caused by the bad camera angle. The final result should look exactly like the same photo taken from a slightly more flattering eye-level position.
    form_fields:
      intensity:
        type: choice
        values:
          - "Subtly"
          - "Gently"
          - "Moderately"
          - "Severely"
          - "Extremely"
          - ""
      lowercase_intensity:
        type: choice
        values:
          - "subtle"
          - "gentle"
          - "moderate"
          - "severe"
          - "extreme"
      custom_focus:
        type: text
        default: ""

  - trigger: ":eyerescue"
    form: |
      In the uploaded [[photo_type]], identify [[target_person]] with closed or partially closed eyes and naturally open only the affected eyes. Match the eye shape, eyelid position, [[gaze_direction]], and facial lighting of each person. Do not alter the facial structure, expression, skin texture, hairstyle, head position, or camera angle. Do not borrow eyes from other people or exaggerate the size or brightness of the eyes. The result should look like a real photo captured at the same moment with everyone's eyes open.
    form_fields:
      photo_type:
        type: choice
        values:
          - "group photo"
          - "portrait"
          - "family photo"
          - "candid shot"
          - ""
      target_person:
        type: text
        default: "any person"
      gaze_direction:
        type: choice
        values:
          - "gaze direction"
          - "gaze looking directly at the camera"
          - "gaze matching their natural head positioning"
