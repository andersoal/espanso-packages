      - :codereview-form
      - :code-review-form
      - :f-review
    word: true
    form: |
      Please perform a thorough dual-axis code review on the provided changes:

      **Axis 1: Spec & Intent Alignment**
      - Does this change deliver what was requested without regressions or omissions?
      - Are error states and boundary conditions handled properly?

      **Axis 2: Code Standards & Architecture**
      - Does the code follow clean modular design, high cohesion, and low coupling?
      - Are naming, type safety, error boundaries, and abstractions idiomatic and maintainable?

