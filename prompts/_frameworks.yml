  - trigger: :skill-productivity-execution-framework
    form: |
      # Skill: Productivity & Execution Frameworks

      ## Overview
      A compilation of six foundational time-management, prioritization, and execution frameworks designed to optimize daily output and eliminate procrastination.

      ---

      ## 1. The Pomodoro Technique
      A time-management method that breaks work into intervals separated by short breaks to maintain high focus and prevent mental fatigue.

      ### Execution Steps
      1. **List your tasks:** Identify the work that needs to be completed.
      2. **Set a 25-min timer:** Commit to a single task during this window.
      3. **Focus and work:** Work with zero distractions until the timer rings.
      4. **Take a 5-min break:** Step away from the work to rest.
      5. **Repeat and Reset:** Repeat the cycle 4 times, then take a longer break.

      ---

      ## 2. The 3/3/3 Method
      A daily rule-of-thumb framework to balance deep work, urgent obligations, and administrative upkeep.

      ### The Framework
      * **3 Hours:** Spend 3 hours working on an important project (Deep Work).
      * **3 Tasks/Meetings:** Complete 3 shorter urgent tasks or attend 3 essential meetings.
      * **3 Maintenance Tasks:** Do 3 minor operational or administrative tasks to keep life and work running smoothly.

      ---

      ## 3. The Eisenhower Matrix
      A prioritization framework used to categorize tasks by urgency and importance, optimizing decision-making on what to focus on next.

      ### Matrix Breakdown

      | | Urgent | Not Urgent |
      |---|---|---|
      | **Important** | **Do it** <br> *Tackle immediately.* | **Schedule it** <br> *Plan a dedicated time for it.* |
      | **Not Important** | **Delegate it** <br> *Hand it off to someone else.* | **Eliminate it** <br> *Drop it from your list.* |

      ---

      ## 4. Eat the Frog
      A behavioral framework centered on tackling the most difficult, high-friction task first to build momentum and remove stress early in the day.

      ### Core Principle
      > "Do your hardest task first. The rest will be easier."

      ### Philosophy
      > "If it's your job to eat a frog, it's best to do it first thing in the morning. And if it's your job to eat two frogs, it's best to eat the biggest one first."
      > — *Mark Twain*

      ---

      ## 5. The Seinfeld Strategy (Don't Break the Chain)
      A visual consistency framework designed to build long-term habits and sustain operational momentum.

      ### Execution Steps
      1. **Set your goal:** Define a specific, daily actionable habit.
      2. **Mark a calendar:** Put a clear mark (e.g., an 'X') on each day you successfully complete the task.
      3. **Keep the streak:** Focus entirely on maintaining the visual chain as long as possible.
      4. **The Guardrail:** Never miss 2 days in a row.

      ---

      ## 6. Time Blocking
      An intentional scheduling methodology where you divide your day into distinct blocks of time, dedicated to specific tasks or categories.

      ### Execution Steps
      1. **Identify** what needs doing.
      2. **Group** similar activities together (batching).
      3. **Assign** specific time slots for tasks.
      4. **Plot** blocks clearly on a calendar.
      5. **Stick** strictly to the schedule.
      6. **Take** intentional breaks between blocks.
      7. **Make** dynamic changes if or when needed.

      ### Sample Schedule Block

      | Time Slot | Activity |
      |---|---|
      | **9:00 - 12:00** | Deep Work |
      | **12:00 - 12:30** | Email / Admin |
      | **12:30 - 1:00** | Lunch |
      | **1:00 - 2:00** | Gym / Physical Activity |
      | **2:00 - 2:30** | Break |
      | **2:30 - 4:00** | Meetings |
    label: '[Prompts] Execution Frameworks Playbook (Throughput Leverage & Systems)'
    # # Skill: Productivity & Execution Frameworks
    search_terms:
      - prompts

