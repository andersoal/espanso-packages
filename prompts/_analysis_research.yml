  - trigger: :qfound
    form: |
      I need to research [[topic]]. Before we dive in, help me build a solid foundation:

      1. What are the 5 core concepts I must understand first?
      2. What common misconceptions exist about this topic?
      3. What's the current expert consensus vs. emerging debates?
      4. What questions should I be asking that I'm not?

      Deliver this as a highly structured breakdown using Markdown headers, bold key terms, and a comparative table for consensus vs. debates to ensure deep conceptual parsing.
    form_fields:
      topic:
        default: ''
    label: '[Prompts] Research Foundation Form (Core Concepts & Assumptions)'
    # I need to research . Before we dive in, help me build a solid foundation:
    search_terms:
      - prompts

