          - Prompt Writing Masterclass
          - Workflow Automation Bootcamp
          - AI Starter Workshop For Non-Tech Professionals
          - Classroom AI For Educators
          - AI Tools For Property Agents
      student_name:
        type: text
        default: there
    label: "[Social Strategy] Academy"
