# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: :pomo
    replace: |
      🍅 **Técnica Pomodoro: Foco Ativado**
      1. Listar tarefas: [ ]
      2. Cronômetro: 25 min ⏱️
      3. Concentração Total: Trabalhar sem distrações.
      4. Pausa Curta: 5 min ☕
      5. Ciclo: Repetir 4 vezes, depois fazer uma pausa mais longa (15-30 min).
    label: '[Productivity] Pomodoro 25/5 Focus Sprint (Técnica Pomodoro)'
    comment: '🍅 **Técnica Pomodoro: Foco Ativado**'
    search_terms:
      - productivity

  - trigger: :333
    replace: |
      ⚡ **Método 3/3/3: Definição de Foco**
      • [ ] 3 Horas de Trabalho Profundo (Projeto Importante): ____________________
      • [ ] 3 Tarefas Curtas e Urgentes (Ou Reuniões):
            1. ____________________
            2. ____________________
            3. ____________________
      • [ ] 3 Tarefas de Manutenção (Manter a vida funcionando):
            1. ____________________
            2. ____________________
            3. ____________________
    label: '[Productivity] Oliver Burkeman 3/3/3 Daily Focus Method'
    comment: '⚡ **Método 3/3/3: Definição de Foco**'
    search_terms:
      - productivity

  - trigger: :eisen
    form: |
      📊 **Matriz de Eisenhower: Classificação de Prioridade**
      Tarefa: [[tarefa]]

      [ [[quadrante]] ] -> Ação recomendada.
    form_fields:
      tarefa:
        default: ''
      quadrante:
        type: choice
        values:
          - Urgente & Importante -> FAÇA AGORA
          - Não Urgente & Importante -> AGENDE
          - Urgente & Não Importante -> DELEGUE
          - Não Urgente & Não Importante -> ELIMINE
    label: '[Productivity] Eisenhower Urgency vs Importance Priority Matrix'
    comment: '📊 **Matriz de Eisenhower: Classificação de Prioridade**'
    search_terms:
      - productivity

  - trigger: :sapo
    replace: |
      🐸 **Coma o Sapo: A tarefa mais difícil primeiro!**
      "Se o seu trabalho é comer um sapo, é melhor fazê-lo logo de manhã cedo. E se o seu trabalho é comer dois sapos, é melhor comer o maior primeiro." - Mark Twain

      • HOJE, meu maior sapo é: ____________________
    label: '[Productivity] Eat That Frog (Highest Friction Priority First)'
    comment: '🐸 **Coma o Sapo: A tarefa mais difícil primeiro!**'
    search_terms:
      - productivity

  - trigger: :seinfeld
    replace: |
      📅 **Estratégia Seinfeld: Não Quebre a Corrente!**
      Objetivo: ____________________
      Regra de Ouro: Nunca perca 2 dias seguidos.

      Progresso para {{mes_atual}} / {{ano_atual}}:
      {{calendario}}
    vars:
      - name: mes_atual
        type: date
        params:
          format: '%B'
      - name: ano_atual
        type: date
        params:
          format: '%Y'
      - name: calendario
        type: shell
        params:
          cmd: cal -h | sed '1,2d'
    label: '[Productivity] Seinfeld Habit Chain Tracker (Don''t Break The Chain)'
    comment: '📅 **Estratégia Seinfeld: Não Quebre a Corrente!**'
    search_terms:
      - productivity

  - trigger: :tblock
    replace: |
      ⏳ **Time Blocking: Cronograma do Dia**
      • Passo 1: Identifique o que precisa ser feito.
      • Passo 2: Agrupe atividades semelhantes.
      • Passo 3: Atribua horários para tarefas.

      | Horário     | Bloco de Atividade               | Concluído |
      |-------------|----------------------------------|-----------|
      | 09:00 - 12:00| 🧠 Trabalho Profundo             | [ ]       |
      | 12:00 - 12:30| 📧 E-mail / Comunicação           | [ ]       |
      | 12:30 - 13:00| 🍽️ Almoço                        | [ ]       |
      | 13:00 - 14:00| 🏋️ Ginásio / Saúde                | [ ]       |
      | 14:00 - 14:30| ☕ Pausa / Descompressão         | [ ]       |
      | 14:30 - 16:00| 👥 Reuniões / Alinhamento        | [ ]       |
    label: '[Productivity] Time-Blocking Daily Schedule Planner'
    comment: '⏳ **Time Blocking: Cronograma do Dia**'
    search_terms:
      - productivity

  - trigger: :blockday
    replace: |
      ## 🕒 Time-Blocking Architecture
      - **08h - 09h**: Planejamento & Alinhamento Estratégico
      - **09h - 11h**: 🚀 Trabalho Profundo (Foco Total / Zero Distrações)
      - **11h - 12h**: Reuniões / Foco Criativo / Revisão Semanal
      - **12h - 13h**: Almoço / Desconexão
      - **13h - 15h**: 🚀 Trabalho Profundo (Execução de Alta Intensidade)
      - **15h - 16h**: Admin / E-mail / Triagem de Mensagens
      - **16h - 17h**: Revisão do Dia / Ajuste de Pendências

      > **Nota Importante:** Nada disto importa se você estiver constantemente distraído. Desligue as notificações e proteja seu foco.
    label: '[Productivity] Daily Time-Blocking Hourly Architecture'
    comment: '## 🕒 Time-Blocking Architecture'
    search_terms:
      - productivity

  - trigger: :parkinson
    form: |
      ### ⏱️ Parkinson's Law Execution Blueprint
      * **Macro Objetivo**: [[macro_task]]
      * **Micro Etapa Dedicada**: [[micro_step]]
      * **Prazo Artificial Restrito**: [[minutes]] minutos (Foco Absoluto)

      ---
      *Ação: Iniciar cronômetro imediatamente. O esforço se expande para preencher o tempo alocado. Reduza o tempo, aumente a intensidade.*
    form_fields:
      macro_task:
        type: text
        default: Refatoração de Arquitetura
      micro_step:
        type: text
        default: Mapeamento de DataWeave e Mocking
      minutes:
        type: choice
        values:
          - '15'
          - '30'
          - '45'
          - '60'
    label: '[Productivity] Parkinson''s Law Constraint Execution Blueprint'
    comment: '### ⏱️ Parkinson''s Law Execution Blueprint'
    search_terms:
      - productivity

  - trigger: :workstyle
    form: |
      ### 🛠️ Perfil Operacional Selecionado: [[perfil]]

      #### 🔄 Rotina Diária de Alta Performance:
      1. **Planejamento**: [[passo1]]
      2. **Execução Primária**: [[passo2]]
      3. **Sustentabilidade**: [[passo3]]
      4. **Encerramento**: [[passo4]]
    form_fields:
      perfil:
        type: choice
        values:
          - Planejador (Foco Cronológico)
          - Priorizador (Foco em Impacto)
          - Organizador (Foco Estrutural)
          - Visualizador (Foco Ágil/Mental)
      passo1:
        default: Planeje seu dia hora a hora / Escreva a lista de tarefas claras
      passo2:
        default: Foco profundo ininterrupto por 2 horas
      passo3:
        default: Fazer pausa estratégica para respirar / Pomodoro controlado
      passo4:
        default: Trabalhar em tarefas leves / Revisar progresso e fechar o dia
    label: '[Productivity] Operational Workstyle & Energy Profile Blueprint'
    comment: '### 🛠️ Perfil Operacional Selecionado:'
    search_terms:
      - productivity

  - trigger: :flowtpl
    replace: |
      ### Framework: Estado de Flow
      - **Plenitude**: Alcançando objetivos sem esforço. Propósito e valores.
      - **Felicidade**: Imersão no presente, alegria e atemporalidade.
      - **Persistência**: Foco contínuo e motivação para superar obstáculos.
      - **Clareza**: Metas claras, clareza mental e foco aprimorado.
    label: '[Productivity] Flow State Framework & Fulfillment Calibration'
    comment: '### Framework: Estado de Flow'
    search_terms:
      - productivity

  - trigger: :flowgate
    replace: |
      ---
      type: focus-block
      timestamp: {{current_time}}
      alignment:
        cares_about: {{form_flowgate.importa}}
        long_term: {{form_flowgate.longo_prazo}}
        challenging: {{form_flowgate.desafiador}}
        skill_match: {{form_flowgate.bom_nisso}}
      primary_state: {{form_flowgate.foco_predominante}}
      ---
      # 🎯 Focus Block: {{form_flowgate.block_objective}}

      > "Estado de Flow: Quando seu corpo e mente se conectam perfeitamente, levando a um foco intenso e engajamento sem esforço."

      Status: Inicializado. Proteção de flow-state ativa.
    vars:
      - name: current_time
        type: date
        params:
          format: '%Y-%m-%d %H:%M'
      - name: form_flowgate
        type: form
        params:
          layout: |
            ---
            type: focus-block
            alignment:
              cares_about: [[importa]]
              long_term: [[longo_prazo]]
              challenging: [[desafiador]]
              skill_match: [[bom_nisso]]
            primary_state: [[foco_predominante]]
            ---
            # 🎯 Focus Block: [[block_objective]]

            > "Estado de Flow: Quando seu corpo e mente se conectam perfeitamente, levando a um foco intenso e engajamento sem esforço."

            Status: Inicializado. Proteção de flow-state ativa.
          fields:
            block_objective:
              default: Engineering / Architecture Execution
            importa:
              type: choice
              values:
                - Sim (Plenitude/Felicidade)
                - Não (Alerta de Baixo Propósito)
            longo_prazo:
              type: choice
              values:
                - Sim (Plenitude/Persistência)
                - Não (Alerta de Linha de Frente Tática)
            desafiador:
              type: choice
              values:
                - Sim (Persistência/Clareza)
                - Não (Alerta de Tédio/Rotina)
            bom_nisso:
              type: choice
              values:
                - Sim (Felicidade/Clareza)
                - Não (Alerta de Atrito de Aprendizado)
            foco_predominante:
              type: choice
              values:
                - FLOW TOTAL (Todos os quadrantes presentes)
                - Plenitude (Propósito e Alinhamento)
                - Felicidade (Imersão e Atemporalidade)
                - Persistência (Foco Resiliente)
                - Clareza (Metas Cristalinas)
    label: '[Productivity] Focus-Block Gate & Core Value Alignment Note'
    comment: '---'
    search_terms:
      - productivity

  - trigger: :antivision
    replace: |
      ### 🚫 Anti-Visão vs. 🎯 Visão Real
      *Calibrado em: {{current_date}}*

      #### 1. A Anti-Visão (O que evitar)
      {{form_antivision.antivision_items}}

      #### 2. A Visão Real (O oposto estratégico)
      {{form_antivision.real_vision}}

      ---
      *Foco Fundamental:* Escrever diariamente, exercitar-se com consistência e refinar o ofício.
    vars:
      - name: current_date
        type: date
        params:
          format: '%Y-%m-%d'
      - name: form_antivision
        type: form
        params:
          layout: |
            ### 🚫 Anti-Visão vs. 🎯 Visão Real

            #### 1. A Anti-Visão (O que evitar)
            [[antivision_items]]

            #### 2. A Visão Real (O oposto estratégico)
            [[real_vision]]
          fields:
            antivision_items:
              type: multiline
              default: |
                - Rotinas sem sentido e caos.
                - Hábitos não saudáveis.
                - Trabalho sem propósito.
            real_vision:
              type: multiline
              default: |
                - Autonomia total e clareza de execução.
                - Engenharia de sistemas escaláveis.
    label: '[Productivity] Anti-Vision vs Real Vision Life Calibration'
    comment: '### 🚫 Anti-Visão vs. 🎯 Visão Real'
    search_terms:
      - productivity

  - trigger: :ghostmode
    replace: |
      ## 🥷 Protocolo de Foco: Desaparecer por Seis Meses

      ### 🪐 Filtro de Entropia (Eliminação de Distrações)
      - **Corte Técnico:** Redes sociais e inputs de baixa qualidade eliminados.
      - **Social:** Zero dependência de validação externa ou explicações desnecessárias.

      ### 🧪 Mentalidade Científica (Tentativa e Erro)
      - **Experimento do Dia:** Tratar falhas apenas como dados de ajuste de rota.
      - **Perspectiva:** Visão de longo prazo. O crescimento exponencial é composto por ações chatas e repetitivas.

      ### 🔩 Execução dos Fundamentos
      - [ ] Praticar habilidades essenciais do ofício.
      - [ ] Proteger o bloco de foco profundo.
    label: '[Productivity] 6-Month Ghost Mode Extreme Focus Protocol'
    comment: '## 🥷 Protocolo de Foco: Desaparecer por Seis Meses'
    search_terms:
      - productivity

  - trigger: :pararef
    replace: |
      ### Método P.A.R.A. — Resumo de Organização
      - **Projetos**: Conjuntos de tarefas com um objetivo e prazo definidos. (Ex: Preparar uma apresentação para uma conferência)
      - **Áreas**: Aspectos da vida que precisam de manutenção contínua. (Ex: Saúde, finanças pessoais)
      - **Recursos**: Coleções de informações temáticas de seu interesse. (Ex: Artigos sobre produtividade, cursos de design gráfico)
      - **Arquivo**: Informações valiosas do passado que você deseja manter, mas não está usando ativamente no momento. (Ex: Projetos concluídos, trabalhos acadêmicos antigos)
    label: '[Productivity] P.A.R.A. Method Reference (Projects, Areas, Resources, Archive)'
    comment: '### Método P.A.R.A. — Resumo de Organização'
    search_terms:
      - productivity

  - trigger: :flowtxt
    replace: |
      🎯 COMO ENTRAR NO ESTADO DE FLOW
      Quando seu corpo e mente se conectam perfeitamente, levando a um foco intenso e engajamento sem esforço, frequentemente descrito como estar "na zona".

      🧠 OS 4 PILARES:
      • PLENITUDE: Alcançando objetivos sem esforço, profundo senso de propósito e alinhamento com valores.
      • FELICIDADE: Imersão no presente, sentimentos de alegria e senso de atemporalidade.
      • PERSISTÊNCIA: Foco e determinação contínuos, superando desafios com facilidade e motivação.
      • CLAREZA: Entendimento claro de metas, clareza mental e consciência aguçada das ações.

      🌀 A INTERSECÇÃO:
      Para atingir o Flow, sua atividade deve unir: Algo que você se importa + Algo de longo prazo + Algo desafiador + Algo em que você é bom.
    label: '[Productivity] Flow State Entry Manual (Csikszentmihalyi Protocol)'
    comment: 🎯 COMO ENTRAR NO ESTADO DE FLOW
    search_terms:
      - productivity

  - trigger: :flowform
    replace: |
      # 🌀 Meu Planejamento para o Estado de Flow
      Data: {{atual}}

      Para garantir foco intenso e engajamento sem esforço hoje, vou me alinhar com:

      1. ❤️ Algo com que me importo (Propósito):
         > {{form_flowform.importa}}

      2. ⏳ Algo de longo prazo (Consistência):
         > {{form_flowform.longo_prazo}}

      3. ⚡ Algo desafiador (Estímulo):
         > {{form_flowform.desafiador}}

      4. 💪 Algo em que sou bom (Habilidade):
         > {{form_flowform.habilidade}}

      ---
      "Corpo e mente conectados perfeitamente. Hora de entrar na zona! 🚀"
    vars:
      - name: atual
        type: date
        params:
          format: '%d/%m/%Y'
      - name: form_flowform
        type: form
        params:
          layout: |
            1. ❤️ Algo com que me importo:
            [[importa]]

            2. ⏳ Algo de longo prazo:
            [[longo_prazo]]

            3. ⚡ Algo desafiador:
            [[desafiador]]

            4. 💪 Algo em que sou bom:
            [[habilidade]]
    label: '[Productivity] 🌀 Meu Planejamento para o Estado de Flow'
    comment: '# 🌀 Meu Planejamento para o Estado de Flow'
    search_terms:
      - productivity

  - trigger: :flow-ref
    replace: |
      # Como Entrar no Estado de Flow
      > Quando seu corpo e mente se conectam perfeitamente, levando a um foco intenso e engajamento sem esforço ("na zona").

      ## 🎯 Os 4 Pilares de Alinhamento
      * **Algo com que você se importa** -> Conecta à **Plenitude**
        * Alcançando objetivos sem esforço.
        * Profundo senso de propósito e satisfação.
        * Envolvendo-se em atividades que se alinham com valores pessoais.
      * **Algo em que você é bom** -> Conecta à **Felicidade**
        * Imersão no momento presente.
        * Sentimentos de alegria e contentamento.
        * Vivenciando um senso de atemporalidade.
      * **Algo desafiador** -> Conecta à **Clareza**
        * Entendimento claro de metas e objetivos.
        * Clareza mental e foco aprimorados.
        * Consciência aguçada dos arredores e ações.
      * **Algo de longo prazo** -> Conecta à **Persistência**
        * Foco e determinação contínuos.
        * Superando desafios com facilidade.
        * Energizado e motivado para superar obstáculos.
    label: '[Productivity] Como Entrar no Estado de Flow'
    comment: '# Como Entrar no Estado de Flow'
    search_terms:
      - productivity

  - trigger: :flowcheck
    replace: |
      ---
      type: log/execution-audit
      evaluated_at: {{current_date}}
      target_task: "{{form_output.task_name}}"
      vectors:
        significance: {{form_output.v_care}}
        horizon: {{form_output.v_long}}
        mastery: {{form_output.v_good}}
        tension: {{form_output.v_challenge}}
      execution_mode: {{form_output.mode}}
      ---
    vars:
      - name: current_date
        type: date
        params:
          format: '%Y-%m-%d %H:%M'
      - name: form_output
        type: form
        params:
          layout: |
            Target Task: [[task_name]]

            Vectors:
            ℹ️ significance: # Algo com que você se importa
            [[v_care]]

            ℹ️ horizon: # Algo de longo prazo
            [[v_long]]

            ℹ️ mastery: # Algo em que você é bom
            [[v_good]]

            ℹ️ tension: # Algo desafiador
            [[v_challenge]]

            Mode: [[mode]]
          fields:
            v_care:
              type: choice
              values:
                - HIGH (Plenitude)
                - LOW (Apathy)
            v_long:
              type: choice
              values:
                - STRATEGIC (Persistência)
                - TACTICAL (Short-term)
            v_good:
              type: choice
              values:
                - EXPERT (Felicidade)
                - LEARNING (Friction)
            v_challenge:
              type: choice
              values:
                - OPTIMAL (Clareza)
                - UNDERWHELMING (Boredom)
                - OVERWHELMING (Anxiety)
            mode:
              type: choice
              values:
                - Deep Work / Flow Protection
                - Administrative / Maintenance
                - Exploratory / R&D
    label: '[Productivity] Flowcheck'
    comment: '---'
    search_terms:
      - productivity

  - trigger: :p-calendar
    form: |
      Here's my calendar for the week:

      [[calendar_details]]

      Act as a time management expert and help me batch similar tasks, reduce context switching, and free up focus time.
    form_fields:
      calendar_details:
        type: multiline
    label: '[Productivity] Time Management Expert And Help Me Batch Similar Tasks'
    comment: 'Here''s my calendar for the week:'
    search_terms:
      - productivity

  - trigger: :c-mapmanual
    form: |
      I do this task manually:
      [[task]]

      Map every step in detail, identify which steps could be automated, and design an automation that handles the full workflow.
    form_fields:
      task:
        multiline: true
    label: '[Productivity] Manual Process Automation Mapping'
    comment: Maps repetitive manual workflows into automated trigger-action pipelines.
    search_terms:
      - productivity

  - trigger: :c-zapier
    form: |
      Design a Zapier workflow that automates [[process]]. Define the trigger, all the steps in sequence, what data is passed between steps, and how errors are handled.
    form_fields:
      process:
        multiline: true
    label: '[Productivity] Zapier / Make Multi-Step Automation'
    comment: Designs automated multi-app integrations with error handling and data formatting.
    search_terms:
      - productivity

  - trigger: :c-emailseq
    form: |
      Design an automated email sequence for [[purpose]]. Write the copy for each email, define the triggers and timing, and explain the goal of each message.
    form_fields:
      purpose:
        multiline: true
    label: '[Productivity] Automated Email Nurture Sequence'
    comment: Crafts personalized multi-email onboarding and nurture drip campaigns.
    search_terms:
      - productivity

  - trigger: :c-datapipeline
    form: |
      Design a data pipeline that takes [[input]], transforms it by [[transformations]], and loads it into [[destination]]. Include error handling and monitoring.
    form_fields:
      input:
        multiline: true
      transformations:
        multiline: true
    label: '[Productivity] ETL Data Pipeline Architecture'
    comment: Structures scheduled data extraction, transformation, validation, and loading jobs.
    search_terms:
      - productivity

  - trigger: :c-reportgen
    form: |
      Design an automation that pulls data from [[sources]], calculates [[metrics]], generates a [[format]] report, and sends it to [[recipients]] every [[frequency]].
    form_fields:
      sources:
        multiline: true
      metrics:
        multiline: true
      format:
        default: Markdown / PDF
      frequency:
        default: week
    label: '[Productivity] Automated Executive Report Generator'
    comment: Transforms raw metric tables into polished executive summaries with action items.
    search_terms:
      - productivity

  - trigger: :c-leadbot
    form: |
      Design an automated lead qualification system that [[inflow_channel]], asks qualifying questions, scores them against [[criteria]], and routes them to the right person.
    form_fields:
      inflow_channel:
        multiline: true
      criteria:
        multiline: true
    label: '[Productivity] Inbound Lead Qualification Bot Flow'
    comment: Designs qualification question flows that score leads and route to sales teams.
    search_terms:
      - productivity

  - trigger: :c-custonboard
    form: |
      Design an automated customer onboarding flow for [[product]]. What happens at each step, what triggers the next step, and how are stuck customers identified and helped?
    form_fields:
      product:
        multiline: true
    label: '[Productivity] Zero-Friction Customer Onboarding Flow'
    comment: Automates account provisioning, welcome tours, and time-to-first-value milestones.
    search_terms:
      - productivity

  - trigger: :c-monitoralerts
    form: |
      Design an automated monitoring system for [[target]]. What metrics trigger alerts, how are alerts prioritized, and what information is included in each alert?
    form_fields:
      target:
        multiline: true
    label: '[Productivity] Monitoring & Incident Alerting Routing'
    comment: Configures signal-to-noise alert thresholds, escalation policies, and on-call paging.
    search_terms:
      - productivity

  - trigger: :c-supporttriage
    form: |
      Design an automation for [[support_channel]] that receives support requests, categorizes them by type and priority, routes them to the right team, and sends an acknowledgment to the customer.
    form_fields:
      support_channel:
        default: Zendesk / Intercom / Email
    label: '[Productivity] Support Ticket Auto-Triage & Routing'
    comment: Classifies incoming support requests by urgency, category, and assigned tier.
    search_terms:
      - productivity

  - trigger: :c-pubpipeline
    form: |
      Design an automated content publishing pipeline that takes a draft, runs it through [[checks]], formats it for [[platforms]], schedules publication, and tracks distribution.
    form_fields:
      checks:
        multiline: true
      platforms:
        default: Substack, LinkedIn, Twitter/X, Blog
    label: '[Productivity] Content Publishing & Distribution Pipeline'
    comment: Automates multi-platform formatting, scheduling, and asset repurposing.
    search_terms:
      - productivity

  - trigger: :c-compmonitor
    form: |
      Design an automation that monitors [[competitors]] for changes to [[what_to_monitor]] and delivers a weekly digest with the most important changes highlighted.
    form_fields:
      competitors:
        multiline: true
      what_to_monitor:
        multiline: true
    label: '[Productivity] Automated Competitor Pricing & Feature Watch'
    comment: Sets up tracking workflows for competitor price shifts, changelogs, and job postings.
    search_terms:
      - productivity

  - trigger: :c-crmautomation
    form: |
      Design automations for [[crm_system]] that handle [[scenarios]]. What triggers each automation, what actions does it take, and how does it update records?
    form_fields:
      crm_system:
        default: HubSpot / Salesforce
      scenarios:
        multiline: true
    label: '[Productivity] CRM Pipeline Stage Automation'
    comment: Automates deal stage updates, task assignments, and stale deal reminders in CRM.
    search_terms:
      - productivity

  - trigger: :c-employeeonboard
    form: |
      Design an automated employee onboarding workflow for [[role_or_department]] that handles account creation, equipment provisioning, training assignments, introduction emails, and day-one check-ins.
    form_fields:
