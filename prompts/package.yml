  - trigger: :prod-build-your-signature-slogan
    form: |2

      1. BUILD YOUR SIGNATURE SLOGAN

      <role>Act as a personal brand symbol designer applying Seth Godin's
      Purple Cow framework - every idea worth spreading has a visual symbol
      so distinct it stops people mid-scroll and makes them say "what is that?"
      </role>

      <task>Design a signature symbol for my brand that makes it instantly
      recognizable and impossible to confuse with anyone else in my space.
      </task>

      <steps>
      1. Ask for my core idea, brand, and target audience before starting
      2. Identify the single most remarkable concept my brand represents
      3. Design 3 symbol options - visual, object, or metaphor that captures
      the idea instantly
      4. Test each symbol - can it be drawn, described, or demonstrated in
      under 10 seconds
      5. Select the strongest symbol and show exactly how to use it across
      content and presentations
      </steps>

      <rules>
      - Symbol must be remarkable - Godin's definition: worth making a
      remark about
      - Symbol must be ownable - not already associated with a competitor
      - Symbol must survive without color - if it only works in full design it's
      too fragile
      - Symbol must be describable in one sentence to a complete stranger
      - Test: if someone sees it once, can they draw it from memory a week
      later
      </rules>

      <output>3 Symbol Options - Remarkability Test - Strongest Symbol -
      How to Use It Everywhere</output>

      ------

      2. CREATE YOUR SIGNATURE SLOGAN

      <role>Act as a brand slogan engineer applying Seth Godin's permission mar-
      keting framework - every idea worth spreading has a phrase so specific that
      people repeat it without being asked and share it without being paid .< /role>

      <task>Create a signature slogan for my brand that becomes the handle
      people use to remember, repeat, and recommend me - without me asking
      them to .< /task>

      <steps>
      1. Ask for my core idea, target audience, and what I want to be known for
      before starting
      2. Extract the single most remarkable truth about what I do or believe
      3. Generate 5 slogan options - short, specific, and impossible to
      misattribute
      4. Test each slogan - would Godin's "smallest viable audience" repeat this
      without prompting
      5. Select the strongest and show exactly how to embed it in content, bio,
      and
      presentations
      </steps>

      <rules>
      - Slogan must be under 6 words - never a sentence
      - Slogan must be specific enough to own - not generic enough for anyone
      - Slogan must survive without context - it means something even to a
      stranger
      - Never use buzzwords - "innovative," "disruptive," "game-changing" are in-
      stant slogan killers
      - Test: would someone repeat this in a meeting and attribute it directly to
      me
      </rules>

      <output>5 Slogan Options - Remarkability Test - Strongest Slogan - How
      to Embed It Everywhere</output>

      ------

      3. FIND YOUR SIGNATURE SURPRISE

      <role>Act as a counterintuitive idea specialist applying Seth Godin's
      Purple
      Cow principle - the only ideas that spread are the ones that surprise
      people into sharing them before they even think about it .< /role>

      <task>Identify the single most counterintuitive truth about my field and
      turn it into the Purple Cow that makes my brand impossible to scroll
      past .< /task>

      <steps>
      1. Ask for my field, core belief, and target audience before starting
      2. Identify the most widely accepted belief in my field that I know to be
      wrong or incomplete
      3. Articulate the counterintuitive truth that challenges it - Godin's "idea
      worth spreading"
      4. Test the surprise - does it make people stop and say "wait, really?"
      5. Build the reveal sequence - how to deliver the surprise for maximum
      spread in content and presentations
      </steps>

      <rules>
      - Surprise must be genuinely remarkable - not just interesting or contrar-
      ian
      - Surprise must be defensible - I must be able to prove it when
      challenged
      - Surprise must connect directly to my core idea - not a random hot take
      - Delivery must build tension before the reveal - never lead with the
      answer
      - Test: does this make someone screenshot it and send it to a friend
      </rules>

      <output>Widely Accepted Belief - Counterintuitive Truth - Remarkability
      Test - Reveal Sequence</output>

      ------

      4. BUILD YOUR SALIENT IDEA

      <role>Act as a core idea sharpener applying Seth Godin's "be specific to someone" framework - the brands that get famous are never for everyone, they are unforgettable to someone specific .</role>

      <task>Identify and sharpen the single salient idea that defines my brand - specific enough to own, remarkable enough to spread, and clear enough that my smallest viable audience immediately gets it .</task>

      <steps>
      1. Ask for everything I do, teach, or sell before starting
      2. Map every idea, concept, and message I currently communicate
      3. Apply Godin's smallest viable audience test - which idea resonates most deeply with the specific people I want to serve
      4. Sharpen it until it cannot be confused with anyone else's idea
      5. Show how every piece of content, every offer, and every presentation points back to this one salient idea
      </steps>

      <rules>
      - One salient idea only - two ideas means no idea
      - Idea must be for someone specific - not everyone
      - Every piece of content must connect back to this idea
      - If the idea could belong to a competitor it is not salient enough
      - Test: does my smallest viable audience immediately say "this is exactly for me"
      </rules>

      <output>Idea Map - Smallest Viable Audience Test - Sharpened Salient Idea - How Everything Points Back to It</output>

      ------

      5. TELL YOUR SIGNATURE STORY

      <role>Act as a brand story architect applying Seth Godin's "stories are how
      we make meaning" framework - every brand that gets famous has a story
      that makes people feel something before they decide anything .< /role>

      <task>Build my signature brand story - the narrative that makes my small-
      est viable audience feel immediately understood and makes everyone else
      want to become part of it .< /task>

      <steps>
      1. Ask for my background, core belief, and defining moment before starting
      2. Identify the turning point - the specific moment that changed every-
      thing
      3. Apply Godin's "tension and resolution" framework - build the story arc:
      before, tension, turning point, after
      4. Extract the universal truth that makes my personal story feel relevant to
      my specific audience
      5. Write the signature story in under 3 minutes - specific enough to be
      mine, resonant enough to spread
      </steps>

      <rules>
      - Story must create tension before resolution - Godin says tension is what
      makes people lean in
      - Universal truth must be extracted explicitly - never left implied
      - Story must be under 3 minutes when spoken - never a biography
      - Before must make the audience feel the struggle - not just describe it
      - Test: does this story make someone say "that's exactly how I feel"
      </rules>

      <output>Turning Point - Tension and Resolution Arc - Universal Truth -
      3-Minute Signature Story Script</output>
    label: '[Prompts] Build Your Signature Slogan'
    comment: 1. BUILD YOUR SIGNATURE SLOGAN
