      problem:
        type: multiline
    label: "[Thinking Prompts] Recurring Problem Snapshot (Deconstruct Habits)"
    comment: "I keep repeating this recurring problem:"
    search_terms:
      - thinking-prompts
      - thinking prompts

  - trigger: :think-mirror
