    search_terms:
      - social-strategy

      - social strategy
  - trigger: :systems
    form: "### Proposed Integration: [[system_architecture]]

      *   **Target Scope:** Production deployment of [[system_architecture]] architecture.

      *   **Core Objective:** Zero-Touch operational execution to reduce manual overhead.

      *   **Implementation Track:** Discovery Mapping → Sandbox Testing → Staff Capability Building.

      *   **Project Fee:** [[investment_tier]] (50% upfront milestone initialization).

      "
    form_fields:
      system_architecture:
        type: choice
        values:
          - Smart Inbox Management
          - Automated Billing Workflows
          - Sales Lead Qualification
          - Zero Touch Data Entry
          - Candidate Screening Flows
      investment_tier:
        type: choice
        values:
          - ₹1,500,000 (Base Tier Integration)
          - ₹4,500,000 (Mid-Market Scale)
          - ₹8,000,000 (Enterprise Custom Architecture)
    label: "[Social Strategy] Proposed Integration: [[system_architecture]]"
    comment: "### Proposed Integration:"
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :studio
    form:
      "We can lock down your request for [[deliverable_type]] under our asset production umbrella. We deliver these assets at a fraction of standard traditional agency overhead because we build them utilizing optimized AI generation frameworks.


      When would be a good time to review your brand design guidelines?

      "
    form_fields:
      deliverable_type:
        type: choice
        values:
          - Executive Ghostwriting & Long Form Blogs
          - Video Script Production & Audio Show Notes
          - AI Product Photography & Short Form Video Ads
          - Brand Identity Design & Visual Brand Systems
    label: "[Social Strategy] Studio"
    comment: We can lock down your request for  under our asset production umbrella. We deliver these assets at a fraction of standar
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :follow-like-comment
    replace: "SAVE THIS FOR LATER, FOLLOW, LIKE AND COMMENT

      "
    label: "[Social Strategy] Social Engagement Call-To-Action (CTA)"
    comment: High-converting call to action prompt encouraging saves, shares, and comments.
    search_terms:
      - social-strategy

      - social strategy
