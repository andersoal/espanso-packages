      I'm feeling stuck in my career and unsure of my direction. Ask me 10 deep questions about my skills, interests, values, and past experiences that brought me joy. Based on my answers, identify 3-5 potential career paths that align with who I am, and create a 90-day action plan to explore each one with specific steps, resources, and milestones.
    label: '[Career] I''M Feeling Stuck In My Career And Unsure Of My Direction'
    comment: 'I''m feeling stuck in my career and unsure of my direction. Ask me 10 deep questions about my skills, interests, values, '
    search_terms:
      - career
  - trigger: :p-decision
    replace: |
      “Using what you know about my career goals and values, create a decision tree for this dilemma: [describe your dilemma, e.g. should I change jobs or stay?]. Ask 7 yes/no questions that filter step by step based on my priorities as you know them from our conversations. Make the outcomes super concrete, with clear actions (like ‘request this meeting,’ ‘update your CV,’ ‘plan a trial day’), not vague suggestions. Format it so I can screenshot it and reuse it anytime.”
    label: '[Career] P Decision'
    comment: '“Using what you know about my career goals and values, create a decision tree for this dilemma: [describe your dilemma, '
    search_terms:
      - career
  - trigger: :p-success
    replace: |
      “Based on my talents and character, what’s the way I can be most successful and happy in my career and life?”
    label: '[Career] P Success'
    comment: “Based on my talents and character, what’s the way I can be most successful and happy in my career and life?”
    search_terms:
      - career
  - trigger: :profile-as-lp
    form: |2

      Act as a LinkedIn profile strategist trained on Justin Welsh's principle that your profile is not a resume - it is the highest-converting landing page you will ever own. Job-seekers optimize for keywords. Operators optimize for one specific reader who, if they understood what you do in 12 seconds, would either book a call, subscribe, or remember you for later.

      Rebuild my profile as a landing page:

      Rewrite my headline so it answers three questions in under 220 characters: who I help, what I help them do, and how they know I'm credible

      Rewrite my About section as a one-screen pitch - first sentence earns the read, middle three sentences prove the claim, final sentence tells them exactly what to do next

      Audit my Featured section and replace anything that doesn't generate leads, subscribers, or recognition with assets that do

      Rewrite each Experience entry as a contribution statement what I shipped, who it served, what changed - never a job description

      Stress-test the rebuilt profile against the question "would my ideal client know what to do within 12 seconds of landing here"

      Inputs: My current headline, About section, and top three Experience entries. The single person I want to convert (specific, not a demographic). My one offer or asset I want them to engage with.

      Output: Rewritten Headline → One-Screen About Section → Featured Section Audit

      Rewritten Experience Entries → 12-Second Conversion Verdict
    label: '[Career] Profile As Lp'
    comment: Act as a LinkedIn profile strategist trained on Justin Welsh's principle that your profile is not a resume - it is the h
    search_terms:
      - career
  - trigger: :ai-interview
    form: |
      Roleplay as a [[job_title]] at [[company]].

      Using my CV and the job description:
      - Conduct a behavioral interview
      - Ask one challenging question at a time
      - After each answer, provide: Critique (strengths) & Refinement (how to improve impact)
      - Gradually increase difficulty level
    form_fields:
      job_title:
        type: text
      company:
        type: text
    label: '[Career] Roleplay As A  At'
    comment: Roleplay as a  at .
    search_terms:
      - career
  - trigger: :resume-quantifier
    replace: |
      Act as a resume strategist at McKinsey & Company. Turn every bullet into measurable impact:

      * Add metrics: revenue, cost savings, growth, time saved, scale
      * Quantify leadership, process creation, and improvements
      * Use the formula: Achieved X -> Result Y -> By doing Z
      * Highlight promotions, ownership, and outcomes

      Output:
      * Before vs after for every bullet
      * Fully quantified achievement statements

      Input: Your current bullet points
    label: '[Career] McKinsey Resume Quantifier & Action Verbs'
    comment: Transforms generic resume bullet points into quantified impact statements.
    search_terms:
      - career
  - trigger: :experience-glowup
    replace: |
      Rewrite each of my job descriptions using the XYZ formula: 'Accomplished X by doing Y, resulting in Z. Add metrics where possible. Make me sound like I drove real impact, not just 'managed tasks.'
    label: '[Career] Job Experience & Promotion Glow-Up'
    comment: Highlights leadership scope, cost savings, and revenue metrics in past job roles.
    search_terms:
      - career
  - trigger: :about-section-rewrite
    replace: |
      Turn my About section into a story that hooks recruiters in the first 2 lines. Use the PAS framework (Problem, Agitate, Solution). Keep it under 2000 characters and end with a clear CTA.
    label: '[Career] LinkedIn About Section Storyteller'
    comment: Turns a dry professional summary into a compelling career narrative that attracts recruiters.
    search_terms:
      - career
  - trigger: :resume-builder
    replace: |
      Act as the recruiter hiring for this role. Score my resume out of 100, list the keywords it's missing, name the 3 things that would make you reject it in 10 seconds, then rewrite the whole thing tailored to this exact job. Be brutal.
    label: '[Career] Targeted Role-Specific Resume Builder'
    comment: Tailors resume achievements directly to match target job description keywords.
    search_terms:
      - career
