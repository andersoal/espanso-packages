# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  # ===========================================================================
  # CORE ENGINEERING, TDD & IMPLEMENTATION
  # ===========================================================================

  # --- Step-by-Step Implementation Loop ---
  - triggers:
      - :implement
      - :build
    word: true
    replace: |
      Let's implement this feature step-by-step according to the specification:
      1. Review the specification and identify the exact minimal changes required.
      2. Make small, focused edits without speculative refactoring.
      3. Verify each change against existing tests and type checkers before proceeding.
      4. Preserve existing documentation and backwards compatibility.
    label: "[Agent Skills] Step-by-Step Implementation Loop (Direct)"
    comment: Let's implement this feature step-by-step according to the specification.
    search_terms:
      - mattpocock-skills
      - implement
      - build
      - coding

  - triggers:
      - :implement-form
      - :build-form
      - :f-implement
    word: true
    form: |
      Implement this feature step-by-step according to the specification:

      **Specification / Goal:**
      [[goal]]

      **Target Code / Context:**
      [[context]]

      **Technical Constraints:**
      [[constraints]]

      **Implementation Protocol:**
      1. Review the specification and identify the exact minimal changes required.
      2. Implement changes in small, logical steps without speculative refactoring.
      3. Verify each step against existing tests, type checkers, and edge cases.
      4. Ensure backwards compatibility and preserve existing documentation.
    form_fields:
      goal:
        multiline: true
      context:
        multiline: true
      constraints:
        multiline: true
    label: "[Agent Skills] Step-by-Step Implementation Loop (Interactive Form)"
    comment: Interactive form for step-by-step implementation.
    search_terms:
      - mattpocock-skills
      - implement-form
      - build-form
      - form

  # --- Test-Driven Development (TDD) ---
  - triggers:
      - :tdd
      - :tdd-loop
    word: true
    replace: |
      Let's work using strict Test-Driven Development (TDD) following the Red-Green-Refactor loop:
      1. **Red:** Write a minimal, focused unit/integration test first that asserts the desired behavior. Verify it fails for the expected reason.
      2. **Green:** Write the simplest code necessary to make the test pass.
      3. **Refactor:** Clean up code, remove duplication, and sharpen module boundaries while keeping all tests passing.
      4. Repeat incrementally.
    label: "[Agent Skills] Test-Driven Development (Direct)"
    comment: Let's work using strict Test-Driven Development (TDD) following the Red-Green-Refactor loop.
    search_terms:
      - mattpocock-skills
      - tdd
      - test
      - testing
      - red-green-refactor

  - triggers:
      - :tdd-form
      - :tdd-loop-form
      - :f-tdd
    word: true
    form: |
      Let's work using strict Test-Driven Development (TDD) following the Red-Green-Refactor loop:

      **Goal / Feature to Implement:**
      [[goal]]

      **Test Framework & Environment:**
      [[framework]]

      **Target Files / Scope:**
      [[files]]

      **TDD Protocol:**
      1. **Red:** Write a minimal, focused unit or integration test that asserts the required behavior. Run the test and verify it fails for the exact expected reason.
      2. **Green:** Write the simplest possible code to make the test pass.
      3. **Refactor:** Clean up code, remove duplication, and sharpen module boundaries while keeping all tests green.
      4. Repeat the loop incrementally.
    form_fields:
      goal:
        multiline: true
      framework:
        type: choice
        values:
          - Vitest / Jest (JavaScript / TypeScript)
          - Pytest (Python)
          - Cargo test (Rust)
          - Go test (Go)
          - Playwright / Cypress (E2E)
          - Universal / Other Test Runner
      files:
        default: ""
    label: "[Agent Skills] Test-Driven Development (Interactive Form)"
    comment: Interactive form for Test-Driven Development.
    search_terms:
      - mattpocock-skills
      - tdd-form
      - test-form
      - form

