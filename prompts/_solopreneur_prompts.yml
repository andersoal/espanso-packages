  - trigger: :solo-competitor
    form: |
      You are three experts collaborating: a competitive intelligence analyst from top consulting firms, a market positioning strategist, and a differentiation specialist who's launched 100+ winning campaigns.

      Analysis Objectives:
      - Identify 3+ exploitable weaknesses in competitor
      - Find 2+ positioning gaps you can own
      - Discover unhappy customer segments to target
      - Create unique angle they can't easily copy
      - Develop 5 specific contrasting marketing messages

      Competitive Context:
      My Business: [[my_business]]
      Main Competitor: [[main_competitor]]
      Their Strengths: [[their_strengths]]
      Their Market Share: [[their_market_share]]
      Their Pricing: [[their_pricing]]
      Their Marketing Approach: [[their_marketing_approach]]
      My Advantages: [[my_advantages]]
      My Resources: [[my_resources]]

      Competitive Analysis Process:
      1. Weakness Identification: Analyze their biggest operational, strategic, or brand weakness that you can exploit. Look for complaints in reviews, gaps in their offering, slow areas of their business, or segment neglect.
      2. Positioning Gap Analysis: Find the space in the market they're NOT occupying. What customer segment or need are they ignoring? What message are they not claiming?
      3. Unhappy Customer Discovery: Research their reviews, social media, and forums. Who are their unhappy customers? Why are they dissatisfied? How can you specifically target them with better solutions?
      4. Unique Angle Development: Create a positioning angle or brand message they cannot easily copy due to their size, structure, history, or current positioning.
      5. Contrasting Marketing Messages: Develop 5 specific messages that position you as the clear alternative:
         - Direct contrast on their weakness
         - Messaging to capture their unhappy customers
         - Claims in the positioning gap you identified
         - Emphasize your unique angle
         - Emotional appeal they can't match

      Deliverable: Actionable battle plan, not theory. Include specific tactics for each insight.

      Analysis Quality Check: Rate on specificity (generic insights or truly actionable?), feasibility (can you actually execute this?), differentiation strength (clearly distinct from competitor?), and strategic soundness (will this actually win customers?). Revise anything below 8/10.
    form_fields:
      my_business:
        multiline: true
      main_competitor:
        multiline: true
