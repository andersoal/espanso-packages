        default: 'Specify the structure: Markdown tables, JSON schemas, or bullet points.'
    label: '[Prompts] TREF Domain Framework (Task Requirement Expectation Format Header)'
    # # [TREF Prompt] — Context:
    search_terms:
      - prompts

