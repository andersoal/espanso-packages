    vars:
      - name: output
        type: shell
        params:
          shell: cmd
          cmd: python %CONFIG%\match\packages\utils\scripts\fake.py paragraph
    comment: Generates a random placeholder paragraph of lorem ipsum text.
    search_terms:
      - utils
  - trigger: :lorem
    label: "[Utils] Lorem Ipsum Placeholder (Sentence)"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          shell: cmd
          cmd: python %CONFIG%\match\packages\utils\scripts\fake.py sentence
    comment: Generates a single sentence of lorem ipsum placeholder text.
    search_terms:
      - utils
