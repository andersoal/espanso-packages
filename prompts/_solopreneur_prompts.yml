        Length: Under 150 words. Subject line: Direct and final. One clear CTA: Stay on the list or unsubscribe.

      Sequence Quality Review: Assess psychology effectiveness (triggers the right emotions?), value demonstration (shows what they're missing?), pressure calibration (urgent without desperate?), and authenticity (genuinely trying to serve them?). Revise any email below 8/10.
