# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
matches:
  # Plain text replacement
  - trigger: ":sig"
    label: "[Personal] Email Signature (Standard Full Contact Details)"
    replace: "Jane Doe | jane@example.com"

  # Regex trigger
  - regex: ":greet\\((?P<person>.*)\\)"
    label: "[Greetings] Friendly Greeting (Personalized Name Salutation)"
    replace: "Hey {{person}}, hope you're doing well!"

  # Date variable
  - trigger: ":today"
    label: "[General] Current Date (ISO YYYY-MM-DD Format)"
    replace: "{{date}}"
    vars:
      - name: date
        type: date
        params:
          format: "%Y-%m-%d"

  # Form variable
  - trigger: ":followup"
    label: "[Email] Follow-Up Note (Interactive Recipient & Topic Form)"
    form: |
      Hi [[name]],
      Following up on [[topic]] — let me know if you have questions.
    form_fields:
      name:
        default: ""
      topic:
        default: ""

  # Shell variable
  - trigger: ":myip"
    label: "[Network] Public IP Lookup (Fetch External IP via Curl)"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "curl ifconfig.me"
