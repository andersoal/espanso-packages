    vars:
      - name: clipboard
        type: clipboard
    label: "[Utils] Google Search from Clipboard"
    comment: https://google.com/search?q={{clipboard}}
    search_terms:
      - utils
  - trigger: :swc-choice
    replace: "{{engine}}{{clipboard}}"
    vars:
      - name: engine
        type: choice
        params:
          values:
            - label: Google
              id: https://google.com/search?q=
            - label: DuckDuckGo
              id: https://duckduckgo.com/?q=
            - label: Wikipedia
              id: https://en.wikipedia.org/w/?search=
            - label: GitHub
              id: https://github.com/search?q=
            - label: StackOverflow
