      - **Action**: [[action]]
      - **Context**: [[context]]
      - **Expectation**: [[expectation]]
    form_fields:
      action:
        multiline: true
      context:
        multiline: true
      expectation:
        multiline: true
    label: '[Prompts] RACE Framework (Role Action Context Expectation Structure)'
    # Analyze and generate:
    search_terms:
      - prompts

  - trigger: :dream
