# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: :pomo
    replace: |
      🍅 **Pomodoro Technique: Focus Activated**
      1. List tasks: [ ]
      2. Timer: 25 min ⏱️
      3. Total Concentration: Work with zero distractions.
      4. Short Break: 5 min ☕
      5. Cycle: Repeat 4 times, then take a longer break (15-30 min).
    label: "[Productivity] Pomodoro 25/5 Focus Sprint"
    # 🍅 **Pomodoro Technique: Focus Activated**
    search_terms:
      - productivity
      - pomodoro
      - focus

  - trigger: :333
    replace: |
      ⚡ **3/3/3 Method: Daily Focus Plan**
      • [ ] 3 Hours of Deep Work (Important Project): ____________________
      • [ ] 3 Short & Urgent Tasks (Or Meetings):
            1. ____________________
            2. ____________________
            3. ____________________
      • [ ] 3 Maintenance Tasks (Keeping life functioning):
            1. ____________________
            2. ____________________
            3. ____________________
    label: "[Productivity] Oliver Burkeman 3/3/3 Daily Focus Method"
    # ⚡ **3/3/3 Method: Daily Focus Plan**
    search_terms:
      - productivity
      - burkeman
      - "333"

  - trigger: :eisen
    form: |
      📊 **Eisenhower Matrix: Priority Classification**
      Task: [[task]]

      [ [[quadrant]] ] -> Recommended Action.
    form_fields:
      task:
        default: ""
      quadrant:
        type: choice
        values:
          - Urgent & Important -> DO NOW
          - Not Urgent & Important -> SCHEDULE
          - Urgent & Not Important -> DELEGATE
          - Not Urgent & Not Important -> ELIMINATE
    label: "[Productivity] Eisenhower Urgency vs Importance Priority Matrix"
    # 📊 **Eisenhower Matrix: Priority Classification**
    search_terms:
      - productivity
      - eisenhower
      - matrix
      - priorities

  - triggers:
      - :eatfrog
      - :frog
    replace: |
      🐸 **Eat That Frog: The hardest task first!**
      "If it's your job to eat a frog, it's best to do it first thing in the morning. And If it's your job to eat two frogs, it's best to eat the biggest one first." — Mark Twain

      • TODAY, my biggest frog is: ____________________
    label: "[Productivity] Eat That Frog (Highest Friction Priority First)"
    # 🐸 **Eat That Frog: The hardest task first!**
    search_terms:
      - productivity
      - frog
      - priority

  - trigger: :seinfeld
    replace: |
      📅 **Seinfeld Strategy: Don't Break The Chain!**
      Goal / Habit: ____________________
      Golden Rule: Never miss 2 days in a row.

      Progress for {{current_month}} / {{current_year}}:
      {{calendar}}
    vars:
      - name: current_month
        type: date
        params:
          format: "%B"
      - name: current_year
        type: date
        params:
          format: "%Y"
      - name: calendar
        type: shell
        params:
          cmd: cal -h | sed '1,2d'
    label: "[Productivity] Seinfeld Habit Chain Tracker (Don't Break The Chain)"
    # 📅 **Seinfeld Strategy: Don''t Break The Chain!**
    search_terms:
      - productivity
      - habit
      - seinfeld

  - trigger: :tblock
    replace: |
      ⏳ **Time Blocking: Daily Schedule**
      • Step 1: Identify what needs to get done.
      • Step 2: Batch similar activities together.
      • Step 3: Assign time blocks to tasks.

      | Time Block   | Activity Block                   | Done |
      |--------------|----------------------------------|------|
      | 09:00 - 12:00| 🧠 Deep Work                     | [ ]  |
      | 12:00 - 12:30| 📧 Email / Communication         | [ ]  |
      | 12:30 - 13:00| 🍽️ Lunch                         | [ ]  |
      | 13:00 - 14:00| 🏋️ Gym / Health                  | [ ]  |
      | 14:00 - 14:30| ☕ Break / Decompression         | [ ]  |
      | 14:30 - 16:00| 👥 Meetings / Alignment          | [ ]  |
    label: "[Productivity] Time-Blocking Daily Schedule Planner"
    # ⏳ **Time Blocking: Daily Schedule**
    search_terms:
      - productivity
      - timeblocking
      - schedule

  - trigger: :blockday
    replace: |
      ## 🕒 Time-Blocking Architecture
      - **08:00 - 09:00**: Planning & Strategic Alignment
      - **09:00 - 11:00**: 🚀 Deep Work (Total Focus / Zero Distractions)
      - **11:00 - 12:00**: Meetings / Creative Focus / Weekly Review
      - **12:00 - 13:00**: Lunch / Disconnect
      - **13:00 - 15:00**: 🚀 Deep Work (High-Intensity Execution)
      - **15:00 - 16:00**: Admin / Email / Message Triage
      - **16:00 - 17:00**: Daily Review / Wrap-up & Tomorrow Prep

      > **Important Note:** None of this matters if you are constantly distracted. Turn off notifications and protect your focus.
    label: "[Productivity] Daily Time-Blocking Hourly Architecture"
    # ## 🕒 Time-Blocking Architecture
    search_terms:
      - productivity
      - timeblocking
      - schedule

  - trigger: :parkinson
    form: |
      ### ⏱️ Parkinson's Law Execution Blueprint
      * **Macro Objective**: [[macro_task]]
      * **Micro Dedicated Step**: [[micro_step]]
      * **Artificial Time Limit**: [[minutes]] minutes (Absolute Focus)

      ---
      *Action: Start timer immediately. Work expands to fill the time available for its completion. Reduce time, increase intensity.*
    form_fields:
      macro_task:
        default: Architecture Refactoring
      micro_step:
        default: Data mapping and contract validation
      minutes:
        type: choice
        values:
          - "15"
          - "30"
          - "45"
          - "60"
    label: "[Productivity] Parkinson's Law Constraint Execution Blueprint"
    # ### ⏱️ Parkinson''s Law Execution Blueprint
    search_terms:
      - productivity
      - parkinson
      - focus
      - timer

  - trigger: :workstyle
    form: |
      ### 🛠️ Selected Operational Profile: [[profile]]

      #### 🔄 High-Performance Daily Routine:
      1. **Planning**: [[step1]]
      2. **Primary Execution**: [[step2]]
      3. **Sustainability**: [[step3]]
      4. **Wrap-Up**: [[step4]]
    form_fields:
      profile:
        type: choice
        values:
          - Planner (Chronological Focus)
          - Prioritizer (Impact Focus)
          - Arranger (Structural Focus)
          - Visualizer (Agile/Mental Focus)
      step1:
        default: Plan your day hour-by-hour / Write a clear task list
      step2:
        default: 2 hours of uninterrupted deep work
      step3:
        default: Take a strategic breathing break / Controlled Pomodoro
      step4:
        default: Work on light administrative tasks / Review progress and close the day
    label: "[Productivity] Operational Workstyle & Energy Profile Blueprint"
    # ### 🛠️ Selected Operational Profile:
    search_terms:
      - productivity
      - workstyle
      - energy

  - trigger: :flowtpl
    replace: |
      ### Framework: Flow State
      - **Fulfilment**: Effortless goal achievement. Purpose and values.
      - **Happiness**: Immersion in the present, joy, and timelessness.
      - **Persistence**: Continuous focus and motivation to overcome obstacles.
      - **Clarity**: Clear goals, mental clarity, and enhanced focus.
    label: "[Productivity] Flow State Framework & Fulfillment Calibration"
    # ### Framework: Flow State
    search_terms:
      - productivity
      - flow

  - trigger: :flowgate
    replace: |
      ---
      type: focus-block
      timestamp: {{current_time}}
      alignment:
        cares_about: {{form_flowgate.cares_about}}
        long_term: {{form_flowgate.long_term}}
        challenging: {{form_flowgate.challenging}}
        skill_match: {{form_flowgate.skill_match}}
      primary_state: {{form_flowgate.predominant_focus}}
      ---
      # 🎯 Focus Block: {{form_flowgate.block_objective}}

      > "Flow State: When body and mind connect seamlessly, leading to intense focus and effortless engagement."

      Status: Initialized. Flow-state protection active.
    vars:
      - name: current_time
        type: date
        params:
          format: "%Y-%m-%d %H:%M"
      - name: form_flowgate
        type: form
        params:
          layout: |
            ---
            type: focus-block
            alignment:
              cares_about: [[cares_about]]
              long_term: [[long_term]]
              challenging: [[challenging]]
              skill_match: [[skill_match]]
            primary_state: [[predominant_focus]]
            ---
            # 🎯 Focus Block: [[block_objective]]

            > "Flow State: When body and mind connect seamlessly, leading to intense focus and effortless engagement."

            Status: Initialized. Flow-state protection active.
          fields:
            block_objective:
              default: Engineering / Architecture Execution
            cares_about:
              type: choice
              values:
                - Yes (Fulfilment/Happiness)
                - No (Low Purpose Warning)
            long_term:
              type: choice
              values:
                - Yes (Fulfilment/Persistence)
                - No (Tactical Front-Line Warning)
            challenging:
              type: choice
              values:
                - Yes (Persistence/Clarity)
                - No (Boredom/Routine Warning)
            skill_match:
              type: choice
              values:
                - Yes (Happiness/Clarity)
                - No (Learning Friction Warning)
            predominant_focus:
              type: choice
              values:
                - TOTAL FLOW (All quadrants present)
                - Fulfilment (Purpose and Alignment)
                - Happiness (Immersion and Timelessness)
                - Persistence (Resilient Focus)
                - Clarity (Crystal-Clear Goals)
    label: "[Productivity] Focus-Block Gate & Core Value Alignment Note"
    # ---
    search_terms:
      - productivity
      - flow

  - trigger: :antivision
    replace: |
      ### 🚫 Anti-Vision vs. 🎯 Real Vision
      *Calibrated on: {{current_date}}*

      #### 1. The Anti-Vision (What to Avoid)
      {{form_antivision.antivision_items}}

      #### 2. The Real Vision (The Strategic Counterpart)
      {{form_antivision.real_vision}}

      ---
      *Core Focus:* Write daily, exercise consistently, and sharpen the craft.
    vars:
      - name: current_date
        type: date
        params:
          format: "%Y-%m-%d"
      - name: form_antivision
        type: form
        params:
          layout: |
            ### 🚫 Anti-Vision vs. 🎯 Real Vision

            #### 1. The Anti-Vision (What to Avoid)
            [[antivision_items]]

            #### 2. The Real Vision (The Strategic Counterpart)
            [[real_vision]]
          fields:
            antivision_items:
              multiline: true
              default: |
                - Meaningless routines and chaos.
                - Unhealthy habits and low energy.
                - Work without purpose or leverage.
            real_vision:
              multiline: true
              default: |
                - Total autonomy and execution clarity.
                - Scalable systems engineering.
    label: "[Productivity] Anti-Vision vs Real Vision Life Calibration"
    # ### 🚫 Anti-Vision vs. 🎯 Real Vision
    search_terms:
      - productivity
      - vision
      - anti-vision

  - trigger: :ghostmode
    replace: |
      ## 🥷 Focus Protocol: Disappear for 6 Months (Ghost Mode)

      ### 🪐 Entropy Filter (Distraction Elimination)
      - **Technical Cut:** Social media and low-quality informational inputs eliminated.
      - **Social:** Zero reliance on external validation or unnecessary explanations.

      ### 🧪 Scientific Mindset (Trial & Iteration)
      - **Daily Experiment:** Treat setbacks purely as course-correction data points.
      - **Perspective:** Long-term compounding. Exponential growth is built on boring, repetitive fundamentals.

      ### 🔩 Fundamental Execution
      - [ ] Practice essential craft skills daily.
      - [ ] Protect the deep work focus block.
    label: "[Productivity] 6-Month Ghost Mode Extreme Focus Protocol"
    # ## 🥷 Focus Protocol: Disappear for 6 Months (Ghost Mode)
    search_terms:
      - productivity
      - ghostmode
      - focus

  - trigger: :pararef
    replace: |
      ### P.A.R.A. Method — Organization Overview
      - **Projects**: Series of tasks with a defined outcome and deadline. (e.g., Prepare a conference presentation)
      - **Areas**: Spheres of activity with a standard to be maintained over time. (e.g., Health, Personal Finances)
      - **Resources**: Topics or themes of ongoing interest. (e.g., Productivity frameworks, UI/UX design patterns)
      - **Archive**: Inactive items from the other three categories to keep for reference. (e.g., Completed projects, past coursework)
    label: "[Productivity] P.A.R.A. Method Reference (Projects, Areas, Resources, Archive)"
    # ### P.A.R.A. Method — Organization Overview
    search_terms:
      - productivity
      - para
      - pkm

  - trigger: :flowtxt
    replace: |
      🎯 HOW TO ENTER THE FLOW STATE
      When body and mind connect seamlessly, leading to intense focus and effortless engagement — often described as being "in the zone".

      🧠 THE 4 PILLARS:
      • FULFILMENT: Effortless goal achievement, deep sense of purpose, and alignment with values.
      • HAPPINESS: Present-moment immersion, feelings of joy, and a sense of timelessness.
      • PERSISTENCE: Sustained focus and determination, navigating challenges with ease and drive.
      • CLARITY: Crystal-clear understanding of goals, mental lucidity, and heightened awareness of actions.

      🌀 THE INTERSECTION:
      To enter Flow, your activity must unite: Something you care about + Something long-term + Something challenging + Something you are good at.
    label: "[Productivity] Flow State Entry Manual (Csikszentmihalyi Protocol)"
    # 🎯 HOW TO ENTER THE FLOW STATE
    search_terms:
      - productivity
      - flow

  - trigger: :flowform
    replace: |
      # 🌀 Daily Flow State Planning
      Date: {{current_date}}

      To ensure deep focus and effortless engagement today, I align with:

      1. ❤️ Something I care about (Purpose):
         > {{form_flowform.cares_about}}

      2. ⏳ Something long-term (Consistency):
         > {{form_flowform.long_term}}

      3. ⚡ Something challenging (Stimulus):
         > {{form_flowform.challenging}}

      4. 💪 Something I'm good at (Mastery):
         > {{form_flowform.mastery}}

      ---
      "Body and mind connected seamlessly. Time to enter the zone! 🚀"
    vars:
      - name: current_date
        type: date
        params:
          format: "%Y-%m-%d"
      - name: form_flowform
        type: form
        params:
          layout: |
            1. ❤️ Something I care about:
            [[cares_about]]

            2. ⏳ Something long-term:
            [[long_term]]

            3. ⚡ Something challenging:
            [[challenging]]

            4. 💪 Something I'm good at:
            [[mastery]]
    label: "[Productivity] Daily Flow State Planning Worksheet"
    # # 🌀 Daily Flow State Planning
    search_terms:
      - productivity
      - flow

  - trigger: :flow-ref
    replace: |
      # How to Enter the Flow State
      > When body and mind connect seamlessly, leading to intense focus and effortless engagement ("in the zone").

      ## 🎯 The 4 Alignment Pillars
      * **Something you care about** -> Connects to **Fulfilment**
        * Effortless goal achievement.
        * Deep sense of purpose and meaning.
        * Engaging in activities that align with personal values.
      * **Something you're good at** -> Connects to **Happiness**
        * Immersion in the present moment.
        * Feelings of joy and contentment.
        * Experiencing a sense of timelessness.
      * **Something challenging** -> Connects to **Clarity**
        * Crystal-clear understanding of goals and milestones.
        * Enhanced mental clarity and concentration.
        * Heightened situational awareness and intentional action.
      * **Something long-term** -> Connects to **Persistence**
        * Sustained focus and resilient determination.
        * Overcoming roadblocks with ease.
        * Energized and motivated to push through friction.
    label: "[Productivity] How to Enter the Flow State Reference"
    # # How to Enter the Flow State Reference
    search_terms:
      - productivity
      - flow

  - trigger: :flowcheck
    replace: |
      ---
      type: log/execution-audit
      evaluated_at: {{current_date}}
      target_task: "{{form_output.task_name}}"
      vectors:
        significance: {{form_output.v_care}}
        horizon: {{form_output.v_long}}
        mastery: {{form_output.v_good}}
        tension: {{form_output.v_challenge}}
      execution_mode: {{form_output.mode}}
      ---
    vars:
      - name: current_date
        type: date
        params:
          format: "%Y-%m-%d %H:%M"
      - name: form_output
        type: form
        params:
          layout: |
            Target Task: [[task_name]]

            Vectors:
            ℹ️ significance: # Something you care about
            [[v_care]]

            ℹ️ horizon: # Something long-term
            [[v_long]]

            ℹ️ mastery: # Something you are good at
            [[v_good]]

            ℹ️ tension: # Something challenging
            [[v_challenge]]

            Mode: [[mode]]
          fields:
            v_care:
              type: choice
              values:
                - HIGH (Fulfilment)
                - LOW (Apathy)
            v_long:
              type: choice
              values:
                - STRATEGIC (Persistence)
                - TACTICAL (Short-term)
            v_good:
              type: choice
              values:
                - EXPERT (Happiness)
                - LEARNING (Friction)
            v_challenge:
              type: choice
              values:
                - OPTIMAL (Clarity)
                - UNDERWHELMING (Boredom)
                - OVERWHELMING (Anxiety)
            mode:
              type: choice
              values:
                - Deep Work / Flow Protection
                - Administrative / Maintenance
                - Exploratory / R&D
    label: "[Productivity] Flow State Vector Audit & Diagnostic"
    # ---
    search_terms:
      - productivity
      - flow

  - trigger: :p-calendar
    form: |
      Here's my calendar for the week:

      [[calendar_details]]

      Act as a time management expert and help me batch similar tasks, reduce context switching, and free up focus time.
    form_fields:
      calendar_details:
        multiline: true
    label: "[Productivity] Time Management Expert And Help Me Batch Similar Tasks"
    # Here''s my calendar for the week:
    search_terms:
      - productivity

  - trigger: :c-mapmanual
    form: |
      I do this task manually:
      [[task]]

      Map every step in detail, identify which steps could be automated, and design an automation that handles the full workflow.
    form_fields:
      task:
        multiline: true
    label: "[Productivity] Manual Process Automation Mapping"
    # Maps repetitive manual workflows into automated trigger-action pipelines.
    search_terms:
      - productivity

  - trigger: :c-zapier
    form: |
      Design a Zapier workflow that automates [[process]]. Define the trigger, all the steps in sequence, what data is passed between steps, and how errors are handled.
    form_fields:
      process:
        multiline: true
    label: "[Productivity] Zapier / Make Multi-Step Automation"
    # Designs automated multi-app integrations with error handling and data formatting.
    search_terms:
      - productivity

  - trigger: :c-emailseq
    form: |
      Design an automated email sequence for [[purpose]]. Write the copy for each email, define the triggers and timing, and explain the goal of each message.
    form_fields:
      purpose:
        multiline: true
    label: "[Productivity] Automated Email Nurture Sequence"
    # Crafts personalized multi-email onboarding and nurture drip campaigns.
    search_terms:
      - productivity

  - trigger: :c-datapipeline
    form: |
      Design a data pipeline that takes [[input]], transforms it by [[transformations]], and loads it into [[destination]]. Include error handling and monitoring.
    form_fields:
      input:
        multiline: true
      transformations:
        multiline: true
    label: "[Productivity] ETL Data Pipeline Architecture"
    # Structures scheduled data extraction, transformation, validation, and loading jobs.
    search_terms:
      - productivity

  - trigger: :c-reportgen
    form: |
      Design an automation that pulls data from [[sources]], calculates [[metrics]], generates a [[format]] report, and sends it to [[recipients]] every [[frequency]].
    form_fields:
      sources:
        multiline: true
      metrics:
        multiline: true
      format:
        default: Markdown / PDF
      frequency:
        default: week
    label: "[Productivity] Automated Executive Report Generator"
    # Transforms raw metric tables into polished executive summaries with action items.
    search_terms:
      - productivity

  - trigger: :c-leadbot
    form: |
      Design an automated lead qualification system that [[inflow_channel]], asks qualifying questions, scores them against [[criteria]], and routes them to the right person.
    form_fields:
      inflow_channel:
        multiline: true
      criteria:
        multiline: true
    label: "[Productivity] Inbound Lead Qualification Bot Flow"
    # Designs qualification question flows that score leads and route to sales teams.
    search_terms:
      - productivity

  - trigger: :c-custonboard
    form: |
      Design an automated customer onboarding flow for [[product]]. What happens at each step, what triggers the next step, and how are stuck customers identified and helped?
    form_fields:
      product:
        multiline: true
    label: "[Productivity] Zero-Friction Customer Onboarding Flow"
    # Automates account provisioning, welcome tours, and time-to-first-value milestones.
    search_terms:
      - productivity

  - trigger: :c-monitoralerts
    form: |
      Design an automated monitoring system for [[target]]. What metrics trigger alerts, how are alerts prioritized, and what information is included in each alert?
    form_fields:
      target:
        multiline: true
    label: "[Productivity] Monitoring & Incident Alerting Routing"
    # Configures signal-to-noise alert thresholds, escalation policies, and on-call paging.
    search_terms:
      - productivity

  - trigger: :c-supporttriage
    form: |
      Design an automation for [[support_channel]] that receives support requests, categorizes them by type and priority, routes them to the right team, and sends an acknowledgment to the customer.
    form_fields:
      support_channel:
        default: Zendesk / Intercom / Email
    label: "[Productivity] Support Ticket Auto-Triage & Routing"
    # Classifies incoming support requests by urgency, category, and assigned tier.
    search_terms:
      - productivity

  - trigger: :c-pubpipeline
    form: |
      Design an automated content publishing pipeline that takes a draft, runs it through [[checks]], formats it for [[platforms]], schedules publication, and tracks distribution.
    form_fields:
      checks:
        multiline: true
      platforms:
        default: Substack, LinkedIn, Twitter/X, Blog
    label: "[Productivity] Content Publishing & Distribution Pipeline"
    # Automates multi-platform formatting, scheduling, and asset repurposing.
    search_terms:
      - productivity

  - trigger: :c-compmonitor
    form: |
      Design an automation that monitors [[competitors]] for changes to [[what_to_monitor]] and delivers a weekly digest with the most important changes highlighted.
    form_fields:
      competitors:
        multiline: true
      what_to_monitor:
        multiline: true
    label: "[Productivity] Automated Competitor Pricing & Feature Watch"
    # Sets up tracking workflows for competitor price shifts, changelogs, and job postings.
    search_terms:
      - productivity

  - trigger: :c-crmautomation
    form: |
      Design automations for [[crm_system]] that handle [[scenarios]]. What triggers each automation, what actions does it take, and how does it update records?
    form_fields:
      crm_system:
        default: HubSpot / Salesforce
      scenarios:
        multiline: true
    label: "[Productivity] CRM Pipeline Stage Automation"
    # Automates deal stage updates, task assignments, and stale deal reminders in CRM.
    search_terms:
      - productivity

  - trigger: :c-employeeonboard
    form: |
      Design an automated employee onboarding workflow for [[role_or_department]] that handles account creation, equipment provisioning, training assignments, introduction emails, and day-one check-ins.
    form_fields:
      role_or_department:
        default: Engineering / All New Hires
    label: "[Productivity] Automated Employee Onboarding Checklist"
    # Generates automated provisioning checklists, IT requests, and 30-60-90 day schedules.
    search_terms:
      - productivity

  - trigger: :c-meetfollowup
    form: |
      Design an automation that processes meeting transcripts, extracts action items, assigns them to owners, creates tasks in [[pm_tool]], and sends follow-up emails.
    form_fields:
      pm_tool:
        default: Linear / Jira / Notion
    label: "[Productivity] Meeting Minutes & Automated Follow-Up"
    # Formats meeting transcript notes into structured emails with owners and deadlines.
    search_terms:
      - productivity

  - trigger: :c-pricemonitor
    form: |
      Design an automation that monitors competitor prices for [[products]] across [[channels]], alerts when significant changes occur, and provides pricing recommendations.
    form_fields:
      products:
        multiline: true
      channels:
        default: Websites, Amazon, API feeds
    label: "[Productivity] Dynamic Pricing & Competitor Tracking"
    # Designs price monitoring alerts with margin rules and competitor scrapers.
    search_terms:
      - productivity

  - trigger: :c-jobscreen
    form: |
      Design an automation for the recruitment process that posts jobs, screens applications against [[criteria]], schedules interviews for qualified candidates, and sends rejections.
    form_fields:
      criteria:
        multiline: true
    label: "[Productivity] Candidate Resume Screening Matrix"
    # Screens candidate qualifications against job requirements with structured scoring.
    search_terms:
      - productivity

  - trigger: :c-winback
    form: |
      Design an automated win-back campaign for churned customers of [[product_or_service]]. What triggers it, what is the sequence of messages, what offers are made, and when does it stop?
    form_fields:
      product_or_service:
        multiline: true
    label: "[Productivity] Churned Customer Win-Back Campaign"
    # Designs targeted win-back offers and exit-survey feedback collection.
    search_terms:
      - productivity

  - trigger: :c-salesforecast
    form: |
      Design an automation that pulls data from [[data_sources]], applies [[forecasting_model]], generates weekly forecast reports, and flags deals needing attention.
    form_fields:
      data_sources:
        multiline: true
      forecasting_model:
        multiline: true
    label: "[Productivity] Sales Pipeline & Revenue Forecasting Model"
    # Calculates weighted pipeline projections based on conversion historicals and deal stages.
    search_terms:
      - productivity

  - trigger: :c-ittickets
    form: |
      Design an automation that receives IT support tickets from [[intake_source]], categorizes them, assigns priority, routes to the right team, and tracks resolution time against SLAs.
    form_fields:
      intake_source:
        default: Slack / Jira Service Desk / Email
