  - trigger: :recursive-decomposition
    replace: |
      Apply recursive decomposition to extract the principles through the following methodology:

      Recursion Down - Level 1: Break the success into its 3-5 major phases chronologically. For each phase, identify the outcome it produced that enabled the next phase.

      Recursion Down - Level 2: Within each phase, identify the 2-4 key decisions or actions that most directly contributed to that phase's outcome. Ignore everything that happened - only the moves that mattered.
    label: "[Learn] Recursive Principle Decomposition Protocol"
    comment: Breaks complex skills down through 3 recursive levels to extract core foundational truths.
    search_terms:
      - learn

  - trigger: :success-strategy-cover
    replace: |
      1 AI PROMPT WASHINGTON DECIDES. turns a success strategy into a repeatable system.
    label: "[Learn] Strategy Decomposition: Framework Intro"
    comment: Introduction to the Washington Decides recursive strategy extraction method.
    search_terms:
      - learn

  - trigger: :success-strategy-part7
    replace: |
      Every principle must be specific enough that someone could implement it next week without asking what you mean. Do not stop at what went right. Identify 1-2 things that went wrong or almost failed but were recovered - near-misses contain some of the highest-value lessons. Avoid the temptation to create ten or fifteen principles. Fewer, stronger principles beat a long list nobody remembers.
    label: "[Learn] Strategy Decomposition: Checklist Protocol"
    comment: Translates high-level principles into an actionable operating checklist.
    search_terms:
      - learn

  - trigger: :success-strategy-what-you-get
    replace: |
      A step-by-step protocol.

      A checklist you or your team can run on the next project to hit the same result on purpose.
    label: "[Learn] Strategy Decomposition: Deliverables Summary"
    comment: Overview of the concrete protocols and checklists generated by the framework.
    search_terms:
      - learn

  - trigger: :success-strategy-part5
    replace: |
      Recursion Up - Level 3: Organize the principles into a Repeatable Success Protocol - a checklist or playbook that could be handed to a different team working on a different project to dramatically increase their odds of success.

      After building the protocol, stress-test it by identifying 2-3 scenarios where these principles would need to be adapted, and explain how to modify the protocol for each without losing its core value.
    label: "[Learn] Strategy Decomposition: Level 3 Meta-Principles"
    comment: Extracts universal principles that transfer across diverse domains.
    search_terms:
      - learn

  - trigger: :success-strategy-part4
    replace: |
      Recursion Up - Level 1: From the Level 3 analysis, identify which decisions succeeded because of conditions unique to this specific situation (one-time market window, specific relationship, unrepeatable timing) versus conditions you can recreate or engineer in future projects (process design, information systems, decision criteria, team structure).
    label: "[Learn] Strategy Decomposition: Level 1 Synthesis"
    comment: Synthesizes granular tactics back up into overarching foundational rules.
    search_terms:
      - learn

  - trigger: :success-strategy-what-it-does
    replace: |
      It breaks a past success or any strategy into phases and decisions, then finds the mechanics that actually caused it.
    label: "[Learn] Strategy Decomposition: Concept Overview"
    comment: Summary of how recursive decomposition strips vanity to reveal actionable strategy.
    search_terms:
      - learn

  - trigger: :success-strategy-part3
    replace: |
      Recursion Down - Level 3: For each key decision, answer three questions. First, what information or conditions existed at the time that made this the right move? Second, was this decision made deliberately based on reasoning, or did it happen intuitively or accidentally? Third, what would have happened if the opposite decision had been made?
    label: "[Learn] Strategy Decomposition: Level 3 Micro-Mechanisms"
    comment: Drills down into sub-components and exact tactical levers of success.
    search_terms:
      - learn

  - trigger: :success-strategy-part9
    replace: |
      MOST IMPORTANT!: Structure your output with the following sections in order: Phase Decomposition (timeline with phases and their outcomes), Key Decision Register (table format with columns: Phase / Decision / Reasoning / Deliberate or Accidental / Counterfactual), Transferability Sort (two-column format: Situation-Specific Elements vs. Recreatable Elements), Transferability Principles (4-7 principles, each stated as an actionable rule with a one-sentence rationale), Repeatable Success Protocol (sequenced checklist format), Near-Miss Lessons (things that almost went wrong and what they teach), and Adaptation Notes (2-3 scenarios where the protocol needs modification with specific guidance).
    label: "[Learn] Strategy Decomposition: Final Structured Output"
    comment: Outputs the complete 3-level recursive hierarchy with operational guidelines.
    search_terms:
      - learn

  - trigger: :success-strategy-part1
    replace: |
      Adopt the role of a pattern extraction specialist who previously worked in after-action review units for elite military teams, where the mandate after every mission - successful or failed - was to extract every transferable principle before institutional memory decayed. You discovered that most organizations are terrible at learning from their own wins. They celebrate success, attribute it to talent or luck, and move on without understanding the actual mechanics that produced the result.
    label: "[Learn] Strategy Decomposition: Level 1 Foundation"
    comment: Adopts pattern extraction specialist persona to deconstruct success mechanics.
    search_terms:
      - learn

  - trigger: :success-strategy-part6
    replace: |
      Do not attribute the success to talent, hustle, or luck. Those might have contributed, but they aren't transferable. Extract the structural and procedural elements that are. Do not confuse correlation with causation - just because something happened during the success doesn't mean it caused the success. Apply the counterfactual test: if this element had been absent, would the outcome have changed? If not, it's not a real principle. Do not produce principles so generic they could apply to anything ("be customer-focused").
    label: "[Learn] Strategy Decomposition: Execution Hygiene"
    comment: Removes survivorship bias, luck, and vague talent attributions from strategy.
    search_terms:
      - learn

