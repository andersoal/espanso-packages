      "
    label: "[Social Strategy] Our Ai Studio Offerings"
    comment: "Our AI Studio Offerings:"
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :aisow
    form: "### Statement of Work: [[project_focus]]

      **Service Line:** [[studio]]

      **Pricing Model:** [[investment_tier]]


      **Key Deliverables:**

      * Phase 1: AI Readiness Assessment & System Scoping

      * Phase 2: Sandbox Deployment of [[project_focus]]

      * Phase 3: Staff Capability Building & Integration Playbook


      **Estimated Timeline:** 4 - 6 weeks from agreement.

      "
    form_fields:
      studio:
        type: choice
        values:
          - "AI Systems Agency (Target: ₹1.5L - ₹8L)"
          - "AI Strategy Consulting (Target: ₹5K - ₹25K / session)"
          - AI Intelligence Services (Custom Dashboarding)
          - AI Skill Academy (Corporate Training)
          - "AI Mini Product Studio (Target: ₹2.5K - ₹8K / month)"
      investment_tier:
        type: choice
        values:
          - Fixed Project Milestone Basis
          - Monthly Recurring Retainer Contract
          - Per-Session / Hourly Advisory Rate
    label: "[Social Strategy] Statement of Work: [[project_focus]]"
    comment: "### Statement of Work:"
    search_terms:
      - social-strategy

      - social strategy
  - regex: :consult\((?P<client>.*)\)
    replace:
      "Hi {{client}}, I was looking over your current operational stack. Let's get an AI Readiness Assessment or a Tool Selection Advisory session booked for next week to map out where you're leaking margins.

      "
    label: "[Social Strategy] Consult    P Client"
    comment: Hi {{client}}, I was looking over your current operational stack. Let's get an AI Readiness Assessment or a Tool Selecti
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :academy
    form: "Hi [[student_name]],


      Thanks for asking about our training tracks. Based on your goals, I highly recommend our **[[course_selection]]** curriculum. This module is specifically built to help teams master these exact systems in their day-to-day workflows.


      Let me know if you want me to drop the syllabus link over!

      "
    form_fields:
      course_selection:
        type: choice
