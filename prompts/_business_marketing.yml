  - trigger: :post-earn-click
    form: |
      Act as a LinkedIn copywriter applying Welsh's standard: a LinkedIn post earns the read in the first two lines, earns the engagement in the middle, and earns the click on the final line. Most posts fail at line one because writers treat LinkedIn like a blog. Operators treat the first two lines as a billboard and the rest as the road behind it.

      Write a complete post engineered for compounding engagement:

      Open with a two-line hook that creates intellectual tension or specific promise never a question, never a statistic without context

      Deliver the core value in 100-200 words using one named framework, one

      concrete example, and one counterintuitive turn

      Format for the LinkedIn feed - short paragraphs, no walls of text, scannable in 8 seconds

      Close with a single line that earns the next click either to my profile, to a comment thread I'll engage in, or to an asset in my Featured section

      Run the post against the test: would I screenshot this if I weren't the one who wrote it

      Inputs: My post topic. The reader I'm writing to as one specific person. The framework or insight I want associated with my name. The single action I want the reader to take after reading.

      Output: Two-Line Hook → 100-200 Word Core → LinkedIn Feed Formatting Click-

      Earning Close → Screenshot Test Verdict
    label: '[Prompts] Click-Worthy LinkedIn Copy (Welsh''s Standard Engagement Hooks)'
    # Act as a LinkedIn copywriter applying Welsh''s standard: a LinkedIn post earns the read in the first two lines, earns the
    search_terms:
      - prompts

  - trigger: :dm-pipeline
    form: |
      Act as a Linkedin outbound strategist applying Welsh's principle that the highest-conversion outbound on LinkedIn is the one that doesn't feel like outbound. The operators who turn LinkedIn into an actual pipeline are the ones who DM with patience, specificity, and zero pitch in the first message. The pitch is what kills the conversation; the conversation is what produces the pipeline.

      Engineer my DM system:

      Build a triage rule for who I message: someone who engaged with my last three posts, someone whose work I genuinely respect, or someone with a specific problem I can solve never cold lists

      Write the first message under 60 words, references something specific from their content or profile, asks one open question, mentions nothing about my offer

      Write the second message without pivoting to pitch sent only if they reply that deepens the conversation

      Write the third message before any ask sent only when they signal interest - that offers value

      Build the weekly DM rhythm I can sustain quality of conversations, not volume of sends

      Output: Triage Rule → Message 1 (Cold) → Message 2 (Warm) → Message 3 (Earned) → Sustainable Weekly Rhythm
    label: '[Prompts] Outbound DM Pipeline (Conversational Sales Prospecting)'
    # Act as a Linkedin outbound strategist applying Welsh's principle that the highest-conversion outbound on LinkedIn is the
    search_terms:
      - prompts

