# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - trigger: :think-snap
    form: |
      I keep repeating this recurring problem: [[problem]]

      Give me one unexpected exercise that forces me to see it from a completely different angle, and the first small action I should take today.
