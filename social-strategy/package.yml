# yaml-language-server: =https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  - regex: :niche\((?P<target_niche>.*)\)
    replace:
      'Act as a senior social media strategist with over 10 years of experience managing brands in multiple industries. Analyze the niche "{{target_niche}}" and identify the most profitable audience segments, their biggest frustrations, emotional triggers, content consumption habits, and what type of posts make them follow, engage, and buy. Present this in a clear, actionable profile I can build content around.

      '
    label: "[Social Strategy] Niche Audience & Frustration Profiler"
    comment: Act as a senior social media strategist with over 10 years of experience managing brands in multiple industries. Analyze
    search_terms:
      - social-strategy

      - social strategy
  - regex: :position\((?P<target_niche>.*)\)
    replace:
      'Act as a brand positioning expert and help me design a powerful social media identity in the niche "{{target_niche}}". Define what my brand stands for, the unique angle that separates me from competitors, my brand voice and tone, visual aesthetic guidelines, and the core message that will resonate deeply with my target audience.

      '
    label: "[Social Strategy] Brand Identity & Unique Positioning Angle"
    comment: Act as a brand positioning expert and help me design a powerful social media identity in the niche "{{target_niche}}". D
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :pillars
    form:
      "You're a content strategist who has scaled multiple accounts to 100K+ followers. Based on my niche [[niche]] and target audience [[audience]], create 5 content pillars that will drive maximum engagement. For each pillar, explain: why it works, the psychology behind it, 10 post ideas, and how to balance educational/entertaining/promotional content.

      "
    form_fields:
      niche:
        type: text
        default: B2B Software Engineering
      audience:
        type: text
        default: Technical Architects and Enterprise Builders
    label: "[Social Strategy] 5 Core Engagement Content Pillars"
    comment: "You're a content strategist who has scaled multiple accounts to 100K+ followers. Based on my niche  and target audience "
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :calendar
    form:
      "Act as my content calendar manager. Create a complete 30-day posting schedule for [[platform]]. Include: daily post concepts, optimal posting times based on audience behavior, content format variety (carousels/reels/stories), hooks for each post, and strategic CTAs. Make it copy-paste ready.

      "
    form_fields:
      platform:
        type: choice
        values:
          - LinkedIn
          - X (Twitter)
          - YouTube Shorts
          - Instagram
    label: "[Social Strategy] 30-Day Multi-Platform Content Calendar"
    comment: "Act as my content calendar manager. Create a complete 30-day posting schedule for . Include: daily post concepts, optima"
    search_terms:
      - social-strategy

      - social strategy
  - regex: :hooks\((?P<target_niche>.*)\)
    replace:
      "You're a copywriter who has written hooks for posts that got millions of views. Analyze viral content in {{target_niche}} and create 50 hook templates I can customize. Categorize them by: curiosity-driven, controversy, storytelling, listicles, bold statements. Make each one scroll-stopping.

      "
    label: "[Social Strategy] 50 Viral Scroll-Stopping Hook Templates"
    comment: You're a copywriter who has written hooks for posts that got millions of views. Analyze viral content in {{target_niche}
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :engage
    replace:
      "Act as a community management expert. Design my engagement strategy: how to respond to comments authentically, DM conversation starters that build relationships, collaboration outreach templates, how to turn followers into loyal fans, and a daily engagement routine that takes under 30 minutes.

      "
    label: "[Social Strategy] Community Management & Engagement Strategy"
    comment: "Act as a community management expert. Design my engagement strategy: how to respond to comments authentically, DM conver"
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :analytics
    replace: "You're a data analyst for social media. Based on these metrics:


      {{raw_metrics}}


      Identify: what's working and why, what's underperforming and how to fix it, content gaps I should fill, optimal posting frequency, and a 90-day growth roadmap with specific KPIs to hit.

      "
    vars:
      - name: raw_metrics
        type: clipboard
    label: "[Social Strategy] Social Media Metrics & Performance Auditor"
    comment: "You're a data analyst for social media. Based on these metrics:"
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :beforeafter
    replace: '### The Before-and-After Grid

      | Experiential Register | The "Before" State (Point A) | The "After" State (Point B) |

      | --- | --- | --- |

      | **Have** | | |

      | **Feel** | | |

      | **Average Day** | | |

      | **Status** | | |

      | **Good vs. Evil** | | |

      '
    label: "[Social Strategy] Before-and-After Experiential Transformation Grid"
    comment: "### The Before-and-After Grid"
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :epiphany
    replace: "### Epiphany Bridge Narrative Outline

      1. **Backstory:** [Establish the professional starting point to create immediate empathy]

      2. **Desire:** [Articulate the external goals and deeper internal motivations driving the change]

      3. **The Wall:** [Identify the insurmountable obstacle hit within the legacy framework]

      4. **The Epiphany:** [The sudden discovery of the New Opportunity vehicle]

      5. **The Plan:** [The strategic blueprint created to test and validate this discovery]

      6. **The Conflict:** [The intense friction, challenges, and skepticism overcome during execution]

      7. **Achievement:** [Attaining the target end result and proving the validity of the plan]

      8. **Transformation:** [The profound operational and identity shift realized from the journey]

      "
    label: "[Social Strategy] Epiphany Bridge Storytelling Narrative Outline"
    comment: "### Epiphany Bridge Narrative Outline"
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :triage
    replace: '---

      type: interaction

      activity: triage-call

      date: "{{current_date}}"

      status: completed

      ---

      # Triage Call Diagnostic: [Prospect Name]


      ### 1. The Problem

      > What is broken or missing in their current framework, and how long has this friction persisted?

      -


      ### 2. The Impact

      > What are the quantifiable financial, operational, or personal costs of continuing with state-level inaction?

      -


      ### 3. Fit & Urgency

      > Confirm baseline parameters: Do they possess the resources, alignment, and immediate intent to solve it?

      -


      ### 4. Pipeline Disposition

      - [ ] **Advance:** Qualified candidate. Book 45-Minute Strategy Session.

      - [ ] **Redirect:** Unqualified/Poor fit. Disengage or route to low-barrier asynchronous asset.

      '
    vars:
      - name: current_date
        type: date
        params:
          format: "%Y-%m-%d"
    label: "[Social Strategy] Consulting Triage Call Interaction Note"
    comment: "---"
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :sigsys
    replace: "### Proprietary Signature System Design\n* Formula: $Signature System = Problem + Promise + Process$\n\n- **The Problem Core:** [State the primary high-friction marketplace inefficiency being resolved]\n- **The Promise Core:** [State the ultimate outcome achieved at Point Z]\n- **The Process Milestones:**\n  1. **Phase 1 (Quick Win / A → B):** [Low-friction intervention to establish trust and momentum]\n  2. **Phase 2 (Core Pivot):** [Implementation of the proprietary engine to resolve root obstacles]\n  3. **Phase 3 (Scale / Final Integration):** [Systemization to ensure long-term, repeatable outcomes]\n"
    label: "[Social Strategy] Proprietary Signature System Formula Design"
    comment: "### Proprietary Signature System Design"
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :p-market
    form:
      "Analyze the market for [[niche]]. Use only specific, data-backed insights. No generic statements.


      Deliver exactly four structured sections:

      1. Market sizing: TAM, SAM, and SOM with estimated dollar values and your assumptions

      2. Top 5 demand trends: each as a one-line headline + two-sentence explanation

      3. Top 5 underserved opportunities: specific gaps, not broad categories

      4. Follow the money: 3-5 areas where VC, PE, or acquirer capital is actively flowing


      Format each section with a bold heading, then concise bullet points. Total output: under 600 words.

      "
    form_fields:
      niche:
        multiline: true
    label: "[Social Strategy] Niche Market Demand & Competitive Teardown"
    comment: Analyze the market for . Use only specific, data-backed insights. No generic statements.
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :p-problem
    form: "List the top 10 problems in [[industry]].


      For each problem, score it on three dimensions:

      - Urgency (1-10): how painful/time-sensitive it is right now

      - Willingness to pay (1-10): how likely buyers are to spend money to solve it today

      - Growth trajectory: 'rising fast', 'stable', or 'declining'


      Also add a 'Complaint signal' column: yes/no for whether this problem surfaces frequently in reviews, forums, or sales calls.


      Output as a table with these exact columns:

      | # | Problem | Urgency | WTP | Trend | Complaint signal | Why it ranks here |


      Sort by combined Urgency + WTP score, highest first.

      "
    form_fields:
      industry:
        multiline: true
    label: "[Social Strategy] Top 10 High-Willingness-To-Pay Problems"
    comment: List the top 10 problems in .
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :p-offer
    form: "Create a high-converting offer for: [[problem]].


      Structure the output exactly like a landing page, with these labeled sections in order:

      1. Headline: one bold, benefit-driven statement

      2. ICP: who this is for (age, role, situation, pain level)

      3. Value proposition: the core transformation in one sentence

      4. Offer components: what's included (deliverables, bonuses, format)

      5. Pricing tiers: name, price, and what changes at each tier (low / mid / premium)

      6. Guarantee: specific risk-reversal language the customer sees

      7. Competitive edge: 3 reasons this beats the obvious alternatives


      Keep each section tight. No filler. Write it as if it will go directly onto a real landing page.

      "
    form_fields:
      problem:
        multiline: true
    label: "[Social Strategy] High-Converting Irresistible Offer Creator"
    comment: "Create a high-converting offer for: ."
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :p-distro
    form: "Act as a senior growth strategist.


      Build a realistic 30-day distribution plan for: [[idea]], including the target audience, product type, and rough budget.


      Deliverables:

      1. Top 5 acquisition channels: ranked by cost-efficiency for this specific audience

      2. Content format per channel: one specific format that works on each (short-form video, cold email sequence, SEO article)

      3. Weekly execution calendar: what happens in weeks 1, 2, 3, and 4 (not day-by-day)

      4. Organic vs paid split: recommended % allocation and rationale

      5. Leverage plays: 2-3 tactics that multiply reach without proportionally more effort (partnerships, repurposing, virality hooks)


      Be specific and realistic. Skip tactics that require a large team or $50k+ budget unless the budget context supports it. Output as a numbered system with clear section headers.

      "
    form_fields:
      idea:
        multiline: true
    label: "[Social Strategy] Growth Distribution & Channel Engine"
    comment: Act as a senior growth strategist.
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :p-viral
    form: 'Create a viral content strategy for: [[niche]].


      Deliver four components:

      1. Hook bank: 10 high-converting hooks (not 20, prioritize quality). For each, label which emotional trigger it uses: fear of missing out, social status, curiosity, or controversy.

      2. Content format matrix: a table with these columns:

      | Format | Platform | Ideal length | Why it spreads | Example title |

      Include 6-8 formats across at least 3 platforms.

      3. Shareability audit: for each format, answer "What makes someone forward/repost this?" in one sentence.

      4. Repeatable content system: a simple weekly template showing how many posts, which formats, and what rotation keeps the audience engaged without burnout.


      Output with bold section headers. Write the hooks in the voice of the niche, not generic marketing language.

      '
    form_fields:
      niche:
        multiline: true
    label: "[Social Strategy] Create A Viral Content Strategy For"
    comment: "Create a viral content strategy for: ."
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :p-competitor
    form: "Analyze the top 5 competitors in [[niche]], be specific.


      For each competitor, provide a structured row covering:

      - Name + one-line description of their core offer

      - What they do best (their defensible strength)

      - Where they are weak (product gaps, poor reviews, underserved use cases)

      - Which audience they ignore or underserve


      Then, based on the patterns across all 5:

      - Gap analysis: the 2-3 clearest white spaces no competitor is owning

      - Positioning recommendation: one sharp positioning statement that would differentiate a new entrant

      - Go-to-market angle: which ignored audience + which channel combination represents the fastest path to traction


      Output the competitor breakdown as a table, then the gap analysis and recommendations as prose.

      "
    form_fields:
      niche:
        multiline: true
    label: "[Social Strategy] Analyze The Top 5 Competitors In , Be Specific"
    comment: Analyze the top 5 competitors in , be specific.
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :p-scale
    form:
      "Give me a plan to scale this business to [[target_revenue]] within [[timeframe]].


      Business description:

      [[business_description]]


      Structure the output as a phased execution roadmap with these four phases:

      Phase 1 - Stabilize (Month 1-2): what to systematize and document before scaling

      Phase 2 - Automate (Month 3-4): top 3 processes to automate, with specific tool recommendations

      Phase 3 - Delegate (Month 5-8): what to hire for first, in order, with rough cost per role

      Phase 4 - Scale (Month 9-12): the growth lever (channel, product, or partnership) that unlocks the next revenue tier


      Also include:

      - Top 3 bottlenecks that will appear at each phase transition

      - One leading metric to track per phase (not vanity metrics)


      Output as a structured roadmap with phase headers, not a generic list.

      "
    form_fields:
      business_description:
        type: multiline
    label: "[Social Strategy] Leveraged Content Scaling Architecture"
    comment: Give me a plan to scale this business to  within .
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :yt-strategy
    form:
      "Act like a YouTube growth strategist. Analyze my niche, target audience, and content goals.


      Niche: [[niche]]

      Target Audience: [[audience]]

      Content Goals: [[goals]]


      Design a complete channel strategy including positioning, content pillars, upload frequency, and the fastest path to 1,000 subscribers and monetization.

      "
    form_fields:
      niche:
        type: text
        default: Software Engineering & Architecture
      audience:
        type: text
        default: Mid-to-Senior Developers
      goals:
        type: text
        default: Build a scalable brand and drive organic engine inbound leads
    label: "[Social Strategy] Act Like A Youtube Growth Strategist"
    comment: Act like a YouTube growth strategist. Analyze my niche, target audience, and content goals.
    search_terms:
      - social-strategy

      - social strategy
  - regex: :yt-ideas\((?P<niche>.*)\)
    replace:
      "Act like a YouTube content researcher. Generate 20 high-potential video ideas for {{niche}} based on viral trends, competitor analysis, and audience interest patterns.

      "
    label: "[Social Strategy] Niche Audience & Frustration Profiler"
    comment: Act like a YouTube content researcher. Generate 20 high-potential video ideas for {{niche}} based on viral trends, compe
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :aipitch
    form: |

      'Hi [[client_name]],


      I''ve been reviewing how workflows are structured at [[company_name]] and wanted to reach out regarding our **[[studio_division]]** offerings.


      Specifically, we've been helping teams implement **[[core_service]]** frameworks to optimize efficiency and drive measurable ROI.


      We typically kick things off with a structured kickoff to map out your current bottlenecks. Are you open to a quick 15-minute discovery call this week to see if this aligns with your current goals?


      Best regards,

      [[your_name]]

      '
    form_fields:
      studio_division:
        type: choice
        values:
          - AI Systems Agency
          - AI Strategy Consulting
          - AI Intelligence Services
          - AI Skill Academy
          - AI Writing Studio
          - AI Creative Studio
          - AI Mini Product Studio
      core_service:
        type: text
        default: Automated Workflow Integration
      your_name:
        type: text
        default: Founder
    label: "[Social Strategy] Aipitch"
    comment: Hi ,
    search_terms:
      - social-strategy

      - social strategy
  - trigger: :aimenu
    replace: "Our AI Studio Offerings:

      ---------------------------------------------------------

      1. AI Systems Agency (Automated business architecture)

      2. AI Strategy Consulting (Readiness & roadmapping)

      3. AI Intelligence Services (Data to decisions)

