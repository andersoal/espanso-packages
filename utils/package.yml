    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          shell: cmd
          cmd: set
    label: "[Utils] Environment Variables Diagnostic (cmd set)"
    comment: Dumps current shell environment variables for debugging Espanso.
    search_terms:
      - utils
