# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json
matches:
  # 1. RESUME CONVERSION OPTIMIZATION
  - trigger: ":p_optresume"
    form: |
      Act as an expert technical resume writer and ATS specialist.

      Review the following resume and rewrite it to maximize interview invitations. Ensure the final output satisfies these strict operational constraints:
      1. Use strong, high-impact action verbs at the start of every bullet point.
      2. Quantify results explicitly (e.g., efficiency gains, performance metrics, architectural decoupling impact).
      3. Format the response cleanly using standard Markdown headings and bullet lists optimized for parsing by Applicant Tracking Systems (ATS).
      4. Do not include any conversational introductions, filler text, or meta-commentary. Output only the rewritten resume.

      ---
      CURRENT RESUME:
      [[resume]]
    form_fields:
      resume:
        type: multiline

  # 2. PROFESSIONAL FIT ANALYZER
  - trigger: ":p_fitcheck"
    form: |
      Act as an elite executive talent scout and market analyst.

      Analyze my professional background provided below. Deliver a comprehensive report listing 10 high-paying, high-leverage target roles I am qualified for.

      Order the output strictly by a combination of salary potential and current market demand. For each role, provide:
      - Role Title
      - Core Market Demand Driver (Why it is hot right now)
      - Estimated Total Compensation Tier
      - Critical Skills Gap/Pivot Warning (if any)

      ---
      PROFESSIONAL BACKGROUND:
      [[background]]
    form_fields:
      background:
        type: multiline

  # 3. RESUME-JOB MATCH
  - trigger: ":p_resmatch"
    form: |
      Act as an advanced ATS Optimization Engine.

      Analyze the target Job Description against the provided Resume. Execute the following steps:
      1. **Keyword Gap Analysis**: List critical missing technical skills, methodologies, keywords, or hard competencies omitted from the resume.
      2. **ATS Scoring Adjustment**: Rewrite the target areas of the resume to integrate those missing elements naturally, aiming for a structural match score above 90%.
      3. Ensure all modifications remain authentic to the original background data while maximizing algorithmic alignment.

      ---
      JOB DESCRIPTION:
      [[job_desc]]

      ---
      CURRENT RESUME:
      [[resume]]
    form_fields:
      job_desc:
        type: multiline
      resume:
        type: multiline

  # 4. INTERVIEW SIMULATOR
  - trigger: ":p_interview"
    form: |
      Act as a rigorous, senior technical interviewer for the role described below.

      Generate a comprehensive interview prep guide containing 15 realistic, highly contextual interview questions (covering core system architecture, problem-solving, and professional behavioral delivery) based strictly on this role profile.

      For each question, provide a high-caliber sample answer that demonstrates domain expertise, sounds confident, and balances technical accuracy with natural delivery.

      ---
      ROLE PROFILE / JOB POSTING:
      [[job_posting]]
    form_fields:
      job_posting:
        type: multiline

  # 5. PORTFOLIO & PROOF OF SKILLS BUILDER
  - trigger: ":p_portfolio"
    form: |
      Act as a pragmatic engineering advisor.

      Target Role: [[role]]

      Generate 3 highly targeted project ideas or portfolio execution examples that a senior professional can rapidly build within a 7-day cycle. Every project blueprint must be engineered to provide undeniable, undeniable proof of elite skill execution to demanding employers and instantly elevate architectural credibility. Focus on complex integrations, real-time data handling, or system performance bottlenecks.
    form_fields:
      role:
        type: text
        default: "Software Engineer"

  # 6. SALARY NEGOTIATION SCRIPT
  - trigger: ":p_negotiate"
    form: |
      Act as a world-class corporate negotiation coach.

      Initial Offer Base: [[amount]]

      Draft a professional, authoritative, and deeply confident script engineered to negotiate a 15-20% compensation expansion. The narrative must remain intensely collaborative, grounded in massive value delivery, and completely free of pushy, arrogant, or defensive language. Provide both an email framework and an active verbal dialogue script.
    form_fields:
      amount:
        type: text
        default: "$150,000"

  # 7. RECRUITER FOLLOW-UP MESSAGE GENERATOR
  - trigger: ":p_followup"
    form: |
      Act as an expert in elite corporate communications.

      Recruiter Name: [[recruiter_name]]
      Target Role: [[role]]

      Write a highly crisp, high-impact follow-up message optimized for a professional network platform or direct communication channel. The text must forcefully but elegantly reinforce my precise fit for the role, anchor on immediate value delivery, and maintain top-of-mind recall with the recruiter. Keep it persuasive, deeply respectful, and highly professional.
    form_fields:
      recruiter_name:
        type: text
      role:
        type: text

  # 1/ Resume conversion fixer (Source: 9830ab2e57a69ab0a960caa74f759c50.png)
  - trigger: ":pfix"
    form: |
      Here is my resume:
      [[resume]]

      Rewrite it to maximize interview callbacks. Use strong action verbs, quantified results, and ATS-friendly formatting, without exaggeration.
    form_fields:
      resume:
        type: multiline

  # 2/ Job description matcher (Source: cb7e21ffdc1228c461ad98ab6fc75f71.png)
  - trigger: ":pmatch"
    form: |
      Job description:
      [[jd]]

      Resume:
      [[resume]]

      Identify missing keywords and rewrite my resume so it matches this role as closely as possible while staying honest.
    form_fields:
      jd:
        type: multiline
      resume:
        type: multiline

  # 3/ Role fit finder (Source: 99e372a2821b214f35a8b00a4fcae92c.png)
  # Fixes typo "likelihousd" -> "likelihood"
  - trigger: ":pfit"
    word: true
    form: |
      Based on my experience and skills:
      [[skills]]

      List 10 roles I'm qualified for that I might be overlooking. Rank them by hiring demand and response likelihood.
    form_fields:
      skills:
        type: multiline

  # 4/ Bullet point upgrader (Source: a353d5467fe34573bed02fb30d9ecde3.png)
  - trigger: ":pbullet"
    form: |
      Rewrite these resume bullet points:
      [[bullets]]

      Make them clearer, more results-focused, and more impressive to recruiters in under 2 lines each.
    form_fields:
      bullets:
        type: multiline

  # 5/ Cover letter personalizer (Source: 1a419d10f2515d8eee12bfd39e304d78.png)
  - trigger: ":pcover"
    form: |
      Write a short, tailored cover letter for this role:
      [[jd]]

      Make it sound human, confident, and specific, not generic or AI-written.
    form_fields:
      jd:
        type: multiline

  # 6/ Recruiter hook message (Source: abab44c303473b95f4211158e26dbcd4.png)
  - trigger: ":phook"
    form: |
      Write a concise LinkedIn or email message to a recruiter for this role:
      [[jd]]

      The goal is to spark interest and get a reply, not ask for a favor.
    form_fields:
      jd:
        type: multiline

  # 7/ Application optimizer (Source: c004d1c2a80aadcaf608eb3232238868.png)
  - trigger: ":popt"
    form: |
      Based on my background and target roles:
      [[background]]

      Create a smarter application strategy. Tell me how many roles to apply for weekly, how to customize efficiently, and how to follow up.
    form_fields:
      background:
        type: multiline

  # 1. DREAM-ROLE PRECISION TARGETING
  - trigger: ":p-dream"
    form: |
      "Act as a senior hiring manager and career strategist. Analyze my skills, experience, interests, constraints, and current market demand to identify the exact job roles I should target. Eliminate unsuitable roles and clearly define my ideal position, responsibilities, company type, and hiring expectations. My background: {{clip}}"
    vars:
      - name: clip
        type: clipboard

  # 2. RECRUITER-GRADE RESUME CREATION
  - trigger: ":p-resume"
    form: |
      "Act as a senior recruiter with deep ATS expertise. Create a resume tailored specifically for my target role [[job_title]]. Convert responsibilities into measurable impact, integrate role-specific keywords naturally, and structure it for fast recruiter scanning and ATS compatibility. My experience: {{clip}}. Job description: [[job_description]]"
    form_fields:
      job_title:
        type: text
      job_description:
        type: multiline
    vars:
      - name: clip
        type: clipboard

  # 3. LINKEDIN PROFILE OPTIMIZATION
  - trigger: ":p-linkedin"
    form: |
      "Act as a recruiter who sources candidates daily on LinkedIn. Rewrite my headline, summary, and experience so my value, role fit, and expertise are immediately clear. Optimize for recruiter searches and human scanning while keeping the tone professional and credible. Profile details: {{clip}}."
    vars:
      - name: clip
        type: clipboard

  # 4. RESUME REJECTION DETECTOR
  - trigger: ":p-reject"
    form: |
      "Review my resume exactly as a recruiter would. Identify every reason it could be rejected, ignored, or misunderstood. Highlight weak bullets, unclear positioning, missing signals, or credibility gaps, then rewrite those sections so the resume becomes interview-ready. Resume: {{clip}}."
    vars:
      - name: clip
        type: clipboard

  # 1/ The Recruiter Attention Test
  - trigger: ":res-attention"
    replace: "I want you to evaluate my resume the same way a recruiter would during the first 10 seconds of scanning it. Tell me what stands out immediately, what feels forgettable, and whether my resume communicates enough value fast enough to compete with stronger applicants. Analyze the layout, positioning, clarity, and first impression. Explain whether this resume makes me look experienced, credible, and worth interviewing - or just average among hundreds of candidates."

  # 2/ The Recruiter Mindset Breakdown
  - trigger: ":res-mindset"
    form: |
      Review my resume as if you're evaluating hundreds of candidates for a highly competitive role in [[industry]]. I want a raw and realistic assessment of how my resume performs in a real hiring environment. Point out every weak area that could lower my chances of getting shortlisted - including unclear positioning, weak achievements, poor structure, generic wording, missing credibility signals, or anything that makes me look average compared to stronger candidates. Tell me what instantly creates a negative impression, what feels forgettable, and what changes would make this resume look significantly more valuable, skilled, and interview-worthy.
    form_fields:
      industry:
        type: text
        default: "the Salesforce and MuleSoft ecosystem"

  # 3/ The ATS Visibility Engine
  - trigger: ":res-ats"
    replace: "I'm targeting this specific job opportunity, and I want my resume to be optimized for both ATS systems and real recruiters. Analyze the job description alongside my resume and identify the technical terms, role-specific phrases, competencies, and industry keywords that are currently underrepresented or completely absent. Show me how to naturally integrate those elements into my resume without making it feel stuffed or artificial. Recommend improvements to my experience section, skills layout, and wording strategy so my resume aligns more closely with the expectations of this role and performs better during automated screening."

  # 4/ The Impact Statement Rebuilder
  - trigger: ":res-impact"
    replace: "Transform the experience section of my resume into high-value achievement statements that sound compelling to recruiters and hiring managers. Replace weak or responsibility-focused lines with results-oriented descriptions that clearly communicate ownership, contribution, and business impact. Wherever my resume lacks measurable outcomes, ask strategic follow-up questions to uncover useful metrics, improvements, efficiencies, revenue impact, time savings, or performance gains. The final version should make every bullet point feel intentional, credible, and strong enough to justify an interview."

  # 5/ The Market Positioning Rewrite
  - trigger: ":res-market"
    form: |
      Study the hiring style, communication patterns, and professional expectations commonly seen in companies such as [[companies]] within [[industry]]. Then reshape my resume summary and core skills section so they reflect the mindset, priorities, and terminology valued in this field. I want my resume to feel aligned with the industry's standards and culture instead of sounding broad, outdated, or interchangeable with every other applicant. Focus on making my profile appear specialized, relevant, and naturally suited for the type of opportunities these companies offer.
    form_fields:
      companies:
        type: text
        default: "Gerdau, Wellhub, or top-tier telecom providers"
      industry:
        type: text
        default: "B2B digital transformation and API integration"

  # 6/ The Executive Resume Refinement System
  - trigger: ":res-executive"
    replace: "Conduct a deep final-pass evaluation of my resume from the perspective of a recruiter reviewing top-tier candidates. Identify anything that weakens clarity, professionalism, credibility, or overall impact. This includes inconsistent writing style, repetitive sentence structure, vague descriptions, weak transitions, low-value wording, and overused corporate phrases that fail to differentiate me. Refine the language throughout the resume so every section sounds precise, intentional, and high-value. Replace generic statements with sharper positioning, stronger achievement-driven phrasing, and wording that reflects expertise, confidence, and real-world contribution. The final resume should feel polished, modern, and competitive at a professional level."

  # Career clarity & purpose finder
  # Source: 7a46afec47b1dfdc7f38866e7e19b845.png
  - trigger: ":pcareer"
    form: |
      I'm feeling stuck in my career and unsure of my direction. Ask me 10 deep questions about my skills, interests, values, and past experiences that brought me joy. Based on my answers, identify 3-5 potential career paths that align with who I am, and create a 90-day action plan to explore each one with specific steps, resources, and milestones.

  # Should I stay or should I go?
  - trigger: ":p-decision"
    replace: |
      “Using what you know about my career goals and values, create a decision tree for this dilemma: [describe your dilemma, e.g. should I change jobs or stay?]. Ask 7 yes/no questions that filter step by step based on my priorities as you know them from our conversations. Make the outcomes super concrete, with clear actions (like ‘request this meeting,’ ‘update your CV,’ ‘plan a trial day’), not vague suggestions. Format it so I can screenshot it and reuse it anytime.”

  # What is my personal recipe for success?
  - trigger: ":p-success"
    replace: |
      “Based on my talents and character, what’s the way I can be most successful and happy in my career and life?”

  # The Profile-As-Landing-Page Rewriter
  - trigger: ":profile-as-lp"
    form: |

      Act as a LinkedIn profile strategist trained on Justin Welsh's principle that your profile is not a resume - it is the highest-converting landing page you will ever own. Job-seekers optimize for keywords. Operators optimize for one specific reader who, if they understood what you do in 12 seconds, would either book a call, subscribe, or remember you for later.

      Rebuild my profile as a landing page:

      Rewrite my headline so it answers three questions in under 220 characters: who I help, what I help them do, and how they know I'm credible

      Rewrite my About section as a one-screen pitch - first sentence earns the read, middle three sentences prove the claim, final sentence tells them exactly what to do next

      Audit my Featured section and replace anything that doesn't generate leads, subscribers, or recognition with assets that do

      Rewrite each Experience entry as a contribution statement what I shipped, who it served, what changed - never a job description

      Stress-test the rebuilt profile against the question "would my ideal client know what to do within 12 seconds of landing here"

      Inputs: My current headline, About section, and top three Experience entries. The single person I want to convert (specific, not a demographic). My one offer or asset I want them to engage with.

      Output: Rewritten Headline → One-Screen About Section → Featured Section Audit

      Rewritten Experience Entries → 12-Second Conversion Verdict

  # AI Interview Simulation & Performance Coach
  - trigger: ":ai-interview"
    form: |
      Roleplay as a [[job_title]] at [[company]].

      Using my CV and the job description:
      - Conduct a behavioral interview
      - Ask one challenging question at a time
      - After each answer, provide: Critique (strengths) & Refinement (how to improve impact)
      - Gradually increase difficulty level
    form_fields:
      job_title:
        type: text
      company:
        type: text
