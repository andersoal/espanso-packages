      - :search-dockerhub
    replace: https://hub.docker.com/search?q=
    label: "[Utils] Search DockerHub"
    comment: Quick search query URL prefix for DockerHub
    search_terms:
      - utils
  - triggers:
      - :s-wa

      - :search-wolframalpha
    replace: https://www.wolframalpha.com/input/?i=
    label: "[Utils] Search WolframAlpha"
    comment: Quick search query URL prefix for WolframAlpha
    search_terms:
      - utils
  - triggers:
      - :s-red

      - :search-reddit
    replace: https://www.reddit.com/search/?q=
    label: "[Utils] Search Reddit"
    comment: Quick search query URL prefix for Reddit
    search_terms:
      - utils
  - triggers:
      - :s-bbc

      - :search-bbc
    replace: https://www.bbc.co.uk/search?q=
    label: "[Utils] Search BBC"
    comment: Quick search query URL prefix for BBC
    search_terms:
      - utils
  - triggers:
      - :s-vt

      - :search-virustotal
    replace: https://www.virustotal.com/gui/search/
    label: "[Utils] Search VirusTotal"
    comment: Quick search query URL prefix for VirusTotal
    search_terms:
      - utils
  - triggers:
      - :s-amz

      - :search-amazon
    replace: https://amazon.co.uk/s?k=
    label: "[Utils] Search Amazon"
    comment: Quick search query URL prefix for Amazon
    search_terms:
      - utils
  - triggers:
      - :s-yt

      - :search-youtube
    replace: https://youtube.com/results?q=
    label: "[Utils] Search YouTube"
    comment: Quick search query URL prefix for YouTube
    search_terms:
      - utils
  - triggers:
      - :s-maps

      - :search-maps
    replace: https://www.google.com/maps/search/
    label: "[Utils] Search Google Maps"
    comment: Quick search query URL prefix for Google Maps
    search_terms:
      - utils
  - triggers:
      - :s-goo

      - :search-google
    replace: https://google.com/search?q=
    label: "[Utils] Search Google"
    comment: Quick search query URL prefix for Google
    search_terms:
      - utils
  - trigger: :s-choice
    replace: "{{form_data.engine}}{{form_data.query}}"
    vars:
      - name: form_data
        type: form
        params:
          layout: "Search Engine: [[engine]]

            Query: [[query]]

            "
          fields:
            engine:
              type: choice
              values:
                - label: Google
                  id: https://google.com/search?q=
                - label: DuckDuckGo
                  id: https://duckduckgo.com/?q=
                - label: Wikipedia
                  id: https://en.wikipedia.org/w/?search=
                - label: GitHub
                  id: https://github.com/search?q=
                - label: StackOverflow
                  id: https://stackoverflow.com/search?q=
                - label: DockerHub
                  id: https://hub.docker.com/search?q=
                - label: WolframAlpha
                  id: https://www.wolframalpha.com/input/?i=
                - label: Reddit
                  id: https://www.reddit.com/search/?q=
                - label: BBC
                  id: https://www.bbc.co.uk/search?q=
                - label: VirusTotal
                  id: https://www.virustotal.com/gui/search/
                - label: Amazon
                  id: https://amazon.co.uk/s?k=
                - label: YouTube
                  id: https://youtube.com/results?q=
                - label: Google Maps
                  id: https://www.google.com/maps/search/
            query:
              type: text
    label: "[Utils] Search Chooser"
    comment: "{{form_data.engine}}{{form_data.query}}"
    search_terms:
      - utils
  - trigger: :swc-ddg
    replace: https://duckduckgo.com/?q={{clipboard}}
