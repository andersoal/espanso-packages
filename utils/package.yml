  - trigger: :faker
    replace: "{{output}}"
    vars:
      - name: module
        type: choice
        params:
          values:
            - label: First Name
              id: first_name
            - label: Company
              id: company
            - label: Phone Number
              id: phone_number
            - label: File Name
              id: file_name
            - label: Street Address
              id: address
            - label: SSN
              id: ssn
            - label: Email
              id: email

      - name: output
