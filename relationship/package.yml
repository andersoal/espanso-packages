# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  # SKILL 1: DATE NIGHT PLANNER
  - trigger: ":dateplan"
    form: |
      Act as our AI Relationship Concierge and Date Night Planner. Generate exactly three distinct date options for this weekend using this structural criteria:
      - Current Location Context: [[city]]
      - Shared Budget Cap: $[[budget]]
      - Core Rules: Avoid duplicating our last 8 dates. Focus on trying new things or leveling up routine spots.

      Please format the response into these exact structural items:
      1. 🕯️ COZY NIGHT IN (Elevated home activity, culinary focus, or low-cost pairing)
      2. 🌇 OUT TOGETHER (Local spot, budget-conscious, zero-friction or no reservations required)
      3. ✨ NEW THING NEITHER OF US HAS TRIED (Activity, interactive class, or unconventional event)
    form_fields:
      city:
        type: text
        default: "Austin, TX"
      budget:
        type: text
        default: "60"

  # SKILL 2: THE FINANCIAL CHECK-IN
  - trigger: ":fincheck"
    form: |
      Act as our joint Financial Strategist. Below is our baseline snapshot for the past week. Analyze our current spending velocity, note anything out of the ordinary, and evaluate our progress tracking toward our primary joint savings milestone ([[goal]]).

      WHAT WENT OUT THIS WEEK:
      - Fixed Housing/Rent: $[[rent]]
      - Household Groceries: $[[groceries]]
      - Discretionary Dining Out: $[[dining]]
      - Subscriptions/Recurring fees: $[[subs]]
      - Anomalous/One-off Outlays: [[unusual]]

      Provide a concise 10-minute check-in brief summarizing wins, variations, and automated pacing.
    form_fields:
      rent:
        type: text
        default: "2100"
      groceries:
        type: text
        default: "187"
      dining:
        type: text
        default: "96"
      subs:
        type: text
        default: "43"
      unusual:
        type: text
        default: "None"
      goal:
        type: text
        default: "Europe Trip Fund"

  # SKILL 3: THE MENTAL LOAD SPLITTER
  - trigger: ":loadsplit"
    form: |
      Act as our domestic operations manager. We need to split the following collective list of household tasks, appointments, and chores fairly across both of us for the coming week to balance the invisible mental load evenly.

      UNALLOCATED HOUSEHOLD LIST:
      [[tasks]]

      Please assess the time commitment and complexity of each item, then output a balanced, fair weekly schedule assigning specific days and responsibilities to each person.
    form_fields:
      tasks:
        type: multiline
        default: |
          - Call dentist to reschedule Jake's appointment
          - Mid-week grocery run
          - Order anniversary/birthday gift
          - Drop dog off at the groomer (10am Sat)

  # SKILL 4: THE TRIP PLANNER
  - trigger: ":tripplan"
    form: |
      Act as a high-end customized travel concierge. Build a personalized, day-by-day vacation itinerary using our specific, asymmetric travel profiles:

      TRIP PARAMETERS:
      - Target Destination: [[destination]]
      - Timing/Seasonality: [[dates]]

      OUR INDIVIDUAL TRAVEL PROFILES:
      - Person A Profile: Morning Pace = [[pace_a]] | Dietary Exclusions = [[food_a]] | Target Vibe = [[vibe_a]]
      - Person B Profile: Morning Pace = [[pace_b]] | Dietary Exclusions = [[food_b]] | Target Vibe = [[vibe_b]]

      Synthesize these parameters into a single harmonious itinerary that accommodates both paces gracefully, highlighting optimal food spots and flight tracking guidelines.
    form_fields:
      destination:
        type: text
        default: "Lisbon, Portugal"
      dates:
        type: text
        default: "September"
      pace_a:
        type: text
        default: "Slow, coffee first"
      food_a:
        type: text
        default: "No shellfish"
      vibe_a:
        type: text
        default: "Mix of culture + rest"
      pace_b:
        type: text
        default: "Early hike ok"
      food_b:
        type: text
        default: "Eats everything"
      vibe_b:
        type: text
        default: "Wants at least 1 adventure"

  # SKILL 5: THE MEMORY KEEPER
  - trigger: ":memkeep"
    form: |
      Act as our relationship archivist. Commit the following newly captured memories, inside jokes, and milestones into our relationship ledger:

      NEW LOG ENTRIES:
      [[entries]]

      Cross-reference our ongoing timeline, summarize structural themes of growth over the past year, and construct a warm anniversary card prompt, reflective toast suggestion, or surprise gift idea based on these logged details.
    form_fields:
      entries:
        type: multiline
        default: |
          - First time making homemade pizza together (the dough disaster)
          - Adopted our dog Luna
          - Celebrated career promotion dinner at Rosewood

  # 1. Full Memory Dump (Image 1)
  - trigger: ":aimem"
    replace: |
      Lay out everything you've stored and remember about me, all of it, as one complete list. Names, places, work, habits, preferences, anything. Don't summarize or leave anything out. I want to see the full file you've built on me from our conversations.

  # 2. Hidden Inferred Profile (Image 2)
  - trigger: ":aiprofile"
    replace: |
      Tell me everything you've figured out about me that I never actually stated, the things you inferred from how I write, what I ask, and what I avoid. My age range, income level, where I likely live, my situation. Show me exactly what tipped you off for each one.

  # 3. Tradutor de Assuntos Impossíveis (Image 3)
  # Improvement: Upgraded to an interactive form so you can supply the context inline!
  - trigger: ":tradutor"
    form: |
      Conteúdo para analisar:
      [[conteudo]]

      Antes de explicar este conteúdo, me diga: Qual é a única frase que, se eu entender, fará todo o resto fazer sentido?

      Explique apenas essa frase.

      Use uma analogia simples.

      Depois me faça 3 perguntas para testar se eu realmente entendi.
    form_fields:
      conteudo:
        type: multiline

  # 4. Detector de Falsos Especialistas (Image 4)
  # Improvement: Interactive form replaces [HABILIDADE] dynamically
  - trigger: ":expert"
    form: |
      Eu acho que domino [[habilidade]]. Prove que estou errado. Faça [[quantidade_de_perguntas]] perguntas simples que revelem lacunas de conhecimento.

      Para cada resposta, me diga exatamente o que ainda falta na minha base.
    form_fields:
      habilidade:
        type: text
        default: ""
      nivel:
        type: choice
        values:
          - "Iniciante"
          - "Intermediário"
          - "Avançado"
          - "Especialista"
      quantidade_de_perguntas:
        type: text
        default: "5"

  # 5. Quick Text Guide: Privacy Clean Up Checklist (Images 5 & 6 combo)
  #- trigger: ":aiprivacy"
  #  replace: |
